,\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"stele-fragment-met\",\"status\":\"modeled\",\"dealGroup\":\"relief\",\"title\":{\"zh\":\"信众社团发愿造像碑\",\"en\":\"Stele Commissioned by Members of a Devotional Society\"},\"typeLabel\":{\"zh\":\"石刻\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"北魏建义元年（528）\",\"en\":\"Northern Wei dynasty (386–534), dated 528\"},\"materialTechnique\":{\"zh\":\"石灰岩，残留彩绘\",\"en\":\"Limestone with traces of pigment\"},\"collection\":{\"museum\":{\"zh\":\"大都会艺术博物馆\",\"en\":\"The Metropolitan Museum of Art\"},\"city\":{\"zh\":\"纽约\",\"en\":\"New York\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"65.29.1\",\"url\":\"https://www.metmuseum.org/art/collection/search/42710\"},\"dimensions\":{\"zh\":\"高 231.1 厘米，宽 60.6 厘米，厚 24.1 厘米\",\"en\":\"H. 231.1 cm, W. 60.6 cm, D. 24.1 cm\"}},\"description\":{\"zh\":\"七十个人一起出钱，立了这通碑。碑座上的题记说，这是在 528 年，为皇帝、为国家、为各家的祖先发的愿⁽¹⁾。\\n\\n碑高两米三，正面最大的龛里坐着佛，两旁是菩萨、弟子、狮子和力士。出钱的人也都在碑上：按身份高低，一排排刻在正面、侧面和背面；两位出力最多的，各占一个小龛，在大龛的左上和右上⁽¹⁾。这样的造像碑，6 世纪初在北方很常见⁽¹⁾。它原来立在哪里已经不知道了，1965 年入藏大都会⁽¹⁾。\",\"en\":\"Dated by its inscription to 528, this stele records a dedication by seventy people. Sacred figures and donors occupy a carefully ordered surface.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"stele-fragment-met-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"stele-fragment-met-hd.glb\",\"modelLantern\":\"stele-fragment-met-lantern.glb\"},\"orchestration\":{\"importance\":\"standard\",\"category\":\"mural\",\"tags\":[\"碑刻\",\"石刻\",\"Met\"]},\"lanternConfig\":{\"caseType\":\"tall\",\"mount\":\"pedestal\",\"caseFootprint\":0.72,\"paddingSide\":0.14,\"paddingTop\":0.22,\"modelScale\":1,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#ceb782\",\"intensity\":1.5,\"position\":[0,0.98,0.5],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":1.6353981633974484,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.07,0.155,0.17],\"distance\":5,\"decay\":2,\"angle\":2.6179938779914944,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":0.85,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"信眾社團發願造像碑\",\"subtitle\":{\"zh\":\"七十人的愿，刻在一座石碑上。\",\"en\":\"Seventy donors, one enduring dedication.\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国北方（原址不详）\",\"en\":\"Northern China (original site unknown)\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"信众社团发愿造像碑\",\"oneLiner\":\"七十人的愿，刻在一座石碑上。\",\"period\":\"北魏建义元年（528）\",\"size\":\"高 231.1 厘米，宽 60.6 厘米，厚 24.1 厘米\",\"craft\":\"石灰岩，残留彩绘\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"65.29.1\"],[\"入藏年份\",\"1965\"]],\"intro\":[\"七十个人一起出钱，立了这通碑。碑座上的题记说，这是在 528 年，为皇帝、为国家、为各家的祖先发的愿⁽¹⁾。\",\"碑高两米三，正面最大的龛里坐着佛，两旁是菩萨、弟子、狮子和力士。出钱的人也都在碑上：按身份高低，一排排刻在正面、侧面和背面；两位出力最多的，各占一个小龛，在大龛的左上和右上⁽¹⁾。这样的造像碑，6 世纪初在北方很常见⁽¹⁾。它原来立在哪里已经不知道了，1965 年入藏大都会⁽¹⁾。\"],\"about\":{\"title\":\"造像碑\",\"paras\":[{\"h\":\"把自己刻上去\",\"sub\":\"$undefined\"},\"一个人造不起一尊像，就大家凑钱。北朝的信众常常结成团体，合力造一通碑，立在寺院里或路口。碑上除了佛，最要紧的就是名字和人像：谁出了钱，谁的功德。大都会说，这通碑上的施主像是「象征性的肖像」，按等级排列⁽¹⁾。\",\"背面有六位身形较大的供养人。大都会 1965 年入藏时的介绍说，他们的样子和龙门那幅《孝文帝礼佛图》里的人物很接近⁽⁴⁾。那幅浮雕，本馆也有。\",{\"h\":\"同一个作坊\",\"sub\":\"$undefined\"},\"波士顿美术馆有一通很像的碑，年号晚一年，是 529 年。大都会的周方认为，两通碑一定出自同一个作坊⁽⁴⁾。\",{\"h\":\"二百年后又刻了一次\",\"sub\":\"$undefined\"},\"碑上还有第二条题记，年份是 743 年，是唐代人补刻上去的。周方说，把碑上、洞里每一块空着的地方都用上，在当时并不稀奇⁽⁴⁾。\",{\"h\":\"528 年\",\"sub\":\"$undefined\"},\"碑上的年号是建义元年。这一年的洛阳出了大事：四月，契胡首领尔朱荣带兵入洛，把胡太后和幼主沉入黄河，又在河阴屠杀了上千名王公大臣，史称「河阴之变」；随后立元子攸为帝，改元建义⁽³⁾。\",\"「建义」这个年号只用了几个月。七十位信众为之祈福的那位皇帝，正是刚刚在这场屠杀之后登基的孝庄帝。两年多以后，他也被尔朱氏所杀；534 年，北魏分裂成东西两半⁽³⁾。\",{\"h\":\"碑上的演出\",\"sub\":\"$undefined\"},\"主龛下面，跪着的人物两侧有杂技艺人。大都会认为，这透露了当年一通公共的碑落成时，现场会有什么样的表演⁽¹⁾。\",\"碑顶盘着六条龙，缠成一团，护着小佛龛，也护着整通碑。周方说，碑上的龙、朱雀、杂技艺人和鹿，是汉代的想象混进了佛教⁽⁴⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它原来立在哪里，没有记录。最早的著录是喜龙仁 1929 至 1930 年的《中国早期艺术史》；1937 年，它在巴黎橘园美术馆的中国雕塑展上，是图录的第 1 号；1940 年，它出现在卢芹斋纽约的石雕展上⁽¹⁾。也就是说，至迟 1920 年代末，它已经到了卢芹斋手里。\",\"卢芹斋退休后，生意由卡罗（Frank Caro）接手。1965 年，大都会用赛克勒基金从卡罗手里买下它。它和广胜寺的药师佛壁画是同一年、同一个来源进的馆，编号挨着：65.29.1 和 65.29.2。今天两件也在同一间展厅⁽¹,²⁾。\"],\"items\":[{\"at\":\"528 年\",\"text\":\"北魏建义元年，七十位信众发愿立碑⁽¹⁾。\"},{\"at\":\"743 年\",\"text\":\"唐代人在碑上补刻了第二条题记⁽⁴⁾。\"},{\"at\":\"1929—1930 年\",\"text\":\"喜龙仁收入《中国早期艺术史》⁽¹⁾。\"},{\"at\":\"1937 年\",\"text\":\"在巴黎橘园美术馆的中国雕塑展上展出⁽¹⁾。\"},{\"at\":\"1940 年\",\"text\":\"在卢芹斋纽约的中国石雕展上展出⁽¹⁾。\"},{\"at\":\"1965 年\",\"text\":\"大都会以赛克勒基金购自卡罗，编号 65.29.1⁽¹⁾。\"}]},\"refs\":[\"大都会艺术博物馆：《Stele commissioned by members of a devotional society》（北魏建義元年 石雕造像碑），65.29.1。用于年代、尺寸、材质、展签（碑座题记、七十位施主、为皇帝国家与祖先发愿、两位主要施主的小龛、主龛、百戏人物、三位身份不明的贵人）、来源栏（卢芹斋旧藏，卡罗 1965 年售予大都会）及参考书目（喜龙仁 1929—30、1937 年巴黎橘园展、1940 年卢芹斋石雕展）。https://www.metmuseum.org/art/collection/search/42710\",\"大都会艺术博物馆：《Buddha of Medicine Bhaishajyaguru (Yaoshi fo)》，65.29.2。同年、同一来源入藏的广胜寺壁画，与此碑同在 206 展厅。https://www.metmuseum.org/art/collection/search/42716\",\"〔北齐〕魏收：《魏书》卷十《孝庄纪》。用于武泰元年（528）四月尔朱荣入洛、河阴之变、孝庄帝即位改元建义，及孝庄帝之死。遇害人数《魏书》《资治通鉴》记载不一，正文只写「上千」；本条凭通行说法写成，未逐句核对原书。\",\"Fong Chow（周方）：《Chinese Buddhist Sculpture》，The Metropolitan Museum of Art Bulletin 23, no. 9（1965 年 5 月），页 312–13，图 17、18。用于碑上另有一条 743 年的唐代题记、波士顿美术馆 529 年碑出自同一作坊、背面六位大供养人与《孝文帝礼佛图》人物相近、龙凤杂技与鹿为汉代遗风，及碑顶六龙。https://www.metmuseum.org/met-publications/the-metropolitan-museum-of-art-bulletin-v-23-no-9-may-1965\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Stele Commissioned by Members of a Devotional Society\",\"oneLiner\":\"Seventy donors, one enduring dedication.\",\"period\":\"Northern Wei dynasty (386–534), dated 528\",\"size\":\"H. 231.1 cm, W. 60.6 cm, D. 24.1 cm\",\"craft\":\"Limestone with traces of pigment\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"65.29.1\"],[\"Acquired\",\"1965\"]],\"intro\":[\"Dated by its inscription to 528, this stele records a dedication by seventy people. Sacred figures and donors occupy a carefully ordered surface.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"Principal donors appear in upper niches. Acrobats below suggest the public ceremonies that might accompany a dedication.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"The Met acquired the stele through the Sackler Fund in 1965, accession 65.29.1.\"],\"items\":[{\"at\":\"1965\",\"text\":\"Acquired by The Met through the Sackler Fund.\"}]},\"refs\":[\"大都会艺术博物馆：《Stele commissioned by members of a devotional society》（北魏建義元年 石雕造像碑），65.29.1。用于年代、尺寸、材质、展签（碑座题记、七十位施主、为皇帝国家与祖先发愿、两位主要施主的小龛、主龛、百戏人物、三位身份不明的贵人）、来源栏（卢芹斋旧藏，卡罗 1965 年售予大都会）及参考书目（喜龙仁 1929—30、1937 年巴黎橘园展、1940 年卢芹斋石雕展）。https://www.metmuseum.org/art/collection/search/42710\",\"大都会艺术博物馆：《Buddha of Medicine Bhaishajyaguru (Yaoshi fo)》，65.29.2。同年、同一来源入藏的广胜寺壁画，与此碑同在 206 展厅。https://www.metmuseum.org/art/collection/search/42716\",\"〔北齐〕魏收：《魏书》卷十《孝庄纪》。用于武泰元年（528）四月尔朱荣入洛、河阴之变、孝庄帝即位改元建义，及孝庄帝之死。遇害人数《魏书》《资治通鉴》记载不一，正文只写「上千」；本条凭通行说法写成，未逐句核对原书。\",\"Fong Chow（周方）：《Chinese Buddhist Sculpture》，The Metropolitan Museum of Art Bulletin 23, no. 9（1965 年 5 月），页 312–13，图 17、18。用于碑上另有一条 743 年的唐代题记、波士顿美术馆 529 年碑出自同一作坊、背面六位大供养人与《孝文帝礼佛图》人物相近、龙凤杂技与鹿为汉代遗风，及碑顶六龙。https://www.metmuseum.org/met-publications/the-metropolitan-museum-of-art-bulletin-v-23-no-9-may-1965\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-stele-1\",\"title\":\"碑座上的题记\",\"text\":\"最底下的碑座刻着字：528 年，七十个人，为皇帝、为国家、为祖先⁽¹⁾。\"},{\"id\":\"rec-stele-2\",\"title\":\"两位大施主\",\"text\":\"大龛的左上角和右上角，各有一个小龛，里面是出力最多的两位施主⁽¹⁾。他们给自己留了离佛最近的位置。\"},{\"id\":\"rec-stele-3\",\"title\":\"主龛\",\"text\":\"佛坐在正中，两旁是菩萨和弟子，下面蹲着狮子，站着力士⁽¹⁾。\"},{\"id\":\"rec-stele-4\",\"title\":\"杂技\",\"text\":\"佛的下方，跪着的人物两侧有人在表演杂技。碑落成的那天，现场大概就是这样热闹⁽¹⁾。\"},{\"id\":\"rec-stele-5\",\"title\":\"三位贵人\",\"text\":\"题记上方的亭阁里，坐着三位带着侍从的贵人。他们是谁，至今没有认出来⁽¹⁾。\"},{\"id\":\"rec-stele-6\",\"title\":\"侧面和背面\",\"text\":\"转过去看。侧面和背面也刻满了人，一排一排，都是出钱的信众，按身份排座次⁽¹⁾。\"},{\"id\":\"rec-stele-7\",\"title\":\"残留的颜色\",\"text\":\"材质一栏写着「石灰岩，残留彩绘」⁽¹⁾。它原本是上了颜色的。\"},{\"id\":\"rec-stele-8\",\"title\":\"碑顶的六条龙\",\"text\":\"碑的最顶上，六条龙缠在一起，护着下面的小佛龛。用龙来守圣物，汉代就有了，一直用到明清⁽⁴⁾。\"},{\"id\":\"rec-stele-9\",\"title\":\"背面的六位大供养人\",\"text\":\"背面有六位个头较大的供养人。他们的样子，和龙门那幅《孝文帝礼佛图》里的人物很像⁽⁴⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"信众社团发愿造像碑 · Stele Commissioned by Members
