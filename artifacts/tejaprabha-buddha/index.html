buddha\",\"status\":\"modeled\",\"dealGroup\":\"relief\",\"title\":{\"zh\":\"炽盛光佛佛会图\",\"en\":\"The Assembly of Tejaprabha\"},\"typeLabel\":{\"zh\":\"佛教绘画\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"元代，14 世纪初\",\"en\":\"Yuan dynasty (1279–1368), early 14th century\"},\"materialTechnique\":{\"zh\":\"泥地壁画（墨与矿物颜料）\",\"en\":\"Ink and mineral colors on clay\"},\"dimensions\":{\"zh\":\"高 713.7 厘米，宽 1483.4 厘米\",\"en\":\"H. 713.74 cm, W. 1483.36 cm\"},\"collection\":{\"museum\":{\"zh\":\"纳尔逊-阿特金斯艺术博物馆\",\"en\":\"The Nelson-Atkins Museum of Art\"},\"city\":{\"zh\":\"堪萨斯城\",\"en\":\"Kansas City\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"32-91/1\",\"url\":\"https://art.nelson-atkins.org/objects/14590/the-assembly-of-tejaprabha\"}},\"description\":{\"zh\":\"炽盛光佛坐在正中，手持金轮；围着他的，是化成人形的十一位星神：日、月、金木水火土五星，再加四颗看不见的「暗星」⁽¹,⁵⁾。古人相信星宿运行失常会带来灾祸，炽盛光佛管的就是这个。\\n\\n这面墙高七米多，宽近十五米，画于 14 世纪初，原在山西洪洞广胜下寺后殿的西山墙上，对面是如今在大都会的《药师佛佛会图》⁽¹,²⁾。1920 年代末寺僧卖画修殿，它被切成 47 块，经巴黎运到堪萨斯城，1933 年装进纳尔逊的「中国庙宇」展厅，成了木雕水月观音身后的那面墙⁽¹,⁸⁾。\",\"en\":\"Tejaprabha presides over celestial figures in this early-fourteenth-century mural, originally on the west wall opposite the Medicine Buddha.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"mural-nelson-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"mural-nelson-hd.glb\",\"modelLantern\":\"mural-nelson-lantern.glb\"},\"orchestration\":{\"importance\":\"featured\",\"category\":\"mural\",\"tags\":[\"壁画\",\"广胜寺\",\"Nelson-Atkins\"]},\"lanternConfig\":{\"caseType\":\"tall\",\"mount\":\"pedestal\",\"caseFootprint\":0.72,\"paddingSide\":0.14,\"paddingTop\":0.22,\"modelScale\":1,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#ceb782\",\"intensity\":1.5,\"position\":[0,0.98,0.5],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":1.6353981633974484,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.07,0.155,0.17],\"distance\":5,\"decay\":2,\"angle\":2.6179938779914944,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":30},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":30,\"fullRotation\":false,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.02,\"period\":5},\"rotate\":{\"enabled\":false,\"speed\":0.3}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1.3,\"centerX\":0.36,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"featured\",\"watermark\":\"熾盛光佛佛會圖\",\"subtitle\":{\"zh\":\"群星环绕，守护一座曾经震动的寺院。\",\"en\":\"A celestial assembly, painted against calamity.\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国山西洪洞，广胜下寺后殿西壁\",\"en\":\"West wall, rear (main) hall, Lower Guangsheng Monastery, Hongtong, Shanxi, China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"炽盛光佛佛会图\",\"oneLiner\":\"群星环绕，守护一座曾经震动的寺院。\",\"period\":\"元代，14 世纪初\",\"size\":\"高 713.7 厘米，宽 1483.4 厘米\",\"craft\":\"泥地壁画（墨与矿物颜料）\",\"location\":\"美国 · 堪萨斯城 · 纳尔逊-阿特金斯艺术博物馆\",\"acc\":[[\"馆藏编号\",\"32-91/1\"],[\"入藏年份\",\"1932\"]],\"intro\":[\"炽盛光佛坐在正中，手持金轮；围着他的，是化成人形的十一位星神：日、月、金木水火土五星，再加四颗看不见的「暗星」⁽¹,⁵⁾。古人相信星宿运行失常会带来灾祸，炽盛光佛管的就是这个。\",\"这面墙高七米多，宽近十五米，画于 14 世纪初，原在山西洪洞广胜下寺后殿的西山墙上，对面是如今在大都会的《药师佛佛会图》⁽¹,²⁾。1920 年代末寺僧卖画修殿，它被切成 47 块，经巴黎运到堪萨斯城，1933 年装进纳尔逊的「中国庙宇」展厅，成了木雕水月观音身后的那面墙⁽¹,⁸⁾。\"],\"about\":{\"title\":\"晋南壁画\",\"paras\":[{\"h\":\"为什么是药师佛和炽盛光佛\",\"sub\":\"$undefined\"},\"元大德七年（1303），洪洞、赵城一带发生大地震，约 8 级，震中就在赵城。余震拖到 1308 年才停，晋南元代以前的木构建筑几乎全毁，广胜寺也在其中⁽⁵⁾。\",\"壁画的年代，就是从这场地震推出来的。后殿的脊檩上有一行 1309 年秋天的墨书，是 1950 年代初中国的考古学者发现的，说明大殿在那一年重建⁽¹⁰⁾。旁边水神庙里有一块 1319 年的碑，记着震后的重修，说这时的广胜寺已经「最为壮丽」⁽⁹,¹⁰⁾。景安宁据此把壁画定在 1309 到 1319 年之间⁽¹⁰⁾；大都会 2026 年的修复说明写的是 1319 到 1324 年间完成⁽²⁾。\",\"寺院重建后，后殿两面山墙画的是一对少见的组合。故宫博物院的孟嗣徽指出，药师佛通常和阿弥陀佛配成东西两方净土，只有广胜寺一带是药师佛配炽盛光佛：一个救人间的病苦，一个消天上星宿带来的灾祸⁽⁴⁾。这是刚从大灾里活下来的人，画在墙上的愿望。\",\"景安宁 1991 年就指出过这一点：敦煌有九十多个洞窟画了药师佛的净土，没有一例是和炽盛光佛配对的；广胜下寺却前殿、后殿都这么配⁽¹⁰⁾。\",{\"h\":\"佛手里的轮子，原来是北斗的车\",\"sub\":\"$undefined\"},\"炽盛光佛是很晚才出现的一位佛，9 世纪末才第一次被画出来。景安宁考证，他的样子是从中国的北斗来的。汉代人把北斗想成一位坐在车里巡行天界的帝王，《史记》说「斗为帝车」；佛教的僧人起初也拜北斗，后来造出一位炽盛光佛，顶替了他⁽¹⁰⁾。\",\"敦煌有一幅 897 年的画，炽盛光佛还坐在车上，身后跟着五星。再往后，车子缩成了他手里的一只轮⁽¹⁰⁾。纳尔逊那铺壁画里，主尊手里托着的就是它。\",{\"h\":\"朱好古和他的班子\",\"sub\":\"$undefined\"},\"这两铺壁画，学界归在「晋南寺观壁画群」里。画首叫朱好古，元代襄陵人。他的班子是平阳府唯一被《平阳府志》《山西通志》记下名字的民间画工班子，永乐宫、兴化寺的壁画也出自这一路⁽⁴⁾。\",\"他们的画很好认：人物脸颊饱满，身材壮实，一个挨一个站得很满，空间很浅⁽³⁾；粗黑的墨线勾边，里面填朱砂红和石绿⁽¹⁾。孟嗣徽比对各处的题记和画样后认为，这些寺观用的是同一套粉本⁽⁴⁾。\",\"画法并不复杂。墙面先用泥和碎麦秸打底，再抹一层细泥；用木炭起稿，由师傅拿浓墨勾线，颜色交给徒弟去填。颜料是矿物和植物的，用胶和水调开⁽⁹⁾。画工是世代相传的手艺人，靠的是线条和颜色的气势。\",{\"h\":\"一座殿，分在五个地方\",\"sub\":\"$undefined\"},\"广胜下寺后殿的壁画，今天分在美国四座城市：东壁在纽约大都会，西壁在堪萨斯城纳尔逊，南壁的《菩萨写经图》在辛辛那提，北壁的一尊菩萨在底特律⁽²,⁵⁾。前殿的两铺，据大都会记载在费城的宾大博物馆⁽²⁾。\",\"1934 年夏天，梁思成、林徽因到广胜寺时，看到的已是新粉刷的白墙，只在东山墙尖上「尚有壁画一小块，图像色泽皆美」⁽⁶⁾。\",{\"h\":\"研究的主场回来了\",\"sub\":\"$undefined\"},\"孟嗣徽说，中国壁画的研究是从海外开始的，因为东西先到了海外⁽⁴⁾。现在情况变了：2024 年起，大都会和中国艺术研究院一起研究这铺壁画的拼接和旧修复，研究院的画家画了等大的摹本，还把壁画的影像投回了广胜寺的原墙上⁽²⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"广胜下寺后院东厢房的廊下，立着一块 1929 年的碑，《重修广胜下寺佛庙记》。碑上写得很直白：「去岁，有客远至，言佛殿绘壁……价可值千余金。僧人贞达即邀士绅估价出售。众议以为修庙无资，多年之憾，舍此不图，势必墙倾像毁，同归于尽。因与顾客再三商榷，售得银洋一千六百元。」⁽⁷⁾\",\"卖画的年份有两种说法：碑文的「去岁」是 1928 年；1934 年梁思成、林徽因听寺僧说的是「民十六」，也就是 1927 年⁽⁶⁾。纳尔逊的来源记录写的也是「大约 1927 年」⁽¹⁾。\",\"到 1930 年，壁画已在古董商卢芹斋手里。那年圣诞节，他给纳尔逊的董事尼科尔斯写信，第一次提到这铺壁画⁽¹⁾。卢芹斋要价很高，董事会起初没答应；他一趟趟上门，还许诺送一堂清代槅扇，帮博物馆搭一间「中国庙堂厅」，这才谈成⁽⁵⁾。1932 年 4 月 11 日，壁画从他的巴黎画廊发出，在勒阿弗尔港装上「圣迭戈号」，经新奥尔良运往堪萨斯城⁽¹⁾。\",\"为了运输，整面墙被切成 47 块。到了堪萨斯城，每一块背后都用石膏和钢材加固，1933 年装上展厅的墙⁽⁸⁾。\",\"博物馆买下它时，并不知道它来自哪座寺。1934 年，纳尔逊的史克曼到广胜寺，从住持那里听说下寺的壁画卖到了美国，才猜到是这一铺。1938 年，多伦多皇家安大略博物馆的怀履光派两名山西学生到晋南调查，把壁画的照片拿给住持看，住持认了出来⁽⁵⁾。\"],\"items\":[{\"at\":\"1303 年\",\"text\":\"洪洞、赵城大地震，广胜寺几近全毁⁽⁵⁾。\"},{\"at\":\"1309 年秋\",\"text\":\"后殿重建，脊檩上留下墨书题记⁽¹⁰⁾。\"},{\"at\":\"14 世纪初\",\"text\":\"下寺后殿重建后，东西山墙壁画绘成⁽¹,²⁾。\"},{\"at\":\"1927—1928 年\",\"text\":\"寺僧贞达与士绅商议，卖壁画修殿，得银洋一千六百元⁽⁶,⁷⁾。\"},{\"at\":\"1929 年\",\"text\":\"寺内立碑，记下卖画经过⁽⁷⁾。\"},{\"at\":\"1930 年 12 月 25 日\",\"text\":\"卢芹斋致信纳尔逊董事尼科尔斯，第一次提到这铺壁画⁽¹⁾。\"},{\"at\":\"1932 年 4 月 11 日\",\"text\":\"自勒阿弗尔港启运，经新奥尔良运往堪萨斯城⁽¹⁾。\"},{\"at\":\"1932 年\",\"text\":\"纳尔逊购入，编号 32-91/1⁽¹⁾。\"},{\"at\":\"1933 年\",\"text\":\"47 块加固后上墙；12 月博物馆开馆⁽⁸⁾。\"},{\"at\":\"1934 年\",\"text\":\"史克曼到广胜寺，推测壁画出自下寺⁽⁵⁾。\"},{\"at\":\"1938 年\",\"text\":\"广胜寺住持看过照片，确认壁画出自下寺⁽⁵⁾。\"},{\"at\":\"1965 年\",\"text\":\"对面东壁的《药师佛佛会图》入藏大都会⁽³⁾。\"}]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《The Assembly of Tejaprabha》，32-91/1。用于年代、尺寸、材质、十一曜、墨线与朱砂石绿设色、西壁原位，及来源记录：约 1927 年离寺、1929 年碑、卢芹斋 1930 年 12 月 25 日致尼科尔斯信、1932 年 4 月 11 日自勒阿弗尔启运、1932 年购入。https://art.nelson-atkins.org/objects/14590/the-assembly-of-tejaprabha\",\"大都会艺术博物馆：《In-Gallery Conservation: The Buddha of Medicine》，2026 年 4 月 30 日，8 月 7 日修订。用于东壁原位、1319—1324 年间完成、274 块与 1964 年拼装的错位、1960 年代加固胶致发黄、与中国艺术研究院的合作、原墙数字投影、2026 年 5 月至 2028 年 5 月现场修复，以及后殿四壁和前殿壁画的现藏地。https://www.metmuseum.org/essays/in-gallery-conservation-buddha-of-medicine\",\"大都会艺术博物馆：《Buddha of Medicine Bhaishajyaguru (Yaoshi fo)》，65.29.2。用于对面东壁壁画的著录、朱好古画风的描述，及 1965 年入藏。https://www.metmuseum.org/art/collection/search/42716\",\"李梅等：《故宫学者谈晋南壁画》，澎湃新闻，2025 年 10 月 24 日（孟嗣徽访谈）。用于药师佛与炽盛光佛的特殊配置及其与地震的关系、朱好古画工班子、同一套粉本、「研究从海外开始」，以及卢芹斋经手。https://www.thepaper.cn/newsDetail_forward_31827656\",\"陆斯嘉：《流散海外百年后，山西广胜寺三幅元代壁画「数字合璧」》，澎湃新闻，2025 年 3 月 31 日（据孟嗣徽主编《广胜寺壁画》导读）。用于 1303 年大地震的震级与余震、主尊手持金轮与画面下方供养人、卢芹斋与纳尔逊董事会的谈判、史克曼 1934 年到广胜寺及 1938 年怀履光学生的调查。孟嗣徽此文把炽盛光佛放在东山墙，与两馆现行说法相反。https://www.thepaper.cn/newsDetail_forward_30533521\",\"梁思成、林徽因：《晋汾古建筑预查纪略》，《中国营造学社汇刊》第五卷第三期，1935 年。用于「东山墙尖象眼壁上，尚有壁画一小块，图像色泽皆美。据说民十六寺僧将两山壁画卖与古玩商，以价款修葺殿宇」。引文据上条澎湃 2025 年 10 月报道。\",\"《重修广胜下寺佛庙记》碑，1929 年立，在广胜下寺后院东厢房廊下。录文转引自周元：《元代广胜寺壁画〈药师经变〉》，界面新闻，2018 年 10 月 8 日；未见原碑。https://www.jiemian.com/article/2519917.html\",\"纳尔逊-阿特金斯艺术博物馆：修复案例《Assembly of Tejaprabha》。用于切成 47 块、以石膏和钢材加固后 1933 年上墙、全幅数字拍摄，及「中间亮、四周暗」的用色。https://nelson-atkins.org/art/conservation/nelson-atkins-case-studies/?promo=7598\",\"Aschwin Lippe（李佩）：《Buddha and the Holy Multitude》，The Metropolitan Museum of Art Bulletin 23, no. 9（1965 年 5 月），页 325–36。用于史克曼在水神庙所见 1316、1324 年题记与 1319 年碑、壁画的做法、「九曜再加两位星神」，及两侧日光、月光菩萨借自药师佛法会的看法。https://www.metmuseum.org/met-publications/the-metropolitan-museum-of-art-bulletin-v-23-no-9-may-1965\",\"Anning Jing（景安宁）：《The Yuan Buddhist Mural of the Paradise of Bhaiṣajyaguru》，Metropolitan Museum Journal 26（1991）: 147–66。用于后殿脊檩 1309 年题记与断代、药师佛与炽盛光佛配对的原因、炽盛光佛出自北斗及车变为轮、敦煌 897 年炽盛光佛图与五星的扮相，及存世炽盛光佛图的清点。https://www.metmuseum.org/met-publications/yuan-buddhist-mural-of-the-paradise-of-bhaisajyguru-the-metropolitan-museum-journal-v-26-1991\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"The Assembly of Tejaprabha\",\"oneLiner\":\"A celestial assembly, painted against calamity.\",\"period\":\"Yuan dynasty (1279–1368), early 14th century\",\"size\":\"H. 713.74 cm, W. 1483.36 cm\",\"craft\":\"Ink and mineral colors on clay\",\"location\":\"United States, Kansas City, The Nelson-Atkins Museum of Art\",\"acc\":[[\"Accession no.\",\"32-91/1\"],[\"Acquired\",\"1932\"]],\"intro\":[\"Tejaprabha presides over celestial figures in this early-fourteenth-century mural, originally on the west wall opposite the Medicine Buddha.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"Tejaprabha was invoked against celestial calamity. The museum cautiously relates the commission to rebuilding after the 1303 earthquake.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"Its accession is 32-91/1. Differences between early acquisition accounts and registration dates remain under review.\"],\"items\":[]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《The Assembly of Tejaprabha》，32-91/1。用于年代、尺寸、材质、十一曜、墨线与朱砂石绿设色、西壁原位，及来源记录：约 1927 年离寺、1929 年碑、卢芹斋 1930 年 12 月 25 日致尼科尔斯信、1932 年 4 月 11 日自勒阿弗尔启运、1932 年购入。https://art.nelson-atkins.org/objects/14590/the-assembly-of-tejaprabha\",\"大都会艺术博物馆：《In-Gallery Conservation: The Buddha of Medicine》，2026 年 4 月 30 日，8 月 7 日修订。用于东壁原位、1319—1324 年间完成、274 块与 1964 年拼装的错位、1960 年代加固胶致发黄、与中国艺术研究院的合作、原墙数字投影、2026 年 5 月至 2028 年 5 月现场修复，以及后殿四壁和前殿壁画的现藏地。https://www.metmuseum.org/essays/in-gallery-conservation-buddha-of-medicine\",\"大都会艺术博物馆：《Buddha of Medicine Bhaishajyaguru (Yaoshi fo)》，65.29.2。用于对面东壁壁画的著录、朱好古画风的描述，及 1965 年入藏。https://www.metmuseum.org/art/collection/search/42716\",\"李梅等：《故宫学者谈晋南壁画》，澎湃新闻，2025 年 10 月 24 日（孟嗣徽访谈）。用于药师佛与炽盛光佛的特殊配置及其与地震的关系、朱好古画工班子、同一套粉本、「研究从海外开始」，以及卢芹斋经手。https://www.thepaper.cn/newsDetail_forward_31827656\",\"陆斯嘉：《流散海外百年后，山西广胜寺三幅元代壁画「数字合璧」》，澎湃新闻，2025 年 3 月 31 日（据孟嗣徽主编《广胜寺壁画》导读）。用于 1303 年大地震的震级与余震、主尊手持金轮与画面下方供养人、卢芹斋与纳尔逊董事会的谈判、史克曼 1934 年到广胜寺及 1938 年怀履光学生的调查。孟嗣徽此文把炽盛光佛放在东山墙，与两馆现行说法相反。https://www.thepaper.cn/newsDetail_forward_30533521\",\"梁思成、林徽因：《晋汾古建筑预查纪略》，《中国营造学社汇刊》第五卷第三期，1935 年。用于「东山墙尖象眼壁上，尚有壁画一小块，图像色泽皆美。据说民十六寺僧将两山壁画卖与古玩商，以价款修葺殿宇」。引文据上条澎湃 2025 年 10 月报道。\",\"《重修广胜下寺佛庙记》碑，1929 年立，在广胜下寺后院东厢房廊下。录文转引自周元：《元代广胜寺壁画〈药师经变〉》，界面新闻，2018 年 10 月 8 日；未见原碑。https://www.jiemian.com/article/2519917.html\",\"纳尔逊-阿特金斯艺术博物馆：修复案例《Assembly of Tejaprabha》。用于切成 47 块、以石膏和钢材加固后 1933 年上墙、全幅数字拍摄，及「中间亮、四周暗」的用色。https://nelson-atkins.org/art/conservation/nelson-atkins-case-studies/?promo=7598\",\"Aschwin Lippe（李佩）：《Buddha and the Holy Multitude》，The Metropolitan Museum of Art Bulletin 23, no. 9（1965 年 5 月），页 325–36。用于史克曼在水神庙所见 1316、1324 年题记与 1319 年碑、壁画的做法、「九曜再加两位星神」，及两侧日光、月光菩萨借自药师佛法会的看法。https://www.metmuseum.org/met-publications/the-metropolitan-museum-of-art-bulletin-v-23-no-9-may-1965\",\"Anning Jing（景安宁）：《The Yuan Buddhist Mural of the Paradise of Bhaiṣajyaguru》，Metropolitan Museum Journal 26（1991）: 147–66。用于后殿脊檩 1309 年题记与断代、药师佛与炽盛光佛配对的原因、炽盛光佛出自北斗及车变为轮、敦煌 897 年炽盛光佛图与五星的扮相，及存世炽盛光佛图的清点。https://www.metmuseum.org/met-publications/yuan-buddhist-mural-of-the-paradise-of-bhaisajyguru-the-metropolitan-museum-journal-v-26-1991\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-chisheng-1\",\"title\":\"手里的金轮\",\"text\":\"主尊手持金轮，这是认出炽盛光佛的标志⁽⁵⁾。他的名字意思是「光焰炽盛」，管的是天上星宿带来的灾祸⁽¹⁾。这只轮子有来历：它原本是北斗帝君坐的车，后来缩成了佛手里的一只轮⁽¹⁰⁾。\"},{\"id\":\"rec-chisheng-2\",\"title\":\"十一位星神\",\"text\":\"围着佛的是十一曜：日、月，金木水火土五星，再加罗睺、计都、紫炁、月孛四颗看不见的「暗星」。在这面墙上，他们都化成了人的样子⁽¹⁾。\"},{\"id\":\"rec-chisheng-3\",\"title\":\"光从中间来\",\"text\":\"退远一点看：画面中间亮，四周暗，像是佛身上放出的光照亮了整场法会⁽⁸⁾。\"},{\"id\":\"rec-chisheng-4\",\"title\":\"朱砂与石绿\",\"text\":\"先用粗黑的墨线勾出轮廓，再往里填颜色。红是朱砂，绿是石绿，蓝色只用来提亮⁽¹⁾。这是晋南朱好古一派的画法，永乐宫也是这一路⁽³,⁴⁾。\"},{\"id\":\"rec-chisheng-5\",\"title\":\"47 块\",\"text\":\"凑近能看到切割的缝。为了运出中国，整面墙被切成 47 块，每块背后用石膏和钢材加固，1933 年才重新装上墙⁽⁸⁾。\"},{\"id\":\"rec-chisheng-6\",\"title\":\"画面下方的供养人\",\"text\":\"最底下有一排小人物，是当年出钱画这面墙的施主⁽⁵⁾。\"},{\"id\":\"rec-chisheng-7\",\"title\":\"对面那面墙\",\"text\":\"它对面原是药师佛。药师佛通常和阿弥陀佛配对，配炽盛光佛的画法只见于洪洞一带，孟嗣徽认为这和 1303 年的大地震有关：一个救人间的病苦，一个消天上的灾星⁽⁴⁾。\"},{\"id\":\"rec-chisheng-8\",\"title\":\"借来的日光和月光\",\"text\":\"佛两侧的两位大菩萨是日光、月光菩萨。他们本是药师佛身边的人，被「借」到了这面墙上。1965 年大都会的研究员李佩猜，是因为他们和天上的光有关⁽⁹⁾。\"},{\"id\":\"rec-chisheng-9\",\"title\":\"认一认五星\",\"text\":\"五星各有各的扮相，从唐代敦煌的画上就定下来了：水星是拿着笔和经卷的女子，金星是抱琵琶的女乐师，土星是牵牛的苦行老者，木星是捧着供品的官员，火星是拿兵器的武士⁽¹⁰⁾。在这面墙上找找看。\"}],\"lookPoints\":\"$undefined\"}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\
