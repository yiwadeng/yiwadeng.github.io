堕髻，身形丰腴，表情轻松，坐姿随意，脚边一只小狗正啃着她脱下来的鞋，活泼有趣。\\n\\n该仕女俑衣裙宽松、衣褶细腻具有流动的垂感，釉色流光，模拟出了贵族女性常穿的丝绸质感。她手中原本捧着一件物品，但掌中之物或散佚，或风化——也许是果盘？乐器？还是铜镜？已不得而知。\",\"en\":\"A small tomb figurine (H.37.5 cm) rather than a monumental statue: a seated court lady with a playful lapdog at her feet, seated on an hourglass-shaped stool whose form originates in South Asian rattan furniture — evidence of Tang-era overseas trade. The head, neck, and hands were deliberately left unglazed and finished afterward with unfired cold-painted pigment (black for hair/brows/eyes, vermilion for lips and cheeks) — a technique called kailian (\\\"opening the face\\\"), used because lead glaze flows too readily at high temperature and would blur fine facial detail. Because these pigments were never fired, they have faded and sunk into the clay body over the centuries — a key marker distinguishing genuine pieces from modern fakes, whose cold-painted color tends to sit bright and unabsorbed on the surface.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"tanglady-met-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"tanglady-met-hd.glb\",\"modelLantern\":\"tanglady-met-lantern.glb\"},\"physique\":{\"viewing\":{\"bestFaceYaw\":31,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":35,\"pitch\":20,\"distanceFactor\":1,\"centerX\":0.39,\"centerY\":-0.02},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1.1,\"exposure\":1.1},\"model\":{\"position\":[-0.3,0,0],\"rotation\":[0,6,0],\"scale\":2,\"animation\":\"static\"},\"text\":{\"title\":{\"offset\":[-114,-36]},\"metadata\":{\"offset\":[-106,0]},\"intro\":{\"offset\":[-103,0]}},\"decorations\":[{\"src\":\"/image/moon.webp\",\"layer\":\"far\",\"x\":50,\"y\":50,\"scale\":1,\"opacity\":1}]},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.095,\"paddingTop\":0.12,\"modelScale\":0.96,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#deb961\",\"intensity\":0.72,\"position\":[-0.37,0.8899999999999999,0.25],\"rotation\":[-4,13,-11],\"distance\":2.15,\"decay\":2,\"angle\":1.7575712110370514,\"penumbra\":0.35000000000000003},\"caseLight\":{\"color\":\"#b4811c\",\"intensity\":0.2899999999999998,\"position\":[0.035,0.20500000000000007,0.29],\"distance\":1.2499999999999998,\"decay\":2,\"angle\":2.149557428756428,\"penumbra\":0.64},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"bestFaceYaw\":31,\"yawRange\":45},\"riverImageUrl\":\"/index/river/tanglady-met-impostor.png\",\"lookPoints\":[{\"id\":\"pt-xc5o2s\",\"position\":[-0.035,3.233,-0.072],\"title\":\"倭堕髻\",\"text\":\"始于汉代⁽¹⁾，盛行于隋唐。将两鬓头发向后蓬松梳拢，自信地露出圆润面容（双鬓抱面），挽发后向额前倾伏一髻。在唐朝仕女俑中较为常见⁽²⁾。日本传统结发「日本髪」的原型唐轮髷，即因模仿中国女性发髻而得名⁽³⁾。\",\"en\":{\"title\":\"The Tilted Chignon\",\"text\":\"The wodoji, or tilted chignon, originated in the Han dynasty⁽¹⁾ and flourished during the Sui and Tang. Hair at the temples is swept loosely back, framing the face while confidently revealing its roundness; the gathered bun then leans forward over the forehead. It appears frequently on Tang figures of court ladies.⁽²⁾ The tōwa-mage, a precursor of traditional Japanese coiffures, takes its name from its imitation of Chinese women’s hairstyles.⁽³⁾\",\"shortText\":\"$undefined\"},\"cameraPose\":{\"position\":[5.817064,1.817974,8.087228],\"target\":[-0.49948,1.416249,0.411008]},\"shortText\":\"$undefined\",\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-7738dk\",\"position\":[-0.416,2.364,-0.225],\"title\":\"开脸工艺\",\"text\":\"釉会流动不容易绘制五官，所以三彩人俑在素烧后，通常头手等部位不施釉，等其它地方上釉烧成冷却后，手工描绘精细五官和鬓发，素陶质感也更贴近亚光肤感。⁽⁴⁾\",\"en\":{\"title\":\"Painting the Face\",\"text\":\"Glaze runs in the kiln, making it difficult to preserve delicate facial details. After the first firing, the heads and hands of sancai figures were therefore usually left unglazed. Once the glazed areas had been fired and cooled, the features and hair were painted by hand. The bare earthenware also gives the skin a softer, matte appearance.⁽⁴⁾\",\"shortText\":\"$undefined\"},\"cameraPose\":{\"position\":[-6.710329,2.614614,4.908744],\"target\":[-0.21655,2.280978,-0.271461]},\"shortText\":\"$undefined\",\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-680r2i\",\"position\":[0.591,1.191,-1.222],\"title\":\"低温铅釉\",\"text\":\"三彩的颜色由含金属氧化物的低温铅釉在窑烧中形成，铜烧绿，铁烧黄，钴烧蓝。铅熔点较低，熔化后带着颜色流淌交融，形成渐变的配色。铜绿釉工艺成熟、在窑里熔后易铺开，所以较为常见。⁽⁵⁾\",\"en\":{\"title\":\"Low-Fired Lead Glaze\",\"text\":\"Sancai colors emerge in the kiln from low-fired lead glazes containing metal oxides: copper produces green, iron yellow, and cobalt blue. The lead-based glaze melts at a relatively low temperature, allowing the colors to flow and blend into gradients. Copper-green glaze was well established and spread readily when molten, making it especially common.⁽⁵⁾\",\"shortText\":\"$undefined\"},\"cameraPose\":{\"position\":[7.505476,2.301405,-7.708563],\"target\":[0.098764,1.872445,0.093756]},\"shortText\":\"$undefined\",\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-tiufov\",\"position\":[-0.26,-2.771,0.491],\"title\":\"生活意趣\",\"text\":\"仕女脱了一只鞋，翘着脚，宠物小白狗在咬地上那只鞋。唐三彩仕女俑往往这般生动活泼，仿佛千年前的一个抓拍。\",\"en\":{\"title\":\"A Playful Everyday Moment\",\"text\":\"The lady has slipped off one shoe and raised her foot. Her little white pet dog is biting the shoe on the ground. Tang sancai figures of court ladies often feel this lively, like a candid snapshot taken a thousand years ago.\",\"shortText\":\"$undefined\"},\"cameraPose\":{\"position\":[-7.601369,-1.606898,10.426556],\"target\":[-0.215808,-1.981387,-0.154732]},\"shortText\":\"$undefined\",\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-nnovhc\",\"position\":[-0.43,-2.656,-1.077],\"title\":\"筌蹄\",\"text\":\"唐朝已经不拘于席地而坐，这个沙漏状坐具筌蹄，原型来自南亚的藤编家具。⁽⁶⁾⁽¹¹⁾大唐作为一个开放包容的盛世，进口货亦是人们寻常的生活用度。\",\"en\":{\"title\":\"The Hourglass Stool\",\"text\":\"By the Tang dynasty, people no longer sat only on floor mats. This hourglass-shaped seat, called a quanti, derives from South Asian rattan furniture.⁽⁶⁾⁽¹¹⁾ In the open and cosmopolitan Tang world, imported objects could become familiar parts of everyday life.\",\"shortText\":\"$undefined\"},\"cameraPose\":{\"position\":[-7.620094,-1.606898,-10.41288],\"target\":[0.213047,-1.981387,-0.158512]},\"shortText\":\"$undefined\",\"img\":\"$undefined\",\"note\":\"$undefined\"}],\"particleLoader\":true,\"particlePalette\":[{\"color\":[142,158,96],\"weight\":0.42},{\"color\":[205,166,110],\"weight\":0.4},{\"color\":[214,204,182],\"weight\":0.18}],\"reading\":{\"language\":\"zh\",\"narration\":\"/audio/narration/tanglady-met-intro.mp3\",\"title\":\"唐三彩仕女俑\",\"oneLiner\":\"一位1200年前妆发时髦、极具松弛感的养宠女士\",\"period\":\"唐代，8世纪\",\"size\":\"37.5 × 14.3 × 15.4 厘米\",\"craft\":\"三彩釉陶\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"2010.120\"],[\"入藏年份\",\"2010\"]],\"intro\":[\"这是一尊极具生活气息的唐三彩仕女俑。仕女梳着蓬松的倭堕髻，身形丰腴，表情轻松，坐姿随意，脚边一只小狗正啃着她脱下来的鞋，活泼有趣。\",\"该仕女俑衣裙宽松、衣褶细腻具有流动的垂感，釉色流光，模拟出了贵族女性常穿的丝绸质感。她手中原本捧着一件物品，但掌中之物或散佚，或风化——也许是果盘？乐器？还是铜镜？已不得而知。\"],\"about\":{\"title\":\"关于唐三彩\",\"paras\":[{\"h\":\"关于唐三彩\",\"sub\":\"$undefined\"},\"唐三彩，是一个经常被误会的名字。\",\"唐三彩未必是「三种彩色」——三彩是一个多彩的统称，指的是一整类彩色铅釉陶器。颜色主要以黄、绿、白（或褐、蓝、紫等）等为主。但只要是这套低温铅釉工艺，不管是单色还是多彩，习惯上都归入唐三彩来称呼。⁽⁵⁾\",\"三彩也不专属于唐——唐三彩是巅峰，但也有宋三彩、辽三彩、一直到明清三彩。而且唐三彩工艺随盛唐的对外交流传到国外，于是又有了日本的奈良三彩、朝鲜的新罗三彩、甚至波斯三彩。⁽⁸⁾\",\"三彩也不完全等于明器（随葬品）——虽然很多唐三彩是随葬出土，但三彩家族的用途其实很广：辽三彩不仅有很多很多盘、碟、罐、壶日用品，还有三彩宗教造像（详见隔壁辽三彩罗汉）；⁽⁹⁾宋人用三彩做瓷枕；唐朝人其实也使用三彩做日常用具，白居易故居遗址出土就有唐三彩壶、罐、碗、盘、盂、杯等——诗人家也在用。⁽¹⁰⁾（名字里带「俑」字的，基本都是随葬明器。）\",\"除了铜绿、铁黄、钴蓝，锰会烧成紫；而白色不是釉，是白色高岭土（或化妆土）本身的颜色。铅作助熔剂，约 900℃ 的窑火就能让釉熔化、垂流，颜色顺势相互浸润，边界柔和晕染。⁽⁵⁾\",\"唐三彩之所以是巅峰，一在色彩，绚烂度后世难以超越。国土广袤，矿物质样本丰富，能烧出的颜色就多——反观辽三彩，就因为缺乏钴元素，烧不出唐三彩里的蓝色。⁽⁹⁾\",\"二在造型。盛唐国力强悍，厚葬之风盛行，题材多样，名匠如流。唐三彩的马、骆驼、仕女俑、胡人俑、天王俑，造型饱满、神态生动、比例精准，是后世做的那些寻常器皿所无法比拟的。宋以后瓷器兴起，又变了另一番审美的天地。\",\"那些仪态万方的仕女俑，矫健威猛的力士，大胆交融的色泽，流光溢彩的釉质，随着历史翻滚，最终被深埋于故都的黄土之中。\",{\"h\":\"唐三彩里的生活题材\",\"sub\":\"$undefined\"},\"仕女与脚边咬鞋的小狗，定格了千年前庭院里一个悠闲的瞬间。和很多国内博物馆所藏的同类型唐三彩仕女俑一样，她们神态富足、生活多姿，让唐朝贵族女性的神韵与精彩，可窥一斑。\",\"唐俑的手持物多为分件制作。她掌中那件已经遗失的物品，也为这个生活片段留下了想象的余地。\",\"生活题材也不只在仕女俑里。中国国家博物馆藏的一件骑卧驼三彩俑，塑造了胡人骑在卧驼背上、牵缰催它起身的瞬间。人物的动作、骆驼的姿态，让一个赶路的片段变得生动可感。⁽¹³⁾\",\"还有把热闹搬上驼背的载乐骆驼俑：骆驼昂首站立，背上有人起舞，有人围坐奏乐。国博认为，这可能表现的是长安百戏中的一个杂技节目。匠人还特意夸张了人与骆驼的比例，让歌舞的场面更鲜明。⁽¹⁴⁾\",\"不过如今，她独坐在纽约明亮的玻璃柜里，会不会偶尔怀念长安一片月呢？\"]},\"loss\":{\"title\":\"\",\"note\":\"以下为有来源的收藏记录，不等同于完整离境史。\",\"paras\":[\"「唐三彩」这个名字并不见于唐至清的任何文献——它沉睡了一千多年，直到 20 世纪初才被重新唤醒。1905 至 1909 年，清政府修筑汴洛铁路（后并入陇海铁路），线路穿过洛阳城北的邙山——这里自东周以来就是帝王贵族的葬地，「生在苏杭，葬在北邙」。施工损毁了一批唐墓，大量彩釉陶器就此出土。⁽¹²⁾\",\"起初无人识货。工地上的人不认得这些从墓里翻出的陪葬品，只觉「晦气」，随手弃于工地，甚至任其破碎；辗转运到北京琉璃厂，也一度乏人问津。直到国学大师王国维、罗振玉在古玩店中慧眼识宝，它才声名鹊起——1916 年，罗振玉编著《古明器图录》收录唐三彩马、女俑并介绍其价值，唐三彩自此蜚声中外，中外藏家竞相收购。⁽¹²⁾\",\"而这股热潮也点燃了洛阳邙山大规模的盗墓——那件至今仍为考古工作者使用的探墓工具「洛阳铲」，正是诞生于当年这股浪潮。无数唐三彩就在这样的浪潮里流散四方，辗转多手，漂洋过海。⁽¹²⁾这尊仕女俑的具体来路虽已不可考，但它多半也是这段历史的见证者之一。\"],\"items\":[]},\"refs\":[\"⑴ 倭堕髻本是汉代洛阳一带妇女的时髦发式，汉乐府《陌上桑》即有「头上倭堕髻，耳中明月珠」之句；由汉代「堕马髻」演变而来，《后汉书·五行志》有「堕马髻」的记载。\",\"⑵ [唐] 温庭筠《南歌子·倭堕低梳髻》：「倭堕低梳髻，连娟细扫眉。」\",\"⑶ ポーラ文化研究所《日本髪の歴史》（Pola Research Institute of Beauty and Culture）「結髪」篇 https://www.cosmetic-culture.po-holdings.co.jp/culture/nihongami/3.html\",\"⑷ 《唐三彩》，故宫博物院官网词条 https://www.dpm.org.cn/lemmas/239403.html ；另参《浅谈洛阳唐三彩的制作工艺及真伪鉴别》，中国科学技术大学博物馆 https://museum.ustc.edu.cn/2010/0609/c25532a480055/page.htm\",\"⑸ 《唐三彩》，故宫博物院官网词条 https://www.dpm.org.cn/lemmas/239403.html\",\"⑹ The Metropolitan Museum of Art, \\\"Seated court lady,\\\" object 2010.120（坐具原型来自南亚藤编家具，出自大都会官网说明）https://www.metmuseum.org/art/collection/search/75765\",\"⑺ 同上，The Metropolitan Museum of Art, object 2010.120（藏品名、编号、年代、尺寸、入藏方式、坐具与手持物等基础信息）https://www.metmuseum.org/art/collection/search/75765\",\"⑻ 三彩不专属于唐、宋辽金及海外亦有三彩：故宫博物院藏「辽三彩印花盘」（辽三彩特征），https://www.dpm.org.cn/collection/ceramic/226943.html ；各时期三彩对比另参《对比各时期三彩技艺》，古建中国，https://www.gujianchina.cn/news/show-12981.html\",\"⑼ 《辽三彩的器型与工艺》，搜狐 https://www.sohu.com/a/40239043_124636\",\"⑽ 《洛阳唐三彩的考古学观察：用于墓葬，也用于日常》，澎湃新闻·古代艺术，2021 年 https://www.thepaper.cn/newsDetail_forward_15312584 （更进一步的一手来源，可追中国社会科学院考古研究所 1992—1993 年对履道坊白居易宅院遗址的发掘成果）\",\"⑾ 《中国古典家具：历史》，chinese-furniture.com（「筌蹄」腰鼓形编织坐具的形制、随佛教东传的背景及其沿用至今的说明）https://www.chinese-furniture.com/c_furniture/history_ch.html\",\"⑿ 《洛阳唐三彩的考古学观察：用于墓葬，也用于日常》，澎湃新闻·古代艺术，2021 年（1905—1909 汴洛铁路施工损毁唐墓、古董商运京、王国维罗振玉识宝、1916 年罗振玉《古明器图录》著录、「洛阳铲」与邙山盗墓、1942 年赵汝珍《古玩指南》首次明确「唐三彩」概念等，均见此文）https://www.thepaper.cn/newsDetail_forward_15312584 ；另参罗振玉《古明器图录》（1916）——唐三彩最早的学术著录之一。\",\"⒀ 中国国家博物馆《骑卧驼三彩俑》https://www.chnmuseum.cn/zp/zpml/kgfjp/202111/t20211116_252258.shtml\",\"⒁ 中国国家博物馆《三彩釉陶载乐骆驼》https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247230.shtml\"]},\"riverTitle\":\"$28:props:children:props:artifact:title\",\"importance\":\"$undefined\",\"watermark\":\"唐三彩仕女俑\",\"subtitle\":{\"zh\":\"一位1200年前妆发时髦、极具松弛感的养宠女士\",\"en\":\"A fashionable Tang lady, relaxed with her pet\"},\"riverLead\":\"$28:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国（原墓未详）\",\"en\":\"China; original tomb unrecorded\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"/audio/narration/tanglady-met-intro.mp3\",\"title\":\"Seated Court Lady\",\"oneLiner\":\"A fashionable Tang lady, relaxed with her pet\",\"period\":\"Tang dynasty, 8th century\",\"size\":\"37.5 cm × 14.3 cm × 15.4 cm\",\"craft\":\"Earthenware with tri-color (sancai) glaze\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"2010.120\"],[\"Acquired\",\"2010\"]],\"intro\":[\"A small tomb figurine (H.37.5 cm) rather than a monumental statue: a seated court lady with a playful lapdog at her feet, seated on an hourglass-shaped stool whose form originates in South Asian rattan furniture — evidence of Tang-era overseas trade. The head, neck, and hands were deliberately left unglazed and finished afterward with unfired cold-painted pigment (black for hair/brows/eyes, vermilion for lips and cheeks) — a technique called kailian (\\\"opening the face\\\"), used because lead glaze flows too readily at high temperature and would blur fine facial detail. Because these pigments were never fired, they have faded and sunk into the clay body over the centuries — a key marker distinguishing genuine pieces from modern fakes, whose cold-painted color tends to sit bright and unabsorbed on the surface.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"The hourglass stool recalls South Asian rattan furniture. Dress, hairstyle, and a pet reveal a lively world of exchange.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"The Met purchased the figure in 2010 with a Vincent Astor Foundation gift. Its original tomb remains unidentified here.\"],\"items\":[]},\"refs\":[\"⑴ 倭堕髻本是汉代洛阳一带妇女的时髦发式，汉乐府《陌上桑》即有「头上倭堕髻，耳中明月珠」之句；由汉代「堕马髻」演变而来，《后汉书·五行志》有「堕马髻」的记载。\",\"⑵ [唐] 温庭筠《南歌子·倭堕低梳髻》：「倭堕低梳髻，连娟细扫眉。」\",\"⑶ ポーラ文化研究所《日本髪の歴史》（Pola Research Institute of Beauty and Culture）「結髪」篇 https://www.cosmetic-culture.po-holdings.co.jp/culture/nihongami/3.html\",\"⑷ 《唐三彩》，故宫博物院官网词条 https://www.dpm.org.cn/lemmas/239403.html ；另参《浅谈洛阳唐三彩的制作工艺及真伪鉴别》，中国科学技术大学博物馆 https://museum.ustc.edu.cn/2010/0609/c25532a480055/page.htm\",\"⑸ 《唐三彩》，故宫博物院官网词条 https://www.dpm.org.cn/lemmas/239403.html\",\"⑹ The Metropolitan Museum of Art, \\\"Seated court lady,\\\" object 2010.120（坐具原型来自南亚藤编家具，出自大都会官网说明）https://www.metmuseum.org/art/collection/search/75765\",\"⑺ 同上，The Metropolitan Museum of Art, object 2010.120（藏品名、编号、年代、尺寸、入藏方式、坐具与手持物等基础信息）https://www.metmuseum.org/art/collection/search/75765\",\"⑻ 三彩不专属于唐、宋辽金及海外亦有三彩：故宫博物院藏「辽三彩印花盘」（辽三彩特征），https://www.dpm.org.cn/collection/ceramic/226943.html ；各时期三彩对比另参《对比各时期三彩技艺》，古建中国，https://www.gujianchina.cn/news/show-12981.html\",\"⑼ 《辽三彩的器型与工艺》，搜狐 https://www.sohu.com/a/40239043_124636\",\"⑽ 《洛阳唐三彩的考古学观察：用于墓葬，也用于日常》，澎湃新闻·古代艺术，2021 年 https://www.thepaper.cn/newsDetail_forward_15312584 （更进一步的一手来源，可追中国社会科学院考古研究所 1992—1993 年对履道坊白居易宅院遗址的发掘成果）\",\"⑾ 《中国古典家具：历史》，chinese-furniture.com（「筌蹄」腰鼓形编织坐具的形制、随佛教东传的背景及其沿用至今的说明）https://www.chinese-furniture.com/c_furniture/history_ch.html\",\"⑿ 《洛阳唐三彩的考古学观察：用于墓葬，也用于日常》，澎湃新闻·古代艺术，2021 年（1905—1909 汴洛铁路施工损毁唐墓、古董商运京、王国维罗振玉识宝、1916 年罗振玉《古明器图录》著录、「洛阳铲」与邙山盗墓、1942 年赵汝珍《古玩指南》首次明确「唐三彩」概念等，均见此文）https://www.thepaper.cn/newsDetail_forward_15312584 ；另参罗振玉《古明器图录》（1916）——唐三彩最早的学术著录之一。\",\"⒀ 中国国家博物馆《骑卧驼三彩俑》https://www.chnmuseum.cn/zp/zpml/kgfjp/202111/t20211116_252258.shtml\",\"⒁ 中国国家博物馆《三彩釉陶载乐骆驼》https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247230.shtml\"]}},\"unplacedLookPoints\":[]}}]}]\n2d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n39:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n31:[[\"$\",\"title\",\"0\",{\"children\":\"唐三彩仕女俑 · Seated Court Lady | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A small tomb figurine (H.37.5 cm) rather than a monumental statue: a seated court lady with a playful lapdog at her feet, seated on an hourglass-shaped stool whose form originates \"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/tanglady-met\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuse
