":{\"zh\":\"堪萨斯城\",\"en\":\"Kansas City\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"34-10\",\"url\":\"https://art.nelson-atkins.org/objects/597\"}},\"description\":{\"zh\":\"    这是海外水月观音中负有盛名的一尊。高达两米四，或许为现世中最大的水月观音木雕。更难得的是，除右前臂外，连同宽阔的底座在内都由一整根木头雕成。雕工绝伦，保存完好，官方形容其为“同类雕塑中最精美的一件”。身上的彩绘历经多个朝代的补绘，至今依然细腻绚丽。\",\"en\":\"The Water-Moon Guanyin image spread after the 10th century, drawn from the Avataṃsaka Sūtra scene of Guanyin contemplating the moon’s reflection by a rocky shore — a vision of phenomena as illusion. The “royal ease” pose (lalitasana), one leg bent and one pendant, began in pre-Buddhist Indian court imagery and was later used to show Guanyin’s unimpeded freedom.\\n\\nCarved from a single tree trunk (only the right forearm is a later addition), this is among the largest surviving Liao wooden sculptures. She sits in the “wheel-turning king” posture on a rocky base. Scientific study shows her face and hands once had flesh-toned grounds; the gilded patterns visible today are largely 16th-century repainting after centuries of re-consecration.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"watermoon-nelson-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"breathe\",\"assets\":{\"modelHd\":\"watermoon-nelson-hd.glb\",\"modelLantern\":\"watermoon-nelson-lantern.glb\"},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.78,\"paddingSide\":0.075,\"paddingTop\":0.3,\"modelScale\":1.06,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#d5b05c\",\"intensity\":0.56,\"position\":[-0.22,0.83,0.37],\"rotation\":[-8,-7,-17],\"distance\":1.75,\"decay\":2,\"angle\":1.7750245035569947,\"penumbra\":1},\"caseLight\":{\"color\":\"#936d22\",\"intensity\":0.43,\"position\":[0.05,0.325,0.23],\"distance\":0.95,\"decay\":2,\"angle\":1.6085053606381858,\"penumbra\":0.79},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#e29d36\",\"strength\":0.5,\"edgeWidth\":0.008,\"lengthFade\":0.45,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":4.5,\"yawRange\":49.75,\"fullRotation\":false,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":true,\"amplitude\":0.02,\"period\":4.99},\"rotate\":{\"enabled\":false,\"speed\":0.8}}},\"section1\":{\"stagePose\":{\"yaw\":29,\"pitch\":0,\"distanceFactor\":1.02,\"centerX\":0.39,\"centerY\":-0.01},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"particlePalette\":[{\"color\":[213,175,134],\"weight\":0.25},{\"color\":[162,133,102],\"weight\":0.5},{\"color\":[110,90,69],\"weight\":0.25}],\"reading\":{\"language\":\"zh\",\"narration\":\"/audio/narration/watermoon-nelson-intro.mp3\",\"title\":\"辽金-木雕彩绘水月观音\",\"oneLiner\":\"千江映月，万缘皆空\",\"period\":\"辽或金代（907–1234）\",\"size\":\"241.3 × 167.6 × 110.5 厘米\",\"craft\":\"木胎彩绘（现存最表层彩绘系 16 世纪补绘）⁽²⁾\",\"location\":\"美国 · 堪萨斯城 · 纳尔逊-阿特金斯艺术博物馆\",\"acc\":[[\"馆藏编号\",\"34-10\"],[\"入藏年份\",\"1934\"]],\"intro\":[\"这是海外水月观音中负有盛名的一尊。高达两米四，或许为现世中最大的水月观音木雕。更难得的是，除右前臂外，连同宽阔的底座在内都由一整根木头雕成。雕工绝伦，保存完好，官方形容其为“同类雕塑中最精美的一件”。身上的彩绘历经多个朝代的补绘，至今依然细腻绚丽。\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。纳尔逊-阿特金斯艺术博物馆用“he”，流浪博物馆用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"以下为有来源的收藏记录，不等同于完整离境史。\",\"paras\":[\"馆方记录显示，此像经卢芹斋于1934年购藏。史克曼1932年前后见到造像的回忆与书信是更早线索，不能把见像、开馆陈列和正式购藏视作同一年。\"],\"items\":[{\"at\":\"辽代（约公元 1000 年）\",\"text\":\"造像完成，供奉于山西一座寺庙，是殿堂中受人礼拜的圣像。⁽²⁾\"},{\"at\":\"20 世纪 30 年代初\",\"text\":\"观音被拆解成数块，散落在华北一家古董商的库房后院，任凭风雪堆积；古董商误判为明代造像，无人问津。⁽¹⁷⁾\"},{\"at\":\"1931 年前后\",\"text\":\"纳尔逊博物馆委托美国人华尔纳（Langdon Warner）、中国古董商卢芹斋等人，以北平为据点遍历华北，大量收购中国古代艺术品以充实新馆。⁽¹⁷⁾⁽¹⁸⁾\"},{\"at\":\"约 1932 年\",\"text\":\"古董商卢芹斋买下这堆被当作明代货色的木块。⁽¹⁸⁾⁽¹⁹⁾\"},{\"at\":\"1932—1933 年\",\"text\":\"年轻的美国学者史克曼（Laurence Sickman）在卢芹斋处见到这堆木料，凭专业眼光判断为辽代珍品，遂由纳尔逊博物馆出资购入；此后他花数年时间将其重新拼合。⁽¹⁸⁾⁽¹⁹⁾\"},{\"at\":\"1933 年底\",\"text\":\"纳尔逊-阿特金斯艺术博物馆开馆，这尊水月观音已矗立在专门为它开辟的「中国庙宇」展厅中央；其身后配以来自山西广胜寺的元代壁画《炽盛光佛佛会图》，顶上是来自北京智化寺的明代藻井，面前是北京清代宅院的雕花格扇门——一整座被拆散、又在异国重新拼装起来的「中国庙堂」。⁽²⁾⁽²⁰⁾\"}]},\"refs\":[\"⑴ 「千江有水千江月」见宋代禅宗灯录（《嘉泰普灯录》《五灯会元》一类），常与「万里无云万里天」对举，喻佛性普照与内心清净。\",\"⑵ 尺寸、材质、「一木造」、「宗教与美学的胜利」评价、「中国庙宇」展厅，及「现存彩绘系 16 世纪补绘」：纳尔逊-阿特金斯艺术博物馆藏此造像官网著录及展签。https://art.nelson-atkins.org/objects/597/guanyin-of-the-southern-sea\",\"⑶ 「心无挂碍」化自《般若波罗蜜多心经》「依般若波罗蜜多故，心无罣碍」；「世间自在」为呼应玄奘所译「观自在」之对句。（「游戏坐／自在坐」为水月观音典型坐姿。）\",\"⑷ 「水月观音」之名一般追溯至《华严经·入法界品》中观音于南海补怛洛迦山水畔说法的意象（「水月道场」）；「观照水中月」这一具体画面为后世艺术化衍生，非经文原句。\",\"⑸ 〔唐〕张彦远《历代名画记》记周昉「妙创水月之体」（「胜光寺……周昉画水月观自在菩萨掩障，菩萨圆光及竹」），为「周昉首创水月观音样式」一说的文献来源。\",\"⑹ 水月观音「一足垂踏莲花、一足上踞、坐临水岩石」为其固定图像样式，见敦煌唐末五代水月观音绢画（大英博物馆、法国吉美博物馆藏，后者有天福八年／943 年纪年）；学术梳理另见《敦煌石窟水月观音图中的山水画》，《艺术博物馆》（山西大学）。（敦煌现存五代宋西夏水月观音壁画 27 幅、绢纸本 6 幅）\",\"⑺ 水月观音坐临水岩石、象征其道场南海普陀洛迦山（补怛洛迦），为水月观音图像的固定构件与通说；周昉「妙创水月之体」含圆光、竹石，见⑸《历代名画记》。\",\"⑻ 沥粉贴金：中国传统装饰工艺，先以沥粉起隆起线条、其上贴金箔，广泛用于彩塑、壁画与建筑彩画。\",\"⑼ 玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\",\"⑽ 观音宝冠中的「化佛」为判定观音身份的关键标志：见大都会艺术博物馆水月观音馆藏说明（策展人指出冠中小佛是确认观音身份的依据）。https://www.metmuseum.org/art/collection/search/42731\",\"⑾ 观音「由男身向女相」演变，及本尊「女相男身」特征，为佛教造像史通说；系统研究见 Chün-fang Yü（于君方），Kuan-yin: The Chinese Transformation of Avalokiteśvara（New York: Columbia University Press, 2001）。\",\"⑿ 观音早期为男身（王子相、留须）：早期佛教造像与文献多为男相。〔唐〕李百药《北齐书》载北齐武成帝病中见「一美妇人……食顷，变为观世音」，为观音与女性形象关联之早期记载。\",\"⒀ 唐代观音「面容女性化、仍加三撇蝌蚪须以标男身」，敦煌壁画多见：见《从男身到女相：观音性别演变史》，腾讯新闻，2021。https://new.qq.com/rain/a/20211113A016TQ00\",\"⒁ 〔北宋〕道诚《释氏要览·造像》引道宣（宣律师）语：「造像梵相，宋齐间皆唇厚鼻隆目长颐丰，挺然丈夫之相。自唐来，笔工皆端严柔弱，似伎女之貌，故今人夸宫娃如菩萨也。」（转引同⒀）\",\"⒂ 观音女性化完成于宋代、参照当时贵妇形象，及「求子」等女神崇拜动因：于君方（Chün-fang Yü）《观音——菩萨中国化的演变》（Kuan-yin: The Chinese Transformation of Avalokiteśvara）中文版明确主张「观音的女性化发生于十世纪」；另参澎湃新闻《观音：从印度糙汉到东方女神》，https://m.thepaper.cn/newsDetail_forward_30719964 。妙善公主传说见〔北宋〕蒋之奇《香山大悲菩萨传》碑（1100 年，河南宝丰香山寺）。\",\"⒃ 「武则天使观音女性化」一说的辨析：该说流传甚广（部分源自古正美对武则天与佛教政治的研究），但学界主流（如于君方前揭书）认为观音女性化是多因素、长时段的过程，不宜归于一人。\",\"⒄ 被拆解、误判明代、堆于古董商后院，及纳尔逊委托华尔纳、卢芹斋等在华北收购：《从近百件精美文物，来看「水月观音」像坐姿的变化》（虎魄造办处），2023。https://www.sohu.com/a/729128560_772510\",\"⒅ 卢芹斋购入、史克曼识为辽代、纳尔逊出资购藏、数年拼合：《中国雕塑史最美的水月观音在美国——辽代木雕水月观音像》，腾讯新闻，2025。https://news.qq.com/rain/a/20250322A05X3C00\",\"⒆ 收购年份（约 1932 年购入、1933 年底开馆时已陈列）：《纳尔逊博物馆里那尊精美的水月观音像》，文学城博客，2025。https://blog.wenxuecity.com/myblog/82804/202511/19864.html\",\"⒇ 「中国庙宇」展厅配置（广胜寺《炽盛光佛佛会图》壁画、智化寺明代藻井、清代格扇门，均为 1931—1932 年间购入／受赠）：《收藏在美国纳尔逊博物馆的辽代木雕水月观音像》，丝路遗产网 http://www.silkroads.org.cn/portal.php?mod=view\u0026aid=56839 ；《中国最好的木雕观音像在哪里》，看中国网 https://www.secretchina.com/news/gb/2022/05/15/1000751.html\"]},\"lookPoints\":[{\"id\":\"pt-chsyrb\",\"position\":[0.713,-6.725,3.268],\"title\":\"踏莲\",\"shortText\":\"$undefined\",\"text\":\"赤脚轻踏在一朵莲花上，呼应出水月的意象。一脚踏莲、一脚屈膝，几乎是水月观音的固定样式。⁽⁶⁾ 可参照国内四川安岳毗卢洞的紫竹观音，姿势和纳尔逊这尊几乎完全一样。\",\"en\":{\"title\":\"A Foot on a Lotus\",\"text\":\"This bare foot rests gently on a lotus, evoking the world of Water-Moon Guanyin. One foot on a lotus, the other leg bent: this is a characteristic pose of the Water-Moon form.⁽⁶⁾\",\"shortText\":\"This bare foot rests gently on a lotus, evoking the world of Water-Moon Guanyin. One foot on a lotus, the other leg bent: this is a characteristic pose of the Water-Moon form.⁽⁶⁾\"},\"cameraPose\":{\"position\":[9.715,-3.056,21.817],\"target\":[0.665,-5.933,0.315]},\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-hwlpqg\",\"position\":[-3.034,-4.417,1.122],\"title\":\"普陀洛迦的岩石\",\"shortText\":\"$undefined\",\"text\":\"水月观音像一般则坐在岩石之上，象征着她的道场「普陀洛迦山」。轻轻转动这片层层叠叠的岩石，你是否能想起来它们其实是木头呢？⁽⁷⁾\",\"en\":{\"title\":\"The Rocks of Mount Potalaka\",\"text\":\"Water-Moon Guanyin usually sits on rocks that evoke Mount Potalaka, the bodhisattva’s sacred abode. Gently rotate these layers of rock. Can you still imagine that they are actually carved from wood?⁽⁷⁾\",\"shortText\":\"Water-Moon Guanyin usually sits on rocks that evoke Mount Potalaka, the bodhisattva’s sacred abode. Gently rotate these layers of rock. Can you still imagine that they are actually carved from wood?⁽⁷⁾\"},\"cameraPose\":{\"position\":[-16.467,-2.41,21.924],\"target\":[0.806,-2.951,0.641]},\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-xf9pmg\",\"position\":[0.912,-2.603,3.479],\"title\":\"沥粉贴金\",\"shortText\":\"放大看这些金线，不是平面画上去的，而是像浮雕一样凸出，富有质感。这就是造像和壁画中常用的沥粉贴金工艺。⁽⁸⁾\",\"text\":\"放大看这些金线，不是平面画上去的，而是像浮雕一样凸出，富有质感。这就是造像和壁画中常用的沥粉贴金工艺。\\n\\n「沥粉贴金」工艺：先用特制工具将胶土混合物挤出、形成隆起的线条，再在粉线上贴覆金箔。壁画中也经常使用。⁽⁸⁾\",\"en\":{\"title\":\"Raised Lines of Gold\",\"text\":\"Look closely at these golden lines. They are not painted flat: they rise from the surface like tiny reliefs. This is gilding over raised paste, a technique often used on Buddhist sculptures and murals.\\n\\nThe technique, known as lifen tiejin, begins with a mixture of adhesive and clay squeezed through a special tool to form raised lines. Gold leaf is then applied over them. You can also find this technique in mural painting.⁽⁸⁾\",\"shortText\":\"Look closely at these golden lines. They are not painted flat: they rise from the surface like tiny reliefs. This is gilding over raised paste, a technique often used on Buddhist sculptures and murals.⁽⁸⁾\"},\"cameraPose\":{\"position\":[-4.688,-4.561,14.093],\"target\":[0.651,-3.919,2.067]},\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-nb1nat\",\"position\":[-3.2,1.506,0.858],\"title\":\"自在坐\",\"shortText\":\"这种水月观音的典型坐姿叫自在坐，又名游戏坐、大王坐，是一种放松而高贵的坐姿。通常一腿下垂、一腿曲起，手臂轻搭在膝上，神色超然。⁽⁹⁾\",\"text\":\"这种水月观音的典型坐姿叫自在坐，又名王者坐，是一种放松而高贵的坐姿。通常一腿下垂、一腿曲起，手臂轻搭在膝上，神色超然。\\n\\n关于自在：玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义。⁽⁹⁾\",\"en\":{\"title\":\"Seated in Royal Ease\",\"text\":\"This characteristic Water-Moon Guanyin pose is known as “royal ease,” a posture both relaxed and dignified. Typically, one leg hangs down while the other is bent, an arm rests lightly on the raised knee, and the face remains serene.\\n\\nThe Chinese name for this posture includes zizai, meaning ease or freedom. The monk Xuanzang also used these characters in Guanzizai, his translation of Avalokiteśvara. He considered it closer to the Sanskrit name than Guanyin, “Observer of Sounds.”⁽⁹⁾\",\"shortText\":\"This characteristic Water-Moon Guanyin pose is known as “royal ease,” a posture both relaxed and dignified. Typically, one leg hangs down while the other is bent, an arm rests lightly on the raised knee, and the face remains serene.⁽⁹⁾\"},\"cameraPose\":{\"position\":[-13.642,-8.568,27.726],\"target\":[-1.5,-1.2,3.055]},\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-lowowe\",\"position\":[0.899,7.935,0.711],\"title\":\"宝冠\",\"shortText\":\"$undefined\",\"text\":\"观音的宝冠（也作天冠）上，往往刻着一尊小小的佛像，是观音的老师阿弥陀佛，称作「化佛」——它正是判定这尊菩萨是否为观音的关键标志。可惜此处观音宝冠上的化佛，已经遗失了。⁽¹⁰⁾\",\"en\":{\"title\":\"The Jeweled Crown\",\"text\":\"Buddhas usually wear simple robes, while bodhisattvas appear in rich garments, high topknots, and jeweled crowns. Guanyin’s crown often bears a tiny seated Buddha, known in Chinese as a huàfó, or “manifested Buddha.” It is a key clue to identifying Guanyin. Sadly, the small Buddha from this crown has been lost.⁽¹⁰⁾\",\"shortText\":\"Buddhas usually wear simple robes, while bodhisattvas appear in rich garments, high topknots, and jeweled crowns. Guanyin’s crown often bears a tiny seated Buddha, known in Chinese as a huàfó, or “manifested Buddha.” It is a key clue to identifying Guanyin. Sadly, the small Buddha from this crown has been lost.⁽¹⁰⁾\"},\"cameraPose\":{\"position\":[-0.015,3.833,19.627],\"target\":[-0.522,5.485,3.64]},\"img\":\"$undefined\",\"note\":\"$undefined\"},{\"id\":\"pt-mvvktzqa\",\"title\":\"璎珞\",\"text\":\"古印度贵族的珍宝配饰，菩萨形象源于释迦牟尼出家前的王子形象，故佩戴璎珞。璎珞随佛教传入中国后，渐渐变成世俗贵族的颈饰。例如《红楼梦》中贾宝玉出场时写他“项上金螭璎珞”，璎珞圈子下悬着他的通灵宝玉。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[1.019,3.882,-0.033],\"cameraPose\":{\"position\":[8.681,3.524,17.764],\"target\":[0.675,2.777,-0.188]},\"note\":{\"x\":0.604,\"y\":0.356,\"width\":370}}],\"riverTitle\":{\"zh\":\"辽金-木雕水月观音-堪萨斯城\",\"en\":\"Guanyin of the Southern Sea\"},\"importance\":\"$undefined\",\"watermark\":\"一木造\",\"subtitle\":{\"zh\":\"千江映月，万缘皆空\",\"en\":\"A foot rests on a lotus; a moment of royal ease endures.\"},\"riverLead\":{\"zh\":\"千江有水千江月⁽¹⁾\",\"en\":\"A foot rests on a lotus; a moment of royal ease endures.\"},\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国山西\",\"en\":\"China; original temple not securely identified\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"/audio/narration/watermoon-nelson-intro.mp3\",\"title\":\"Guanyin of the Southern Sea\",\"oneLiner\":\"A foot rests on a lotus; a moment of royal ease endures.\",\"period\":\"Liao or Jin dynasty (907–1234)\",\"size\":\"241.3 × 167.6 × 110.5 cm\",\"craft\":\"Polychromed wood with partial gilding\",\"location\":\"United States, Kansas City, The Nelson-Atkins Museum of Art\",\"acc\":[[\"Accession no.\",\"34-10\"],[\"Acquired\",\"1934\"]],\"intro\":[\"The Water-Moon Guanyin image spread after the 10th century, drawn from the Avataṃsaka Sūtra scene of Guanyin contemplating the moon’s reflection by a rocky shore — a vision of phenomena as illusion. The “royal ease” pose (lalitasana), one leg bent and one pendant, began in pre-Buddhist Indian court imagery and was later used to show Guanyin’s unimpeded freedom.\",\"Carved from a single tree trunk (only the right forearm is a later addition), this is among the largest surviving Liao wooden sculptures. She sits in the “wheel-turning king” posture on a rocky base. Scientific study shows her face and hands once had flesh-toned grounds; the gilded patterns visible today are largely 16th-century repainting after centuries of re-consecration.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"The lowered gaze and relaxed arm soften the monumental scale. Carving and painted details bring the crown, ornaments, and garments into focus.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"The museum records purchase from C. T. Loo in 1934. Earlier sightings and opening displays should be distinguished from formal acquisition.\"],\"items\":[{\"at\":\"1934\",\"text\":\"Purchased by the Nelson-Atkins from C. T. Loo.\"}]},\"refs\":[\"⑴ 「千江有水千江月」见宋代禅宗灯录（《嘉泰普灯录》《五灯会元》一类），常与「万里无云万里天」对举，喻佛性普照与内心清净。\",\"⑵ 尺寸、材质、「一木造」、「宗教与美学的胜利」评价、「中国庙宇」展厅，及「现存彩绘系 16 世纪补绘」：纳尔逊-阿特金斯艺术博物馆藏此造像官网著录及展签。https://art.nelson-atkins.org/objects/597/guanyin-of-the-southern-sea\",\"⑶ 「心无挂碍」化自《般若波罗蜜多心经》「依般若波罗蜜多故，心无罣碍」；「世间自在」为呼应玄奘所译「观自在」之对句。（「游戏坐／自在坐」为水月观音典型坐姿。）\",\"⑷ 「水月观音」之名一般追溯至《华严经·入法界品》中观音于南海补怛洛迦山水畔说法的意象（「水月道场」）；「观照水中月」这一具体画面为后世艺术化衍生，非经文原句。\",\"⑸ 〔唐〕张彦远《历代名画记》记周昉「妙创水月之体」（「胜光寺……周昉画水月观自在菩萨掩障，菩萨圆光及竹」），为「周昉首创水月观音样式」一说的文献来源。\",\"⑹ 水月观音「一足垂踏莲花、一足上踞、坐临水岩石」为其固定图像样式，见敦煌唐末五代水月观音绢画（大英博物馆、法国吉美博物馆藏，后者有天福八年／943 年纪年）；学术梳理另见《敦煌石窟水月观音图中的山水画》，《艺术博物馆》（山西大学）。（敦煌现存五代宋西夏水月观音壁画 27 幅、绢纸本 6 幅）\",\"⑺ 水月观音坐临水岩石、象征其道场南海普陀洛迦山（补怛洛迦），为水月观音图像的固定构件与通说；周昉「妙创水月之体」含圆光、竹石，见⑸《历代名画记》。\",\"⑻ 沥粉贴金：中国传统装饰工艺，先以沥粉起隆起线条、其上贴金箔，广泛用于彩塑、壁画与建筑彩画。\",\"⑼ 玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\",\"⑽ 观音宝冠中的「化佛」为判定观音身份的关键标志：见大都会艺术博物馆水月观音馆藏说明（策展人指出冠中小佛是确认观音身份的依据）。https://www.metmuseum.org/art/collection/search/42731\",\"⑾ 观音「由男身向女相」演变，及本尊「女相男身」特征，为佛教造像史通说；系统研究见 Chün-fang Yü（于君方），Kuan-yin: The Chinese Transformation of Avalokiteśvara（New York: Columbia University Press, 2001）。\",\"⑿ 观音早期为男身（王子相、留须）：早期佛教造像与文献多为男相。〔唐〕李百药《北齐书》载北齐武成帝病中见「一美妇人……食顷，变为观世音」，为观音与女性形象关联之早期记载。\",\"⒀ 唐代观音「面容女性化、仍加三撇蝌蚪须以标男身」，敦煌壁画多见：见《从男身到女相：观音性别演变史》，腾讯新闻，2021。https://new.qq.com/rain/a/20211113A016TQ00\",\"⒁ 〔北宋〕道诚《释氏要览·造像》引道宣（宣律师）语：「造像梵相，宋齐间皆唇厚鼻隆目长颐丰，挺然丈夫之相。自唐来，笔工皆端严柔弱，似伎女之貌，故今人夸宫娃如菩萨也。」（转引同⒀）\",\"⒂ 观音女性化完成于宋代、参照当时贵妇形象，及「求子」等女神崇拜动因：于君方（Chün-fang Yü）《观音——菩萨中国化的演变》（Kuan-yin: The Chinese Transformation of Avalokiteśvara）中文版明确主张「观音的女性化发生于十世纪」；另参澎湃新闻《观音：从印度糙汉到东方女神》，https://m.thepaper.cn/newsDetail_forward_30719964 。妙善公主传说见〔北宋〕蒋之奇《香山大悲菩萨传》碑（1100 年，河南宝丰香山寺）。\",\"⒃ 「武则天使观音女性化」一说的辨析：该说流传甚广（部分源自古正美对武则天与佛教政治的研究），但学界主流（如于君方前揭书）认为观音女性化是多因素、长时段的过程，不宜归于一人。\",\"⒄ 被拆解、误判明代、堆于古董商后院，及纳尔逊委托华尔纳、卢芹斋等在华北收购：《从近百件精美文物，来看「水月观音」像坐姿的变化》（虎魄造办处），2023。https://www.sohu.com/a/729128560_772510\",\"⒅ 卢芹斋购入、史克曼识为辽代、纳尔逊出资购藏、数年拼合：《中国雕塑史最美的水月观音在美国——辽代木雕水月观音像》，腾讯新闻，2025。https://news.qq.com/rain/a/20250322A05X3C00\",\"⒆ 收购年份（约 1932 年购入、1933 年底开馆时已陈列）：《纳尔逊博物馆里那尊精美的水月观音像》，文学城博客，2025。https://blog.wenxuecity.com/myblog/82804/202511/19864.html\",\"⒇ 「中国庙宇」展厅配置（广胜寺《炽盛光佛佛会图》壁画、智化寺明代藻井、清代格扇门，均为 1931—1932 年间购入／受赠）：《收藏在美国纳尔逊博物馆的辽代木雕水月观音像》，丝路遗产网 http://www.silkroads.org.cn/portal.php?mod=view\u0026aid=56839 ；《中国最好的木雕观音像在哪里》，看中国网 https://www.secretchina.com/news/gb/2022/05/15/1000751.html\"]}},\"unplacedLookPoints\":[]}}]}]\n2d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n39:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n31:[[\"$\",\"title\",\"0\",{\"children\":\"辽金-木雕彩绘水月观音 · Guanyin of the Southern Sea | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The Water-Moon Guanyin image spread after the 10th century, drawn from the Avataṃsaka Sūtra scene of Guanyin contemplating the moon’s reflection by a rocky shore — a vision of phen\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/watermoon-nelson\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/watermoon-nelson\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/watermoon-nelson\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"辽金-木雕彩绘水月观音 · Guanyin of the Southern Sea | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"The Water-Moon Guanyin image spread after the 10th century, drawn from the
