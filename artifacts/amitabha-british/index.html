8:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国河北韩崔村崇光寺（村已不存，在定州与保定之间）\",\"en\":\"Chongguang Temple, Hancui village, Hebei, China\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"巨型阿弥陀佛\",\"oneLiner\":\"近六米高，八十个人合力供养的一尊佛。\",\"period\":\"隋开皇五年（585）\",\"size\":\"高 5.78 米\",\"craft\":\"白色大理石（汉白玉），分上下两段雕成；原贴金彩绘\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"1938,0715.1\"],[\"入藏年份\",\"1938\"],[\"入藏方式\",\"卢芹斋赠中国政府，经驻英大使转赠\"]],\"intro\":[\"公元 585 年，河北韩崔村的崇光寺里立起了一尊阿弥陀佛，近六米高，用当地出产的白石雕成⁽¹⁾。出钱的是一个叫「义邑」的佛教结社，八十个人，名字都刻在底座上⁽¹,²⁾。\",\"他太高了，只能分成上下两段来雕，腰间至今看得见那道接缝⁽¹⁾。双手已经没了，手腕里还留着当年插手用的枣木榫和铁箍⁽¹,²⁾。\",\"今天他站在大英博物馆北楼梯的天井里⁽¹⁾。韩崔村和崇光寺，都已经找不到了⁽¹⁾。\"],\"about\":{\"title\":\"白石与净土\",\"paras\":[{\"h\":\"无量光\",\"sub\":\"$undefined\"},\"阿弥陀，梵文的意思是「无量光」，是净土宗的主尊，6、7 世纪在中国非常流行⁽¹⁾。隋朝的两位皇帝都笃信佛教，581 年统一大半个中国后，把佛教定为国教⁽¹⁾。\",\"他的右手原本举在胸前，掌心向外，是「别怕」的意思；左手垂下，是「给予」的意思⁽¹⁾。这一时期的造像正在变化，身体的比例越来越真实，大概受了印度笈多艺术的影响⁽¹⁾。\",{\"h\":\"白石之乡\",\"sub\":\"$undefined\"},\"韩崔村在定州和保定之间，那一带盛产洁白的大理石，以白石造像闻名⁽¹⁾。他身上原本贴满了金、涂满了彩，今天还能在好几处找到残留的颜料⁽¹⁾。\",{\"h\":\"八十个人的佛\",\"sub\":\"$undefined\"},\"「义邑」是北朝到隋唐时民间的佛教结社，大家凑钱一起造像、办斋。这尊佛的底座上刻着八十位邑人的名字⁽²⁾。本馆的北魏造像碑残块，讲的也是这样一个结社的故事。\",\"他原本不是一个人站着：两侧还各有一尊小一些的菩萨，其中一尊今天在东京国立博物馆⁽¹⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"他是怎么离开河北的，没有任何记录。再出现时，他已经在古董商卢芹斋（C. T. Loo）手里⁽¹⁾。\",\"1935 年冬，伦敦皇家艺术学院举办中国艺术国际展览会，故宫文物第一次出国，他也在展厅里。大英的记录说，是卢芹斋的纽约分号把他借给了展览⁽¹⁾；英国的艺术报刊则说，是中国政府借出的⁽²⁾。\",\"展览结束后，卢芹斋把他送给了中国政府，中国政府又经驻英大使转赠大英，「以纪念中国艺术国际展览会、象征两国友好」⁽¹⁾。1938 年，他正式入藏⁽¹⁾。\",\"2015 到 2016 年，修复师在原地给他做了二十多年来第一次全面清洁，被尘土遮住的题记重新完整地露了出来⁽²⁾。\"],\"items\":[{\"at\":\"585 年\",\"text\":\"义邑八十人出资，供于韩崔村崇光寺⁽¹,²⁾。\"},{\"at\":\"1935—1936 年\",\"text\":\"伦敦中国艺术国际展览会展出⁽¹,²⁾。\"},{\"at\":\"1938 年\",\"text\":\"卢芹斋赠中国政府，经驻英大使转赠大英⁽¹⁾。\"},{\"at\":\"2015—2016 年\",\"text\":\"原地修复，发现枣木榫头，题记完整显露⁽²⁾。\"}]},\"refs\":[\"大英博物馆：《figure》，1938,0715.1。用于描述、纪年与题记、产地与韩崔村位置、材质（木榫、铁件）、高度、策展人说明（阿弥陀与净土、隋代崇佛、写实风格、手印、腰部接缝、原有贴金彩绘、东京国立博物馆的菩萨）、状况、来源与入藏说明。https://www.britishmuseum.org/collection/object/A_1938-0715-1\",\"The Art Newspaper：《Restoration gives British Museum's Amitabha Buddha a reason to smile》，2016 年 2 月 25 日。用于 2015—2016 年修复（枣木榫头、题记完整显露）、义邑八十名成员、Jane Portal 的话，及「中国政府借给 1935 年展」一说。https://www.theartnewspaper.com/2016/02/25/restoration-gives-british-museums-amitabha-buddha-a-reason-to-smile\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Amitabha Buddha, dated 585\",\"oneLiner\":\"\",\"period\":\"Sui dynasty, dated 585\",\"size\":\"H. 5.78 m\",\"craft\":\"White marble, carved in two parts; originally gilded and painted\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"1938,0715.1\"],[\"Acquired\",\"1938\"],[\"入藏方式\",\"卢芹斋赠中国政府，经驻英大使转赠\"]],\"intro\":[],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大英博物馆：《figure》，1938,0715.1。用于描述、纪年与题记、产地与韩崔村位置、材质（木榫、铁件）、高度、策展人说明（阿弥陀与净土、隋代崇佛、写实风格、手印、腰部接缝、原有贴金彩绘、东京国立博物馆的菩萨）、状况、来源与入藏说明。https://www.britishmuseum.org/collection/object/A_1938-0715-1\",\"The Art Newspaper：《Restoration gives British Museum's Amitabha Buddha a reason to smile》，2016 年 2 月 25 日。用于 2015—2016 年修复（枣木榫头、题记完整显露）、义邑八十名成员、Jane Portal 的话，及「中国政府借给 1935 年展」一说。https://www.theartnewspaper.com/2016/02/25/restoration-gives-british-museums-amitabha-buddha-a-reason-to-smile\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-ab-waist\",\"title\":\"腰间的接缝\",\"text\":\"他是分上下两段雕的，腰间那道接缝和打磨过的接合面至今看得见⁽¹⁾。\"},{\"id\":\"rec-ab-wrist\",\"title\":\"枣木榫\",\"text\":\"双手已失，手腕里还留着插手用的木榫和铁箍，木头是枣木⁽¹,²⁾。\"},{\"id\":\"rec-ab-text\",\"title\":\"八十个名字\",\"text\":\"底座上的题记记着纪年，和义邑八十位成员的名字⁽¹,²⁾。\"},{\"id\":\"rec-ab-gold\",\"title\":\"残存的金和彩\",\"text\":\"他原来通体贴金上彩，好几处还能找到残留的颜料⁽¹⁾。\"},{\"id\":\"rec-ab-lotus\",\"title\":\"莲花座\",\"text\":\"他站在一朵莲花上，莲花代表清净与觉悟⁽¹⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n2d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n39:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n31:[[\"$\",\"title\",\"0\",{\"children\":\"巨型阿弥陀佛 · Amitabha Buddha, dated 585 | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"robots\",\"content\":\"noindex, follow\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/amitabha-british\"}],[\"$\",\"link\",\"3\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/amitabha-british\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/amitabha-british\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"巨型阿弥陀佛 · Amitabha Buddha, dated 585 | Wandering Museum\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://www.wanderingmuseum.org/artifacts/amitabha-british\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"https://www.wanderingmuseum.org/index/baked/art-amitabha-british-0.jpg\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:alt\",\"content\":\"Amitabha Buddha, dated 585\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:title\",\"content\":\"巨型阿弥陀佛 · Amitabha Buddha, dated 585 | Wandering Museum\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:image\",\"content\":\"https://www.wanderingmuseum.org/index/baked/art-amitabha-british-0.jpg\"}],[\"$\",\"link\",\"13\",{\"rel\":\"icon\",
