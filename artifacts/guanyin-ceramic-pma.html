\",\"$15\",\"$16\",\"$39\",\"$3a\",\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"guanyin-ceramic-pma\",\"status\":\"modeled\",\"dealGroup\":\"statue-sit\",\"title\":{\"zh\":\"明-琉璃水月观音\",\"en\":\"Guanyin, Bodhisattva of Compassion\"},\"typeLabel\":{\"zh\":\"陶瓷造像\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"明正德二年（1507 年）\",\"en\":\"Ming dynasty, dated 1507\"},\"materialTechnique\":{\"zh\":\"琉璃釉陶（低温铅釉）\",\"en\":\"Stoneware with polychrome glaze (Shanxi liuli ware)\"},\"collection\":{\"museum\":{\"zh\":\"费城艺术博物馆\",\"en\":\"Philadelphia Museum of Art\"},\"city\":{\"zh\":\"费城\",\"en\":\"Philadelphia\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"1923-21-441\",\"url\":\"https://www.philamuseum.org/objects/40881\"},\"dimensions\":{\"zh\":\"高 93.6 厘米，宽 50.3 厘米，深 24.7 厘米\",\"en\":\"H. 93.6 cm, W. 50.3 cm, D. 24.7 cm\"}},\"description\":{\"zh\":\"这是一尊制于明代的琉璃水月观音，具有水月形制的特点：自在坐、屈膝搭手、垂足踏莲。和辽宋金流行的木雕观音不同，她由琉璃烧制而成。大型琉璃件烧制不易，这近一米高的琉璃像，绿袍黄裙，釉色莹润而不相混⁽¹⁾，璎珞、龙鳞、莲瓣细致分明，足见工艺高超。\\n中国造像万千，题记里留名的往往是功德主，匠人的姓名大多湮没无闻。她是例外，作者为山西阳城的乔彬。乔家世代烧造三彩、琉璃、法华，作品散在大都会⁽⁴,⁵⁾、大英博物馆⁽⁶⁾，手艺至今还在传承⁽⁶⁾。\\n中国自古以书画为「艺」，以造像、烧窑为「工」。乔彬烧成这尊观音的第二年，米开朗琪罗开始画西斯廷礼拜堂的天顶。一个被写进了艺术史，一个只留下了名字。\",\"en\":\"Right knee raised, right hand resting on it, left foot lowered onto a lotus: this is the posture of royal ease, the pose of the water-moon Guanyin. But she no longer sits on a rock by the water. A dragon writhes beneath her beside a lion-like beast, and the Philadelphia Museum of Art calls her Guanyin of the Southern Sea.⁽¹⁾ By the Ming dynasty, the water-moon Guanyin had gone out to sea.⁽²⁾\\nHer maker signed his work. Qiao Bin, a glaze potter from Yangcheng in Shanxi, made her in 1507—a rare name in a tradition of anonymous craftsmen.⁽¹⁾\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"guanyin-ceramic-pma-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"guanyin-ceramic-pma-hd.glb\",\"modelLantern\":\"guanyin-ceramic-pma-lantern.glb\"},\"orchestration\":{\"importance\":\"standard\",\"category\":\"sculpture\",\"tags\":[\"观音\",\"陶瓷\",\"PMA\"]},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.065,\"paddingTop\":0.09,\"modelScale\":1,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#d5c091\",\"intensity\":1.5,\"position\":[0,1,0.5],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":0.85,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.05,0.52,0.17],\"distance\":5,\"decay\":2,\"angle\":1.05,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"身如琉璃\",\"subtitle\":{\"zh\":\"来自晋南乔家的琉璃佳作\",\"en\":\"Glazed color preserves the memory of maker and donor.\"},\"riverLead\":{\"zh\":\"我来自山西阳城，出自名匠乔氏之手\",\"en\":\"Glazed color preserves the memory of maker and donor.\"},\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国山西北部，题记所载佛寺\",\"en\":\"A Buddhist temple in northern Shanxi, China, named in inscriptions\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"明-琉璃水月观音\",\"oneLiner\":\"来自晋南乔家的琉璃佳作\",\"period\":\"明正德二年（1507 年）\",\"size\":\"高 93.6 厘米，宽 50.3 厘米，深 24.7 厘米\",\"craft\":\"琉璃釉陶（低温铅釉）\",\"location\":\"美国 · 费城 · 费城艺术博物馆\",\"acc\":[[\"馆藏编号\",\"1923-21-441\"]],\"intro\":[\"这是一尊制于明代的琉璃水月观音，具有水月形制的特点：自在坐、屈膝搭手、垂足踏莲。和辽宋金流行的木雕观音不同，她由琉璃烧制而成。大型琉璃件烧制不易，这近一米高的琉璃像，绿袍黄裙，釉色莹润而不相混⁽¹⁾，璎珞、龙鳞、莲瓣细致分明，足见工艺高超。\",\"中国造像万千，题记里留名的往往是功德主，匠人的姓名大多湮没无闻。她是例外，作者为山西阳城的乔彬。乔家世代烧造三彩、琉璃、法华，作品散在大都会⁽⁴,⁵⁾、大英博物馆⁽⁶⁾，手艺至今还在传承⁽⁶⁾。\",\"中国自古以书画为「艺」，以造像、烧窑为「工」。乔彬烧成这尊观音的第二年，米开朗琪罗开始画西斯廷礼拜堂的天顶。一个被写进了艺术史，一个只留下了名字。\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。费城艺术博物馆用“she”，流浪博物馆也用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"她原本供在山西北部的一座佛寺里。底座侧面的墨书写着施主的名字和寺名，信众在她面前祈求自己和子孙来世善生⁽¹⁾。那座寺在哪里、今天还在不在，暂时没有答案。\",\"她后来出现在天津。英裔爱尔兰商人乔治·克罗夫茨（George Crofts）在那里做古董批发，把大批中国文物卖往海外，多伦多的皇家安大略博物馆至今还保存着他寄去的出货相册⁽³⁾。1923 年，查尔斯·路丁顿（Charles H. Ludington）把一批克罗夫茨的藏品捐给费城艺术博物馆，她就在其中⁽¹⁾。\",\"乔彬的署名造像，还有两组在纽约：1482 年的一尊道教神官，和 1503 年的一组佛涅槃与罗汉群像，都藏在大都会⁽⁴,⁵⁾。馆方把乔彬的活跃年代标到 1507 年为止，正是这一尊的年份⁽¹⁾。阳城乔家烧了几百年琉璃，明代还为紫禁城烧过屋瓦⁽⁶⁾；这门手艺 2008 年列入国家级非物质文化遗产⁽⁷⁾。\",\"今天，她在费城艺术博物馆三楼的 339 号展厅⁽¹⁾。而在五百年后的阳城，乔家人还在烧。2006 年起，乔家后人乔家胜和女儿乔香萍，重新烧起了断了近三百年的法华⁽⁶⁾。\"],\"items\":[{\"at\":\"1482 年\",\"text\":\"乔彬烧成一尊道教神官像，今藏大都会⁽⁴⁾。\"},{\"at\":\"1503 年\",\"text\":\"乔彬烧成一组佛涅槃与罗汉群像，今藏大都会⁽⁵⁾。\"},{\"at\":\"1507 年（明正德二年）\",\"text\":\"乔彬烧成这尊观音，供奉在山西北部一座佛寺⁽¹⁾。\"},{\"at\":\"1923 年\",\"text\":\"路丁顿把克罗夫茨的一批藏品捐给费城艺术博物馆，她在其中⁽¹⁾。\"},{\"at\":\"2006 年\",\"text\":\"乔家后人乔家胜、乔香萍父女在阳城恢复法华烧制⁽⁶⁾。\"},{\"at\":\"今天\",\"text\":\"陈列于费城艺术博物馆 339 号展厅⁽¹⁾。\"}]},\"refs\":[\"费城艺术博物馆：《Guanyin, Bodhisattva of Compassion》，乔彬（Qiao Bin，约 1481—1507 年活跃），1923-21-441。用于 1507 年、尺寸、材质、宝冠坐佛、龙与神兽、乔氏工匠的造型与三彩釉、底座墨书记施主与山西北部佛寺及来世善生之愿、「Gift of Charles H. Ludington from the George Crofts Collection, 1923」及 339 号展厅。https://www.philamuseum.org/objects/40881\",\"Chün-fang Yü（于君方）, Kuan-yin: The Chinese Transformation of Avalokiteśvara (New York: Columbia University Press, 2001)。用于明代南海观音在水月观音等形象上发展而来，及普陀山成为观音道场。\",\"皇家安大略博物馆：《Crofts Album 8》。用于乔治·克罗夫茨是在天津经营的英裔爱尔兰商人、古董批发商，及 1921 年寄给该馆的出货相册。https://collections.rom.on.ca/objects/331997/crofts-album-8\",\"大都会艺术博物馆：《Daoist divine official》，乔彬，1482 年，1971.163。用于乔彬约 1481—1507 年活跃、山西琉璃。https://www.metmuseum.org/art/collection/search/50549\",\"大都会艺术博物馆：《Parinirvana (death and transcendence of the Buddha) and attendant arhats》，乔彬，1503 年，25.227.1–6，Fletcher Fund, 1925。https://www.metmuseum.org/art/collection/search/53924\",\"阳城县人民政府：《阳城，让法华技艺重放光彩》，2021 年 2 月。用于阳城乔氏琉璃世家、乔彬之名、明代乔氏琉璃瓦用于紫禁城、琉璃以铅为助熔剂，大英博物馆藏万历元年乔永丰等所作法华观音构件，及 2006 年起乔家胜、乔香萍父女恢复法华烧制。http://www.yczf.gov.cn/yryc/ycmp/202102/t20210202_1350298.shtml\",\"《探访阳城琉璃小镇》，搜狐。用于后则腰村、乔氏琉璃元明成熟明清兴盛、2008 年列入国家级非物质文化遗产。https://www.sohu.com/a/432230750_783979\",\"标题下引句出自唐代白居易《画水月菩萨赞》：「净渌水上，虚白光中。一睹其相，万缘皆空。」\",\"玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\",\"《西游记》第七十一回「行者假名降怪犼　观音现像伏妖王」：朱紫国的妖王赛太岁，原是观音菩萨跨坐的金毛犼。用于犼为观音坐骑的通行说法。\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Guanyin, Bodhisattva of Compassion\",\"oneLiner\":\"Glazed color preserves the memory of maker and donor.\",\"period\":\"Ming dynasty, dated 1507\",\"size\":\"H. 93.6 cm, W. 50.3 cm, D. 24.7 cm\",\"craft\":\"Stoneware with polychrome glaze (Shanxi liuli ware)\",\"location\":\"United States, Philadelphia, Philadelphia Museum of Art\",\"acc\":[[\"Accession no.\",\"1923-21-441\"]],\"intro\":[\"Right knee raised, right hand resting on it, left foot lowered onto a lotus: this is the posture of royal ease, the pose of the water-moon Guanyin. But she no longer sits on a rock by the water. A dragon writhes beneath her beside a lion-like beast, and the Philadelphia Museum of Art calls her Guanyin of the Southern Sea.⁽¹⁾ By the Ming dynasty, the water-moon Guanyin had gone out to sea.⁽²⁾\",\"Her maker signed his work. Qiao Bin, a glaze potter from Yangcheng in Shanxi, made her in 1507—a rare name in a tradition of anonymous craftsmen.⁽¹⁾\"],\"about\":{\"title\":\"From Water-Moon to the Southern Sea\",\"paras\":[\"The water-moon Guanyin was a Chinese invention of the Tang dynasty: the bodhisattva seated at ease on a rock by the water, one knee raised. By the Ming dynasty the image had merged into Guanyin of the Southern Sea, whose island home was placed at Putuo, off the coast of Zhejiang.⁽²⁾ Here the rock has turned into waves, a dragon and a guardian beast.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"\",\"paras\":[\"She was made for a Buddhist temple in northern Shanxi. Ink inscriptions on her base name the donor and the temple, where worshippers prayed for a good rebirth for themselves and their descendants.⁽¹⁾\",\"She later passed through Tianjin, where the Anglo-Irish merchant George Crofts ran a wholesale antiques business supplying museums abroad.⁽³⁾ In 1923 Charles H. Ludington gave a group of objects from the Crofts collection to the Philadelphia Museum of Art, and she was among them.⁽¹⁾\",\"Two more works signed by Qiao Bin are at the Met: a Daoist official of 1482 and a Parinirvana group of 1503.⁽⁴,⁵⁾\",\"Five centuries later the Qiao family is still at work in Yangcheng: since 2006 Qiao Jiasheng and his daughter Qiao Xiangping have revived the family’s fahua glazes, lost for some three hundred years.⁽⁶⁾\"],\"items\":[{\"at\":\"1507\",\"text\":\"Made by Qiao Bin for a temple in northern Shanxi.⁽¹⁾\"},{\"at\":\"1923\",\"text\":\"Given to the Philadelphia Museum of Art by Charles H. Ludington from the George Crofts Collection.⁽¹⁾\"}]},\"refs\":[\"费城艺术博物馆：《Guanyin, Bodhisattva of Compassion》，乔彬（Qiao Bin，约 1481—1507 年活跃），1923-21-441。用于 1507 年、尺寸、材质、宝冠坐佛、龙与神兽、乔氏工匠的造型与三彩釉、底座墨书记施主与山西北部佛寺及来世善生之愿、「Gift of Charles H. Ludington from the George Crofts Collection, 1923」及 339 号展厅。https://www.philamuseum.org/objects/40881\",\"Chün-fang Yü（于君方）, Kuan-yin: The Chinese Transformation of Avalokiteśvara (New York: Columbia University Press, 2001)。用于明代南海观音在水月观音等形象上发展而来，及普陀山成为观音道场。\",\"皇家安大略博物馆：《Crofts Album 8》。用于乔治·克罗夫茨是在天津经营的英裔爱尔兰商人、古董批发商，及 1921 年寄给该馆的出货相册。https://collections.rom.on.ca/objects/331997/crofts-album-8\",\"大都会艺术博物馆：《Daoist divine official》，乔彬，1482 年，1971.163。用于乔彬约 1481—1507 年活跃、山西琉璃。https://www.metmuseum.org/art/collection/search/50549\",\"大都会艺术博物馆：《Parinirvana (death and transcendence of the Buddha) and attendant arhats》，乔彬，1503 年，25.227.1–6，Fletcher Fund, 1925。https://www.metmuseum.org/art/collection/search/53924\",\"阳城县人民政府：《阳城，让法华技艺重放光彩》，2021 年 2 月。用于阳城乔氏琉璃世家、乔彬之名、明代乔氏琉璃瓦用于紫禁城、琉璃以铅为助熔剂，大英博物馆藏万历元年乔永丰等所作法华观音构件，及 2006 年起乔家胜、乔香萍父女恢复法华烧制。http://www.yczf.gov.cn/yryc/ycmp/202102/t20210202_1350298.shtml\",\"《探访阳城琉璃小镇》，搜狐。用于后则腰村、乔氏琉璃元明成熟明清兴盛、2008 年列入国家级非物质文化遗产。https://www.sohu.com/a/432230750_783979\",\"标题下引句出自唐代白居易《画水月菩萨赞》：「净渌水上，虚白光中。一睹其相，万缘皆空。」\",\"玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\",\"《西游记》第七十一回「行者假名降怪犼　观音现像伏妖王」：朱紫国的妖王赛太岁，原是观音菩萨跨坐的金毛犼。用于犼为观音坐骑的通行说法。\"]}},\"unplacedLookPoints\":[],\"lookPoints\":[{\"id\":\"pt-ceramic-3\",\"title\":\"化佛\",\"text\":\"宝冠正中坐着一尊小佛，是她的老师阿弥陀佛⁽¹⁾。宝冠中是否有化佛，是判断一尊造像是否是观音的标志之一。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-0.184,5.209,0.983],\"cameraPose\":{\"position\":[2.151,3.162,9.809],\"target\":[-0.102,4.154,0.443]},\"note\":{\"x\":0.71,\"y\":0.323,\"width\":341}},{\"id\":\"pt-ceramic-1\",\"title\":\"自在坐\",\"text\":\"水月观音典型坐姿，一膝支起，手轻搭于膝上，一腿垂下，脚踏莲花。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-1.882,-0.588,1.051],\"cameraPose\":{\"position\":[13.262,-1.17,15.902],\"target\":[-0.753,-0.235,0.42]},\"note\":{\"x\":0.701,\"y\":0.435,\"width\":280}},{\"id\":\"pt-ceramic-2\",\"title\":\"龙与犼\",\"text\":\"这只像小狗的神兽，一般认为是观音的坐骑「犼」hǒu⁽¹⁰⁾。旁边还有一条龙在翻腾，龙是明清琉璃造像中喜闻乐见的元素。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[0.354,-4.468,1.201],\"cameraPose\":{\"position\":[-0.541,-1.18,12.358],\"target\":[0.295,-4.419,0.297]},\"note\":{\"x\":0.72,\"y\":0.409,\"width\":325}},{\"id\":\"pt-ceramic-5\",\"title\":\"题记留名\",\"text\":\"底座两侧面皆有斑驳的墨书，记着施主和佛寺的名字⁽¹⁾。题记里通常只留功德主的名字，工匠是谁，往往无从知道。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-2.332,-2.439,-0.017],\"cameraPose\":{\"position\":[-13.916,-4.678,2.51],\"target\":[3.135,-2.224,-0.327]},\"note\":{\"x\":0.68,\"y\":0.428,\"width\":342}},{\"id\":\"pt-ceramic-4\",\"title\":\"琉璃\",\"text\":\"绿、黄、白，是山西琉璃最常见的釉色。琉璃以铅为助熔剂，低温烧成，釉面莹润透亮⁽⁶⁾。阳城乔家烧了几百年琉璃，明代还为紫禁城烧过屋瓦⁽⁶⁾。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[1.036,-1.229,1.705],\"cameraPose\":{\"position\":[2.267,-2.873,22.645],\"target\":[0.204,-0.397,-0.292]},\"note\":{\"x\":0.761,\"y\":0.399,\"width\":357}}]}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"明-琉璃水月观音 · Guanyin, Bodhisattva of Compassion | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Right knee raised, right hand resting on it, left foot lowered onto a lotus: this is the posture of royal ease, the pose of the water-moon Guanyin. But she no longer sits on a rock\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/guanyin-ceramic-pma\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/guanyin-ceramic-pma\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/guanyin-ceramic-pma\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"明-琉璃水月观音 · Guanyin, Bodhisattva of Compassion | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"Right knee raised, right hand resting on it, left foot lo
