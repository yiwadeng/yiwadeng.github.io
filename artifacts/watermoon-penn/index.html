$13\",\"$14\",\"$15\",\"$16\",\"$39\",\"$3a\",\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"watermoon-penn\",\"status\":\"modeled\",\"dealGroup\":\"statue-sit\",\"seriesSlugs\":[\"watermoon\"],\"title\":{\"zh\":\"金元-木雕水月观音\",\"en\":\"Water-Moon Guanyin — Philadelphia, Penn Museum\"},\"typeLabel\":{\"zh\":\"木雕佛教造像\",\"en\":\"Polychromed wood sculpture\"},\"metadata\":{\"period\":{\"zh\":\"金至元（12至14世纪）\",\"en\":\"Jin–Yuan dynasties, 12th–14th century\"},\"materialTechnique\":{\"zh\":\"木雕彩绘贴金\",\"en\":\"Carved wood with gesso, paint and gilding\"},\"collection\":{\"museum\":{\"zh\":\"宾夕法尼亚大学考古学与人类学博物馆\",\"en\":\"Penn Museum\"},\"city\":{\"zh\":\"费城\",\"en\":\"Philadelphia\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"C408A\",\"url\":\"https://collections.penn.museum/collections/object/179391\"},\"dimensions\":{\"zh\":\"约 213 厘米\",\"en\":\"H. c. 213 cm\"}},\"description\":{\"zh\":\"这是一尊巨大的木雕水月观音，光坐像本身就有两米一高。彩绘贴金，眉眼低垂，嘴角一丝若有若无的微笑。和多数水月观音屈右膝搭右手不同，她屈左膝搭左手。值得细看的是她的坐姿，精准的刻画出了身体重心倚向右肘支撑处的那种潇洒的松弛感。有的“自在坐”只是依据形制做了造型，而她的自在坐名副其实。\",\"en\":\"One knee raised, one leg hanging free, her left arm draped loosely over her knee — she sits as if resting in her own courtyard. Nearly seven feet tall, this carved wooden Guanyin lives in the Penn Museum in Philadelphia, object number C408A.⁽¹,³⁾\\n\\nThe museum bought her from the dealer C. T. Loo in 1924.⁽¹⁾ Which temple she came from, which province, no one wrote down. All that remains is a large, deep recess in her back, which the museum’s staff took for a reliquary niche.⁽³⁾ What it once held, no one knows.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"watermoon-penn-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"watermoon-penn-hd.glb\",\"modelLantern\":\"watermoon-penn-lantern.glb\"},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.08,\"paddingTop\":0.12,\"modelScale\":1,\"modelOffset\":[0,0,0],\"bestFaceYaw\":0,\"yawRange\":45,\"artifactLight\":{\"color\":\"#b7a478\",\"intensity\":1.5,\"position\":[0,1,0.5],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":0.85,\"penumbra\":1}},\"orchestration\":{\"importance\":\"standard\",\"category\":\"sculpture\",\"tags\":[\"水月观音\",\"雕塑\",\"Penn\"]},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"觀自在\",\"subtitle\":{\"zh\":\"净渌水上，虚白光中。一睹其相，万缘皆空\",\"en\":\"Her heart is hollow; her ease remains.\"},\"riverLead\":{\"zh\":\"千江映月，万缘皆空\",\"en\":\"Her heart is hollow; her ease remains.\"},\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国\",\"en\":\"China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"金元-木雕水月观音\",\"oneLiner\":\"净渌水上，虚白光中。一睹其相，万缘皆空\",\"period\":\"金至元（12至14世纪）\",\"size\":\"约 213 厘米\",\"craft\":\"木雕彩绘贴金\",\"location\":\"美国 · 费城 · 宾夕法尼亚大学考古学与人类学博物馆\",\"acc\":[[\"馆藏编号\",\"C408A\"],[\"入藏年份\",\"1924\"]],\"intro\":[\"这是一尊巨大的木雕水月观音，光坐像本身就有两米一高。彩绘贴金，眉眼低垂，嘴角一丝若有若无的微笑。和多数水月观音屈右膝搭右手不同，她屈左膝搭左手。值得细看的是她的坐姿，精准的刻画出了身体重心倚向右肘支撑处的那种潇洒的松弛感。有的“自在坐”只是依据形制做了造型，而她的自在坐名副其实。\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。宾夕法尼亚大学考古学与人类学博物馆用“he”，流浪博物馆用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"她怎么离开中国、什么时候离开，没有任何记载。能查到的线索，都从卢芹斋开始。1922 年春，宾大博物馆办了一场中国艺术特展，展品里有一批卢芹斋的借展品⁽⁵⁾；同年 6 月，美国杂志《International Studio》专文介绍了展厅里这尊「大菩萨像」⁽⁶,⁷⁾。她很可能就是那批借展品之一，1924 年被正式买下⁽¹,⁴⁾。那一年的馆刊开头写道，这种姿势的木雕观音「如今在公私收藏里并不少见」⁽³⁾——一句平常话，背后是一整批离乡的菩萨。\",\"此后一百年，她再没离开宾大：1941 年起在中国展厅，1968 年搬进中国圆厅，一坐近五十年；2017 年换到新展厅，今天仍在展出⁽¹⁾。同一座博物馆里，还住着易县三彩罗汉⁽⁸⁾，和昭陵六骏中的飒露紫、拳毛騧。\"],\"items\":[{\"at\":\"1922 年 4 月\",\"text\":\"宾大博物馆在哈里森圆厅开幕中国艺术特展，展品中有若干件卢芹斋的借展品，她可能就在其中⁽⁵⁾。\"},{\"at\":\"1922 年 6 月\",\"text\":\"美国杂志《International Studio》介绍宾大正在展出的这尊「大菩萨像」，定为九世纪，说她约有真人的一倍半大⁽⁶,⁷⁾。\"},{\"at\":\"1924 年初\",\"text\":\"博物馆从卢芹斋处购入。馆刊 3 月的购藏栏记下一笔：「一尊中国木雕观音」⁽¹,⁴⁾。\"},{\"at\":\"1924 年 12 月\",\"text\":\"馆刊刊出她的图版，记下一木雕成、石膏贴金、背后深凹槽、原座已失等细节⁽³⁾。\"},{\"at\":\"1968—2017 年\",\"text\":\"陈列于宾大博物馆的中国圆厅⁽¹⁾。\"},{\"at\":\"2017 年至今\",\"text\":\"移至新的中国展厅，馆方现标注为亚洲展厅陈列中，馆藏号 C408A⁽¹⁾。\"}]},\"refs\":[\"宾夕法尼亚大学博物馆：《Statue》，C408A。馆方著录：馆藏号、「金至元」断代（两朝均标不确定）、木质彩绘、Guanyin 与 royal ease 描述、「Purchased from C. T. Loo, 1924」、陈列状态及展览史（1941–1966 Chinese Halls，1968–2017 Chinese Rotunda，2017 起 China Gallery）。https://collections.penn.museum/collections/object/179391 （2024 年存档：http://web.archive.org/web/20240615043204/https://www.penn.museum/collections/object/179391 ）\",\"宾夕法尼亚大学博物馆：《Statue Fragment》，C408B。用于断指单独编号、「可能是右手的」、现存库房。https://collections.penn.museum/collections/object/282139\",\"宾大博物馆（未署名）：《Chinese Sculpture Recently Acquired》，The Museum Journal XV 卷 4 期，1924 年，第 268 页，Plate IX。用于整木雕成只接双手、石膏彩绘贴金、原座已失、背部深凹槽、耳边发缕与 C400 相同、南宋说「尚无定论」、高 7 英尺，及「同类木雕观音在公私收藏中并不少见」一句。https://www.penn.museum/sites/journal/1278/ （图版：https://www.penn.museum/sites/journal/files/2020/04/sculpt06.jpg ）\",\"宾大博物馆：《Museum Notes》，The Museum Journal XV 卷，1924 年 3 月。用于 1924 年初购藏记录「A Chinese wooden statue of Kwanyin」。https://www.penn.museum/sites/journal/13389/\",\"宾大博物馆：《Notes – Chinese Exhibition》，The Museum Journal，1922 年 3 月。用于 1922 年 4 月 8 日在哈里森圆厅开幕的中国艺术特展含卢芹斋借展品（未点名本像）。https://www.penn.museum/sites/journal/13259/\",\"佚名：《Masterpiece of Chinese Sculpture》，International Studio 第 75 卷，1922 年 6 月，第 227–228 页。用于宾大展出中的「大菩萨像」、九世纪说、约真人 1.5 倍大小。https://archive.org/details/internationalstu7529unse\",\"Horace H. F. Jayne：《Appendix II》，The University Museum Bulletin IX 卷 2–3 期，1941 年，第 58 页。用于多层石膏、多次修补、石膏堆花贴金、「元代或稍早」断代，及其著录把 1922 年 International Studio 一文列为本像文献。https://www.penn.museum/sites/bulletin/2390/\",\"宾夕法尼亚大学博物馆：《Statue》，C66A。用于同馆藏有易县三彩罗汉。https://collections.penn.museum/collections/object/151869\",\"标题下引句出自唐代白居易《画水月菩萨赞》：「净渌水上，虚白光中。一睹其相，万缘皆空。」\",\"玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Water-Moon Guanyin — Philadelphia, Penn Museum\",\"oneLiner\":\"Her heart is hollow; her ease remains.\",\"period\":\"Jin–Yuan dynasties, 12th–14th century\",\"size\":\"H. c. 213 cm\",\"craft\":\"Carved wood with gesso, paint and gilding\",\"location\":\"United States, Philadelphia, Penn Museum\",\"acc\":[[\"Accession no.\",\"C408A\"],[\"Acquired\",\"1924\"]],\"intro\":[\"One knee raised, one leg hanging free, her left arm draped loosely over her knee — she sits as if resting in her own courtyard. Nearly seven feet tall, this carved wooden Guanyin lives in the Penn Museum in Philadelphia, object number C408A.⁽¹,³⁾\",\"The museum bought her from the dealer C. T. Loo in 1924.⁽¹⁾ Which temple she came from, which province, no one wrote down. All that remains is a large, deep recess in her back, which the museum’s staff took for a reliquary niche.⁽³⁾ What it once held, no one knows.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[{\"h\":\"One block of wood\",\"sub\":\"$undefined\"},\"The museum’s 1924 journal records that, apart from the hands, which were carved separately and joined at the wrists, the whole figure was cut from a single piece of wood.⁽³⁾ A seated figure over two meters tall, coaxed out of one block, cut by cut.\",\"Even the hands did not survive intact. A broken finger — probably from the right hand, the museum says — has its own object number, C408B, and is kept in storage.⁽²⁾\",{\"h\":\"Wood you cannot see\",\"sub\":\"$undefined\"},\"You won’t find a single inch of bare wood on her. As the journal put it, the natural surface is nowhere exposed: the whole figure was coated in gesso, then painted and laid with gold leaf.⁽³⁾\",\"In 1941, the museum’s director Horace H. F. Jayne noticed that the gesso had been applied in many successive layers — over the centuries she was repaired and refurbished again and again. In places the gesso was built up into low-relief patterns before being gilded.⁽⁷⁾\",{\"h\":\"The hollow in her back\",\"sub\":\"$undefined\"},\"Walk around behind her and you’ll see a deep rectangular cavity. The 1924 journal called it a “large and deep recess evidently intended for a reliquary.”⁽³⁾\",\"Before a Buddhist image in China was consecrated, sacred contents — sutras, relics, grains — were sealed inside it, giving the wood a heart. What was once sealed in hers, and where it went, is nowhere recorded.\",\"Her original seat is gone too; it was already missing when she arrived in 1924.⁽³⁾ What she sits on now is a museum plinth.\",{\"h\":\"A lock of hair by the ear\",\"sub\":\"$undefined\"},\"Look closely at her ears: on each side a single lock of hair loops across, just above the long earlobe.⁽³⁾\",\"Staff in 1924 spotted that a Liao-dynasty gilt-bronze Guanyin in the same museum (C400) shares exactly this detail.⁽³⁾ Different material, different century — the same quiet signature.\",{\"h\":\"A century, four dynasties\",\"sub\":\"$undefined\"},\"How old is she? In a hundred years the answer has changed several times. A 1922 American magazine called her ninth-century, Tang.⁽⁶⁾ The 1924 journal noted that similar figures had been assigned to the Southern Song, adding that “a definite decision is not yet possible.”⁽³⁾ In 1941 Jayne placed her in the Yuan dynasty or a little earlier.⁽⁷⁾ Today the museum lists “Jin to Yuan,” with a question mark after each.⁽¹⁾\",\"That is a spread of four or five hundred years. She simply sits, unhurried, waiting for us to make up our minds.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"\",\"paras\":[\"How and when she left China is not recorded. Every trail starts with C. T. Loo. In the spring of 1922 the Penn Museum opened a special exhibition of Chinese art that included a number of loans from Loo.⁽⁵⁾ That June, the magazine International Studio ran a feature on a great Bodhisattva in the show.⁽⁶,⁷⁾ She was very likely one of Loo’s loans, and in 1924 the museum bought her outright.⁽¹,⁴⁾ That year’s journal opened its entry by remarking that wooden Guanyins in this pose were “not infrequently seen in public and private collections today.”⁽³⁾ An offhand line — behind it, a whole generation of bodhisattvas far from home.\",\"She has not left Penn since. From 1941 she stood in the Chinese Halls; in 1968 she moved into the Chinese Rotunda, where she sat for nearly fifty years; in 2017 she moved to a new gallery, and she is on view today.⁽¹⁾ Under the same roof are a Yixian sancai luohan⁽⁸⁾ and two of the Six Steeds of Zhaoling, Saluzi and Quanmaogua.\"],\"items\":[{\"at\":\"April 1922\",\"text\":\"The Penn Museum opens a special exhibition of Chinese art in Harrison Hall, including several loans from C. T. Loo. She may have been among them.⁽⁵⁾\"},{\"at\":\"June 1922\",\"text\":\"International Studio features the “great Bodhisattva” on view at Penn, dating it to the ninth century and describing it as about one and a half times life size.⁽⁶,⁷⁾\"},{\"at\":\"Early 1924\",\"text\":\"The museum purchases her from C. T. Loo. The March journal lists the acquisition of “a Chinese wooden statue of Kwanyin.”⁽¹,⁴⁾\"},{\"at\":\"December 1924\",\"text\":\"The museum journal publishes her photograph, noting the single-block carving, gesso and gilding, the deep recess in the back, and the missing seat.⁽³⁾\"},{\"at\":\"1968–2017\",\"text\":\"On view in the Penn Museum’s Chinese Rotunda.⁽¹⁾\"},{\"at\":\"2017–present\",\"text\":\"Moved to the new China Gallery; the museum now lists her as on display in the Asia Galleries, object number C408A.⁽¹⁾\"}]},\"refs\":[\"宾夕法尼亚大学博物馆：《Statue》，C408A。馆方著录：馆藏号、「金至元」断代（两朝均标不确定）、木质彩绘、Guanyin 与 royal ease 描述、「Purchased from C. T. Loo, 1924」、陈列状态及展览史（1941–1966 Chinese Halls，1968–2017 Chinese Rotunda，2017 起 China Gallery）。https://collections.penn.museum/collections/object/179391 （2024 年存档：http://web.archive.org/web/20240615043204/https://www.penn.museum/collections/object/179391 ）\",\"宾夕法尼亚大学博物馆：《Statue Fragment》，C408B。用于断指单独编号、「可能是右手的」、现存库房。https://collections.penn.museum/collections/object/282139\",\"宾大博物馆（未署名）：《Chinese Sculpture Recently Acquired》，The Museum Journal XV 卷 4 期，1924 年，第 268 页，Plate IX。用于整木雕成只接双手、石膏彩绘贴金、原座已失、背部深凹槽、耳边发缕与 C400 相同、南宋说「尚无定论」、高 7 英尺，及「同类木雕观音在公私收藏中并不少见」一句。https://www.penn.museum/sites/journal/1278/ （图版：https://www.penn.museum/sites/journal/files/2020/04/sculpt06.jpg ）\",\"宾大博物馆：《Museum Notes》，The Museum Journal XV 卷，1924 年 3 月。用于 1924 年初购藏记录「A Chinese wooden statue of Kwanyin」。https://www.penn.museum/sites/journal/13389/\",\"宾大博物馆：《Notes – Chinese Exhibition》，The Museum Journal，1922 年 3 月。用于 1922 年 4 月 8 日在哈里森圆厅开幕的中国艺术特展含卢芹斋借展品（未点名本像）。https://www.penn.museum/sites/journal/13259/\",\"佚名：《Masterpiece of Chinese Sculpture》，International Studio 第 75 卷，1922 年 6 月，第 227–228 页。用于宾大展出中的「大菩萨像」、九世纪说、约真人 1.5 倍大小。https://archive.org/details/internationalstu7529unse\",\"Horace H. F. Jayne：《Appendix II》，The University Museum Bulletin IX 卷 2–3 期，1941 年，第 58 页。用于多层石膏、多次修补、石膏堆花贴金、「元代或稍早」断代，及其著录把 1922 年 International Studio 一文列为本像文献。https://www.penn.museum/sites/bulletin/2390/\",\"宾夕法尼亚大学博物馆：《Statue》，C66A。用于同馆藏有易县三彩罗汉。https://collections.penn.museum/collections/object/151869\",\"标题下引句出自唐代白居易《画水月菩萨赞》：「净渌水上，虚白光中。一睹其相，万缘皆空。」\",\"玄奘《大唐西域记》将 Avalokiteśvara 译为「观自在」，并论旧译「观世音／观音」之未安。\"]}},\"unplacedLookPoints\":[],\"lookPoints\":[{\"id\":\"pt-mvw30k7d2\",\"title\":\"开脸\",\"text\":\"大多数水月观音脸颊丰满、下颌圆润，她却是少见的窄脸、尖下巴，眉眼也显得清秀。这样的开脸，或许参照了当时某个真实的人物？还是工匠自己的审美呢？\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-1.2,9.698,-2.596],\"cameraPose\":{\"position\":[12.556,13.51,26.251],\"target\":[-1.644,9.688,-1.073]},\"note\":{\"x\":0.735,\"y\":0.455,\"width\":355}},{\"id\":\"pt-mvw30k7d1\",\"title\":\"自在坐\",\"text\":\"这种水月观音的典型坐姿叫自在坐，又名王者坐，是一种放松而高贵的坐姿。通常一腿下垂、一腿曲起，手臂轻搭在膝上，神色超然。\\n\\n关于自在：玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽¹⁰⁾。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[4.816,1.698,-0.174],\"cameraPose\":{\"position\":[-14.933,-6.357,51.335],\"target\":[1.926,0.679,-0.07]},\"note\":{\"x\":0.698,\"y\":0.352,\"width\":378}},{\"id\":\"pt-mvw2jsj2\",\"title\":\"金身\",\"text\":\"此尊观音通身「贴金」。工匠先在木胎上刷一层白色的底子，再彩绘、刷胶，把薄如蝉翼的金箔一片片贴上去。衣上的花纹会先堆出浮雕，再贴金，叫作「沥粉贴金」⁽³,⁷⁾。旧时寺院或还愿者给佛像重新上金上彩，叫「重塑金身」⁽⁷⁾。馆方记载，她身上的白底层层叠垒，说明几百年间，她被重塑金身过好几次，想必是守护了很多代人的心愿吧。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-2.775,-10.137,6.67],\"cameraPose\":{\"position\":[31.993,-5.296,56.276],\"target\":[2.66,-1.33,-0.049]},\"note\":{\"x\":0.647,\"y\":0.432,\"width\":522}},{\"id\":\"pt-mvw30k7d0\",\"title\":\"装藏\",\"text\":\"佛像雕好后，要在它体内的暗格里放进经卷、舍利、五谷、香料、丝绸和宝石等，再封上，这叫「装藏」（也写作「装脏」）。此尊背部开槽⁽³⁾很深，开口之大，在同类水月观音里少见。里面装入过什么呢，不禁令人好奇。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-8.202,3.961,-5.089],\"cameraPose\":{\"position\":[-40.934,-4.845,-0.602],\"target\":[-2.027,4.817,-1.609]},\"note\":{\"x\":0.638,\"y\":0.418,\"width\":426}}]}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"金元-木雕水月观音 · Water-Moon Guanyin — Philadelphia, Penn Museum | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"One knee raised, one leg hanging free, her left arm draped loosely over her
