8:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国；清宫旧藏\",\"en\":\"China; former Qing imperial collection\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"女史箴图\",\"oneLiner\":\"大英最著名的中国画，一年只打开六周。\",\"period\":\"约 5—7 世纪（传顾恺之；国内通称唐摹本）\",\"size\":\"画心高 24.4 厘米，长 343.8 厘米\",\"craft\":\"绢本设色，手卷（1914—1915 年改装成平板）；包首为宋代缂丝\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"1903,0408,0.1\"],[\"入藏年份\",\"1903\"],[\"入藏方式\",\"以 25 英镑购自约翰逊上尉\"]],\"intro\":[\"西晋时，张华写了一篇《女史箴》，告诫后宫的女子如何立身处世⁽¹⁾。后来有人把它画成了一卷画，一段箴文，一段人物⁽¹⁾。这一卷，就是今天大英博物馆最著名的中国画。\",\"它画于 5 到 7 世纪之间，传说出自东晋顾恺之之手，国内一般称它唐摹本⁽¹,³⁾。原来有十二段，现在只剩九段，开头三段早已丢失⁽¹⁾。\",\"它太脆弱了，大英每年只把它打开六周左右，其余时间都锁在专门的展柜里避光⁽²⁾。\"],\"about\":{\"title\":\"一卷画的一千年\",\"paras\":[{\"h\":\"箴文与画\",\"sub\":\"$undefined\"},\"画里没有背景，只有人物，衣带飘动，线条连绵均匀，还带着汉代的余韵⁽¹⁾。其中一段，一位宫女走向皇帝，皇帝抬手拒绝了她；另一段，宫女坐在镜前梳妆，侍女替她理发⁽¹⁾。人物的表情已经有了各自的性情，接近肖像⁽¹⁾。\",\"北京故宫还有一卷宋代的摹本，是纸本白描，比大英这卷多出两段，大英丢失的开头就保存在那里⁽¹,³⁾。\",{\"h\":\"和顾恺之有多少关系\",\"sub\":\"$undefined\"},\"画心左下角写着「顾恺之画」四个字，但这是后人加上去的⁽¹,²⁾。把这卷画和顾恺之联系起来的文字，要到宋代才出现，所以大英的研究者说，这层关系其实很弱⁽¹⁾。\",{\"h\":\"一千年的主人\",\"sub\":\"$undefined\"},\"卷上盖满了历代收藏者的印。它进过北宋的内府，又进了金章宗的内府；南宋的权相贾似道藏过它，一位叫「阿里」的回鹘收藏家也藏过它⁽¹⁾。明代经过王鏊、项元汴，清初经过梁清标、安岐，最后在 1746 年以前进了乾隆的内府⁽¹⁾。\",\"拖尾有一段瘦金体的楷书，过去以为是宋徽宗写的，现在多数学者认为出自金章宗⁽¹,²⁾。\",\"乾隆极爱这卷画，在卷尾画了一枝兰花，题了字⁽¹⁾。1746 年，他把它和三卷李公麟的画放在一起，移到紫禁城建福宫的静怡轩，题名「四美具」⁽¹⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"乾隆死后，建福宫封了起来，画大概一直留在宫里⁽¹⁾。它后来去了哪里，有两种说法：大英引用的研究推测，1870 年慈禧可能命人把它移到了紫禁城的懋勤殿⁽¹⁾；国内的说法则是，慈禧时它被移去了颐和园⁽³⁾。\",\"1900 年 8 月，八国联军进入北京。英印军第一孟加拉骑兵团的上尉克拉伦斯·约翰逊随部队进城，驻留了两个月，他的部队曾驻扎在颐和园⁽¹,²⁾。这卷画就是在这时到了他手里。他是怎么得到的，大英说至今不清楚⁽¹⁾；国内的文章说是趁乱盗走⁽³⁾；约翰逊的家人则说，是一位被他救下的贵妇送给他的⁽³⁾。\",\"1903 年，约翰逊把手卷带到大英，本来只想请人估一估卷外那枚玉别子的价钱。馆员认出了这是什么，用 25 英镑买下了它⁽²,³⁾。那时它已经是一匹「褐色的丝绢」，满是古代修补的痕迹⁽²⁾。\",\"1914 到 1915 年，大英把手卷拆开，裱成了两块平板，这种做法后来一直受到批评⁽¹,²⁾。2013 年，大英请来中国和其他地方的书画、修复专家一起讨论它的保存；2014 年，为它定做了专门的展柜⁽²⁾。\"],\"items\":[{\"at\":\"约 292 年\",\"text\":\"张华作《女史箴》⁽²⁾。\"},{\"at\":\"5—7 世纪\",\"text\":\"本卷绘成⁽¹⁾。\"},{\"at\":\"北宋—清初\",\"text\":\"历经宋、金内府，贾似道、王鏊、项元汴、梁清标、安岐等人收藏⁽¹⁾。\"},{\"at\":\"1746 年\",\"text\":\"乾隆移藏建福宫静怡轩，题「四美具」⁽¹⁾。\"},{\"at\":\"1900 年 8 月\",\"text\":\"八国联军进京，到了约翰逊上尉手中⁽¹,²⁾。\"},{\"at\":\"1903 年\",\"text\":\"大英以 25 英镑购入⁽²⁾。\"},{\"at\":\"1914—1915 年\",\"text\":\"拆开改装成两块平板⁽¹⁾。\"},{\"at\":\"2014 年\",\"text\":\"定制专门展柜，每年限时展出⁽²⁾。\"},{\"at\":\"2026 年 8 月\",\"text\":\"与《洛神赋图》首次同厅展出⁽²⁾。\"}]},\"refs\":[\"大英博物馆：《handscroll (mounted on panels); painting》，1903,0408,0.1。用于描述、年代、尺寸、各段箴文与题跋录文（「顾恺之画」款后加、乾隆「四美具」、金章宗瘦金体、项元汴题）、策展人说明（缺三段、故宫宋摹本、三次复制、与顾恺之关系弱）、改装、递藏链与入藏说明（约翰逊、第一孟加拉骑兵团、懋勤殿假说）。https://www.britishmuseum.org/collection/object/A_1903-0408-0-1\",\"黄松：《〈女史箴图〉与〈洛神赋图〉首次在大英博物馆并置同展》，澎湃新闻，2026 年 8 月 11 日。用于每年限展约六周、2013 年专家会诊与 2014 年专用展柜、日式折屏式装裱的批评、瘦金体出自金章宗的多数意见、约翰逊生平与部队驻颐和园、本想估价玉别子、进馆时状况，及回归讨论。https://www.thepaper.cn/newsDetail_forward_33731623\",\"李梅整理：《故宫六百年鉴赏⑦｜顾恺之笔下的女性风神》，澎湃新闻，2020 年 3 月 8 日。用于「多数专家认为是唐代摹本」、方闻论凹凸画、故宫宋摹本的比较、约翰逊「趁乱盗走」与家属「贵妇所赠」之说、慈禧时移往颐和园之说。https://www.thepaper.cn/newsDetail_forward_6350546\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"The Admonitions Scroll\",\"oneLiner\":\"\",\"period\":\"ca. 5th–7th century, after Gu Kaizhi\",\"size\":\"H. 24.4 cm, L. 343.8 cm\",\"craft\":\"Ink and colour on silk; handscroll remounted on panels in 1914–15; Song kesi wrapper\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"1903,0408,0.1\"],[\"Acquired\",\"1903\"],[\"入藏方式\",\"以 25 英镑购自约翰逊上尉\"]],\"intro\":[],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大英博物馆：《handscroll (mounted on
