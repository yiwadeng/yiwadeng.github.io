cript\",\"script-2\",{\"src\":\"/_next/static/chunks/3353dlie1bbke.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n2b:[\"$\",\"$L34\",null,{\"children\":[\"$\",\"$31\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@35\"}]}]\n36:\"/_next/static/chunks/1ewgts2b6fcn4.js\"\n37:\"/_next/static/chunks/2_sgoqbdt34vn.js\"\n38:\"/_next/static/chunks/3353dlie1bbke.js\"\n39:I[83882,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$36\",\"$37\",\"$38\"],\"default\"]\n28:[\"$\",\"$31\",null,{\"fallback\":null,\"children\":[\"$\",\"$L39\",null,{\"artifact\":{\"slug\":\"david-vases-british\",\"status\":\"planned\",\"title\":{\"zh\":\"大维德青花瓶\",\"en\":\"The David Vases\"},\"typeLabel\":{\"zh\":\"青花瓷\",\"en\":\"Blue-and-white porcelain\"},\"metadata\":{\"period\":{\"zh\":\"元至正十一年（1351）\",\"en\":\"Yuan dynasty, dated 1351\"},\"materialTechnique\":{\"zh\":\"景德镇青花瓷\",\"en\":\"Jingdezhen porcelain painted in underglaze cobalt blue\"},\"dimensions\":{\"zh\":\"高 63.6 厘米、63.8 厘米\",\"en\":\"H. 63.6 cm and 63.8 cm\"},\"collection\":{\"museum\":{\"zh\":\"大英博物馆\",\"en\":\"British Museum\"},\"city\":{\"zh\":\"伦敦\",\"en\":\"London\"},\"country\":{\"zh\":\"英国\",\"en\":\"United Kingdom\"},\"accessionNumber\":\"PDF,B.613、PDF,B.614\",\"url\":\"https://www.britishmuseum.org/collection/object/A_PDF-B-613\"}},\"description\":{\"zh\":\"这对瓶子的脖子上写着自己的来历：信州路玉山县的信徒张文进，舍了一只香炉、一对花瓶，供给星源祖殿的胡净一元帅，求全家平安、子女安康，时间是至正十一年四月⁽¹⁾。那是 1351 年，元朝的最后二十年。\\n\\n这是青花瓷上已知最早的纪年长铭⁽¹⁾。正是因为认出了它们，人们才知道青花瓷在元代就已经烧得这么好，元青花的研究由此开端，「至正型」这个说法也由此而来⁽¹,³⁾。\\n\\n两只瓶曾经分开过。1935 年，收藏家大维德在伦敦的拍卖会上买下了另一只，让它们重新成对⁽³⁾。香炉至今下落不明⁽¹⁾。\",\"en\":\"\"},\"story\":{\"zh\":\"\",\"en\":\"\"},\"layout\":\"model-center\",\"animation\":\"static\",\"models\":[],\"riverTitle\":\"$28:props:children:props:artifact:title\",\"importance\":\"$undefined\",\"watermark\":\"大維德瓶\",\"subtitle\":{\"zh\":\"一对写着生日的青花瓶。\",\"en\":\"\"},\"riverLead\":\"$28:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"江西景德镇烧造；原供于婺源灵顺庙（星源祖殿）\",\"en\":\"Made at Jingdezhen; dedicated at a temple in Wuyuan (Xingyuan), Jiangxi\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"大维德青花瓶\",\"oneLiner\":\"一对写着生日的青花瓶。\",\"period\":\"元至正十一年（1351）\",\"size\":\"高 63.6 厘米、63.8 厘米\",\"craft\":\"景德镇青花瓷\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"PDF,B.613、PDF,B.614\"],[\"入藏年份\",\"2024（2009 年起借展）\"],[\"入藏方式\",\"大维德基金会赠\"]],\"intro\":[\"这对瓶子的脖子上写着自己的来历：信州路玉山县的信徒张文进，舍了一只香炉、一对花瓶，供给星源祖殿的胡净一元帅，求全家平安、子女安康，时间是至正十一年四月⁽¹⁾。那是 1351 年，元朝的最后二十年。\",\"这是青花瓷上已知最早的纪年长铭⁽¹⁾。正是因为认出了它们，人们才知道青花瓷在元代就已经烧得这么好，元青花的研究由此开端，「至正型」这个说法也由此而来⁽¹,³⁾。\",\"两只瓶曾经分开过。1935 年，收藏家大维德在伦敦的拍卖会上买下了另一只，让它们重新成对⁽³⁾。香炉至今下落不明⁽¹⁾。\"],\"about\":{\"title\":\"一个信徒的心愿\",\"paras\":[{\"h\":\"星源祖殿\",\"sub\":\"$undefined\"},\"星源是江西婺源的别名。婺源城北有一座灵顺庙，供奉五显神，是五显信仰的发源地，宋元时被信众称作「祖殿」⁽³⁾。每年四月初八，四方信众涌到庙下，多到「无虑百万众」⁽³⁾。张文进选在四月献瓶，很可能就是赶这场斋会⁽³⁾。\",\"庙里有十五位从神，其中一位叫「胡靖一」，就是瓶上的「胡净一元帅」⁽³⁾。\",\"瓶子供进庙里的第二年，1352 年，灵顺庙就毁于元末的战火⁽³⁾。\",{\"h\":\"平民的青花\",\"sub\":\"$undefined\"},\"张文进家住玉山，离景德镇约 120 公里⁽¹⁾。他不是皇亲贵族，很可能是一位商人⁽³⁾。一个普通信徒能定制这样精美的青花，说明元青花在当时的中国并不只属于宫廷⁽³⁾。\",\"两只瓶的肩上各有一对象首耳，原本还挂着瓷环，后来都断了，只剩下脱落的痕迹⁽¹,³⁾。\",{\"h\":\"智化寺的传说\",\"sub\":\"$undefined\"},\"在中国，一直流传着一个说法：这对瓶原是北京智化寺的供器⁽³⁾。智化寺，就是本馆那座藻井原来所在的寺。1966 年，陶瓷专家孙瀛洲写道：「这一对瓶子原是北京东城智化寺的供器，可惜四十年前已经被不法奸商盗卖到国外了。」⁽³⁾\",\"后来又有人说，是旅英华侨吴赉熙在 1929 年把瓶子运去了英国⁽³⁾。但英国的档案显示，1927 年瓶子已经在英国；吴赉熙也不是古董商，而是一位爱国华侨，去世后把五百多件瓷器捐给了国家⁽³⁾。研究者认为，瓶子是否出自智化寺，今天已无法考证，但孙瀛洲的话也不宜随便否定⁽³⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它们离开婺源以后的几百年，没有任何记录。如果孙瀛洲说得对，它们在北京的智化寺里待过，大约在 1925、1926 年前后被卖出了国⁽³⁾。\",\"在英国，它们最早的主人是埃尔芬斯通（Mountstuart Elphinstone）⁽³⁾。1927 年，他把其中一只卖给了好友大维德爵士（Sir Percival David）；另一只转给了查尔斯·拉塞尔（Charles Russell）⁽²,³⁾。1935 年 6 月 6 日，拉塞尔那一只在苏富比拍卖，大维德以 360 英镑买下，两只瓶重新成对⁽¹,³⁾。\",\"大维德的收藏后来成立了基金会。2009 年起，整批藏品借展大英博物馆 95 号展厅；2024 年，基金会把它们永久赠给了大英⁽¹⁾。\"],\"items\":[{\"at\":\"1351 年四月\",\"text\":\"张文进将一对花瓶、一只香炉供进婺源灵顺庙⁽¹,³⁾。\"},{\"at\":\"1352 年\",\"text\":\"灵顺庙毁于战火⁽³⁾。\"},{\"at\":\"约 1925—1927 年\",\"text\":\"离开中国。一说原为北京智化寺供器⁽³⁾。\"},{\"at\":\"1927 年\",\"text\":\"埃尔芬斯通将其中一只卖给大维德⁽²,³⁾。\"},{\"at\":\"1929 年\",\"text\":\"霍布森首次在杂志上介绍这对瓶⁽³⁾。\"},{\"at\":\"1935 年 6 月 6 日\",\"text\":\"大维德在苏富比以 360 英镑买下另一只，两瓶合璧⁽¹,³⁾。\"},{\"at\":\"2009 年\",\"text\":\"大维德藏品借展大英 95 号展厅⁽¹⁾。\"},{\"at\":\"2024 年\",\"text\":\"永久赠予大英⁽¹⁾。\"}]},\"refs\":[\"大英博物馆：《altar-vase》，PDF,B.613。用于描述（象首耳、云龙、云凤、缠枝牡丹）、铭文录文与英译、95 号展厅中英展签（最早的青花纪年长铭、香炉下落不明、象耳原有瓷环）、Russell 旧藏与 1935 年购入、2024 年赠予。https://www.britishmuseum.org/collection/object/A_PDF-B-613\",\"大英博物馆：《altar-vase》，PDF,B.614。用于另一只的龙（朝左、张口）、向下飞的凤、尺寸重量、铭文「谨记」的差别、1927 年购自 Elphinstone。https://www.britishmuseum.org/collection/object/A_PDF-B-614\",\"黄清华、黄薇：《至正十一年铭青花云龙瓶考》，2010 年第 4 期，第 64—76 页（刊名待核）。用于两瓶在英国的流传、霍布森 1929 和 1931 年的发表、1935 年合璧、智化寺之说的来历（孙瀛洲 1966、何惠鉴与李雪曼 1968、耿宝昌 1995）与辨析、吴赉熙生平、星源祖殿即婺源灵顺庙、胡净一即胡靖一、1352 年庙毁，及「至正型」。https://iahs.fudan.edu.cn/__local/2/23/E8/DB9E1D7C5448A33BE34AA44A591_D453405E_26C8EF.pdf\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"The David Vases\",\"oneLiner\":\"\",\"period\":\"Yuan dynasty, dated 1351\",\"size\":\"H. 63.6 cm and 63.8 cm\",\"craft\":\"Jingdezhen porcelain painted in underglaze cobalt blue\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"PDF,B.613、PDF,B.614\"],[\"Acquired\",\"2024（2009 年起借展）\"],[\"入藏方式\",\"大维德基金会赠\"]],\"intro\":[],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大英博物馆：《altar-vase》，PDF,B.613。用于描述（象首耳、云龙、云凤、缠枝牡丹）、铭文录文与英译、95 号展厅中英展签（最早的青花纪年长铭、香炉下落不明、象耳原有瓷环）、Russell 旧藏与 1935 年购入、2024 年赠予。https://www.britishmuseum.org/collection/object/A_PDF-B-613\",\"大英博物馆：《altar-vase》，PDF,B.614。用于另一只的龙（朝左、张口）、向下飞的凤、尺寸重量、铭文「谨记」的差别、1927 年购自 Elphinstone。https://www.britishmuseum.org/collection/object/A_PDF-B-614\",\"黄清华、黄薇：《至正十一年铭青花云龙瓶考》，2010 年第 4 期，第 64—76 页（刊名待核）。用于两瓶在英国的流传、霍布森 1929 和 1931 年的发表、1935 年合璧、智化寺之说的来历（孙瀛洲 1966、何惠鉴与李雪曼 1968、耿宝昌 1995）与辨析、吴赉熙生平、星源祖殿即婺源灵顺庙、胡净一即胡靖一、1352 年庙毁，及「至正型」。https://iahs.fudan.edu.cn/__local/2/23/E8/DB9E1D7C5448A33BE34AA44A591_D453405E_26C8EF.pdf\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-dv-text\",\"title\":\"颈上的铭文\",\"text\":\"六十多个字，写着献瓶人、献给谁、为什么，和至正十一年四月这个日子⁽¹⁾。\"},{\"id\":\"rec-dv-ear\",\"title\":\"断了的环\",\"text\":\"象首耳里原本挂着瓷环，后来断了，只剩脱落的痕迹⁽¹,³⁾。\"},{\"id\":\"rec-dv-dragon\",\"title\":\"两条龙\",\"text\":\"一只瓶上的龙朝右、闭着嘴，另一只朝左、张着嘴⁽¹,²⁾。\"},{\"id\":\"rec-dv-phoenix\",\"title\":\"向下飞的凤\",\"text\":\"颈下的云凤里，有一只凤是头朝下飞的⁽²⁾。\"},{\"id\":\"rec-dv-word\",\"title\":\"一字之差\",\"text\":\"两只瓶的铭文末尾不一样：一只写「吉日舍」，一只写「谨记」⁽¹,²⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n2e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3a:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n32:[[\"$\",\"title\",\"0\",{\"children\":\"大维德青花瓶 · The David Vases | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"robots\",\"content\":\"noindex, follow\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/david-vases-british\"}],[\"$\",\"link\",\"3\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/david-vases-british\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/david-vases-british\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"大维德青花瓶 · The David Vases | Wandering Museum\"}],[
