,\"dealGroup\":\"object\",\"title\":{\"zh\":\"西周-青铜柉禁\",\"en\":\"The Duanfang Altar Set\"},\"typeLabel\":{\"zh\":\"青铜器\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"西周（约公元前1046–771年），公元前11世纪末\",\"en\":\"Western Zhou dynasty (ca. 1046–771 BCE), 11th century BCE\"},\"materialTechnique\":{\"zh\":\"青铜铸造（禁台一件，酒器十三件）\",\"en\":\"Bronze (14 pieces)\"},\"dimensions\":{\"zh\":\"共十四件；禁台高 18.1 × 宽 89.9 × 深 46.4 厘米\",\"en\":\"Fourteen pieces; table: H. 18.1 cm, W. 89.9 cm, D. 46.4 cm\"},\"collection\":{\"museum\":{\"zh\":\"大都会艺术博物馆\",\"en\":\"The Metropolitan Museum of Art\"},\"city\":{\"zh\":\"纽约\",\"en\":\"New York\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"24.72.1–.14\",\"url\":\"https://www.metmuseum.org/art/collection/search/42164\"}},\"description\":{\"zh\":\"这是一整套西周初年的祭祀酒器：一张青铜禁台，加上卣、尊、盉、斝、爵、角、觚、觶和一把斗，一共十四件。⁽¹⁾「禁」是放酒器的案台，古人解释它的名字，说是「因为酒戒」，用来提醒饮酒要有节制。⁽⁵⁾\\n\\n禁台面上，还留着两件卣和一件尊锈蚀出的轮廓印痕。三千年前它们在墓中摆放的位置，就这样被铜锈「拓」了下来。这十四件器物风格不一，铭文各异，出自不同的作坊，馆方推测，它们也许是一个家族宗庙里几代人积攒下来的祭器。⁽¹⁾\",\"en\":\"This altar and wine vessels reflect Shang–Zhou ritual. Differences in inscriptions and casting styles leave the original grouping open to study.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"bronze-set-met-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"rotate\",\"assets\":{\"modelHd\":\"bronze-set-met-hd.glb\",\"modelLantern\":\"bronze-set-met-lantern.glb\"},\"orchestration\":{\"importance\":\"standard\",\"category\":\"object\",\"tags\":[\"青铜器\",\"器物\",\"Met\"]},\"lanternConfig\":{\"caseType\":\"cube\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.065,\"paddingTop\":0.12,\"modelScale\":0.84,\"modelOffset\":[0.045,0,0.04],\"artifactLight\":{\"color\":\"#e2c47d\",\"intensity\":0.33999999999999997,\"position\":[-2.7755575615628914e-17,0.5099999999999999,0.3],\"rotation\":[-5,14,-15],\"distance\":2.55,\"decay\":2,\"angle\":1.347418836818384,\"penumbra\":0.1},\"caseLight\":{\"color\":\"#a78239\",\"intensity\":1.5,\"position\":[0.04500000000000001,0.6800000000000002,0.03],\"distance\":3.05,\"decay\":2,\"angle\":2.31536370769589,\"penumbra\":0.64},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"bestFaceYaw\":-35,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":-35,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":9,\"pitch\":4.5,\"distanceFactor\":0.78,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1,\"exposure\":1}},\"mediaType\":\"real3d\",\"particleLoader\":true,\"particlePalette\":[{\"color\":[146,129,92],\"weight\":0.55},{\"color\":[110,140,120],\"weight\":0.3},{\"color\":[175,185,168],\"weight\":0.15}],\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"國之重器\",\"subtitle\":{\"zh\":\"三千年的祭器，送走了一个王朝。\",\"en\":\"Fourteen bronzes preserve the order of ancestral rites.\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国陕西宝鸡斗鸡台（据传）\",\"en\":\"Reportedly Doujitai, Baoji, Shaanxi, China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"西周-青铜柉禁\",\"oneLiner\":\"三千年的祭器，送走了一个王朝。\",\"period\":\"西周（约公元前1046–771年），公元前11世纪末\",\"size\":\"共十四件；禁台高 18.1 × 宽 89.9 × 深 46.4 厘米\",\"craft\":\"青铜铸造（禁台一件，酒器十三件）\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"24.72.1–.14\"],[\"入藏年份\",\"1924\"]],\"intro\":[\"这是一整套西周初年的祭祀酒器：一张青铜禁台，加上卣、尊、盉、斝、爵、角、觚、觶和一把斗，一共十四件。⁽¹⁾「禁」是放酒器的案台，古人解释它的名字，说是「因为酒戒」，用来提醒饮酒要有节制。⁽⁵⁾\",\"禁台面上，还留着两件卣和一件尊锈蚀出的轮廓印痕。三千年前它们在墓中摆放的位置，就这样被铜锈「拓」了下来。这十四件器物风格不一，铭文各异，出自不同的作坊，馆方推测，它们也许是一个家族宗庙里几代人积攒下来的祭器。⁽¹⁾\"],\"about\":{\"title\":\"柉禁\",\"paras\":[{\"h\":\"「禁」是什么\",\"sub\":\"$undefined\"},\"「禁」是放酒器的案台。汉代的郑玄这样解释它的名字：「名之为禁者，因为酒戒也。」⁽⁵⁾周人认为商朝亡于纵酒，《尚书》里专有一篇《酒诰》，告诫诸侯百官不得沉湎于酒，只留了一个例外：大祭⁽⁷⁾。把酒器的座子叫作「禁」，是把这条教训摆在了每一次祭祀的面前。\",\"在它出土之前，「禁」只见于古书，没有人见过实物⁽⁶⁾。端方给它定名「柉禁」，为什么加一个「柉」字，他自己没说。容庚推测，是取自东汉《礼器碑》里「笾柉禁壶」一句⁽⁶⁾。\",{\"h\":\"铜锈留下的座位表\",\"sub\":\"$undefined\"},\"禁台面上有三个锈蚀出来的轮廓，正好对上两件卣和中间那件尊的底。三千年前它们在墓里怎么摆，铜锈替我们记了下来。其余十件的位置，是今人推测的⁽¹⁾。\",{\"h\":\"不是一次订做的一套\",\"sub\":\"$undefined\"},\"十四件里有十一件带铭文，可只有两组铭文相同。器物的风格、做工也各不一样，显然出自不同的作坊。大都会的推测是：这不是一次订做的成套酒器，而是一个家族的宗庙里，几代人攒下来的祭器⁽¹⁾。\",{\"h\":\"李济看这套酒器\",\"sub\":\"$undefined\"},\"1970 年，主持过安阳殷墟发掘的考古学家李济，应大都会之请重新研究这一套。他拿它和安阳侯家庄一座商墓里出土的整套酒器对比：两套都只有酒器，没有食器。他的看法是，这十四件有可能就是墓里原来的一组；它们铸于不同的时期，西周早期的墓里放进几件更老的器物，是常有的事⁽⁷⁾。\",\"他还比了两套的气质。安阳那套优雅、精巧，是给活人享用的；端方这套扉棱尖耸，器形雄强，看上去「几乎不像人间的东西」，不适合日常用，正适合大祭⁽⁷⁾。\",{\"h\":\"一件在纽约，一件在天津\",\"sub\":\"$undefined\"},\"国内文章说，存世的西周铜禁只有三件⁽⁶⁾。纽约这一件之外，宝鸡斗鸡台一带 1920 年代又被军阀党玉琨盗掘出一件夔纹禁，被砸成几十块，后来修复起来，现在在天津博物馆⁽⁴⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"1901 年，它在陕西宝鸡斗鸡台的一座墓中被发现，不久便归了清末大臣、金石收藏大家端方。⁽¹⁾\",\"国内的文章记得更细：那年秋天，戴家湾的村民王奎在村北的坡地取土，挖出了三十多件青铜器，这一套就在其中。端方得到后很得意，请同僚来赏玩，还摆好了拍了一张照片⁽⁶⁾。1908 年他印行自己的藏品图录《陶斋吉金录》，把它排在第一位⁽¹,⁶⁾。不过李济 1970 年写道，这组铜器实际的出土经过「没有记录」⁽⁷⁾。\",\"1911 年，四川爆发保路运动，端方奉命带兵入川。11 月 27 日，走到资州（今四川资中）时，他手下的新军哗变，把他杀了。两个多月后，清帝退位。⁽³⁾\",\"端方死后，家道中落。1924 年，他的后人经美国人福开森（John C. Ferguson）之手，把这套礼器卖给了大都会艺术博物馆。⁽¹,²⁾\",\"福开森后来在《匋斋旧藏古酒器考》里记下了这笔买卖：「归于我国纽约中央博物馆，此 1924 年春事也。」国内文章说，卖价约二十万两白银⁽⁶⁾。福开森说的是二十件：多出来的六件是铜勺，是古董商后来补送给端方的，如今也在大都会，但不算在这一套里⁽⁷⁾。\",\"宝鸡斗鸡台一带，后来又被军阀盗掘出一件铜禁，几经辗转，如今藏在天津博物馆。一件在纽约，一件在天津。⁽⁴⁾\",\"据大都会的展览记录，2014 年 11 月到 2015 年 3 月，这一套曾借展上海博物馆，和宝鸡石鼓山新出土的西周青铜器摆在一起⁽¹⁾。\"],\"items\":[{\"at\":\"西周初年（公元前 11 世纪末）\",\"text\":\"铸成，作为宗庙祭器使用，后随葬入墓。⁽¹⁾\"},{\"at\":\"1901 年\",\"text\":\"据传出土于陕西宝鸡斗鸡台，随后归端方收藏。⁽¹⁾\"},{\"at\":\"1908 年\",\"text\":\"端方印行《陶斋吉金录》，把它排在第一位，定名「柉禁」⁽¹,⁶⁾。\"},{\"at\":\"1911 年 11 月 27 日\",\"text\":\"端方在四川资州死于新军哗变。⁽³⁾\"},{\"at\":\"1924 年\",\"text\":\"端方后人经福开森售予大都会艺术博物馆。⁽¹,²⁾\"},{\"at\":\"1970 年\",\"text\":\"李济应大都会之请，对照安阳出土的商代酒器重新研究这一套⁽⁷⁾。\"},{\"at\":\"2014—2015 年\",\"text\":\"借展上海博物馆⁽¹⁾。\"},{\"at\":\"今天\",\"text\":\"陈列于大都会艺术博物馆 207 展厅。⁽¹⁾\"}]},\"refs\":[\"大都会艺术博物馆：《Ritual Altar Table (Jin)》，24.72.1–.14。馆方著录：西周、公元前 11 世纪末；十四件器名与编号；十一件有铭文，只有两组铭文相同；禁台面上留有两件卣和一件尊的锈蚀轮廓；器物出自不同作坊，或为一个家族宗庙积累的祭器；来源「据传 1901 年出土于陕西宝鸡斗鸡台」「端方（至 1911 年去世）—端方家族（至 1924 年，经福开森售予大都会）」；信用行 Munsey Fund, 1931；现展于 207 展厅。https://www.metmuseum.org/art/collection/search/42164\",\"大都会艺术博物馆：《Asian Art at The Metropolitan Museum of Art》，The Metropolitan Museum of Art Bulletin 73, no. 1（2015）。馆史记载 1901 年发现、端方收藏、1924 年经福开森购入。https://resources.metmuseum.org/resources/metpublications/pdf/Asian_Art_at_the_Metropolitan_Bulletin_v_73_no_1.pdf\",\"端方生平：1911 年保路运动中奉命入川，11 月 27 日在资州（今四川资中）因新军哗变被杀；1924 年其后人经福开森出售青铜收藏。Wikipedia「Duanfang」条目。https://en.wikipedia.org/wiki/Duanfang\",\"天津博物馆藏西周夔纹铜禁：1920 年代军阀党玉琨在宝鸡斗鸡台一带盗掘出土，辗转宋哲元家，1968 年由天津文物部门征集，碎块经修复后成器。（百科资料，待对照天津博物馆官方著录）https://www.maigoo.com/citiao/455687.html\",\"《仪礼》郑玄注：「禁，承尊之器也。名之为禁者，因为酒戒也。」\",\"YOYO：《西周青铜柉禁：独一无二的国之重器》，界面新闻转载，2019 年 6 月 25 日。用于 1901 年秋村民王奎取土发现、共出三十余件、端方摆拍、《陶斋吉金录》列首、「柉禁」之名与容庚的推测、福开森《匋斋旧藏古酒器考》引文与约二十万两白银之说、禁台重 32.2 公斤与两侧各八孔两端各四孔、三件较大酒器均铸「鼎」字，及西周铜禁存世仅三件。文章未逐条注出处。https://www.jiemian.com/article/3249189.html\",\"Li Chi（李济）：《The Tuan Fang Altar Set Reexamined》，Metropolitan Museum Journal 3（1970）: 51–72。用于出土经过没有记录、斗原在小卣之内、另有六把铜勺为古董商补送的「第二批」、与安阳侯家庄 HPKM1022 商墓酒器的对比、各器铸于不同时期、《尚书·酒诰》与「大祭」，及两套酒器气质的比较。https://www.metmuseum.org/met-publications/the-tuan-fang-altar-set-reexamined-the-metropolitan-museum-journal-v-3-1970\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"The Duanfang Altar Set\",\"oneLiner\":\"Fourteen bronzes preserve the order of ancestral rites.\",\"period\":\"Western Zhou dynasty (ca. 1046–771 BCE), 11th century BCE\",\"size\":\"Fourteen pieces; table: H. 18.1 cm, W. 89.9 cm, D. 46.4 cm\",\"craft\":\"Bronze (14 pieces)\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"24.72.1–.14\"],[\"Acquired\",\"1924\"]],\"intro\":[\"This altar and wine vessels reflect Shang–Zhou ritual. Differences in inscriptions and casting styles leave the original grouping open to study.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"Corrosion outlines on the table help reconstruct some vessel positions; the remaining arrangement is partly hypothetical.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"Reportedly found in 1901, it entered Duanfang’s collection. Museum histories record a 1924 purchase; the credit line lists 1931.\"],\"items\":[]},\"refs\":[\"大都会艺术博物馆：《Ritual Altar Table (Jin)》，24.72.1–.14。馆方著录：西周、公元前 11 世纪末；十四件器名与编号；十一件有铭文，只有两组铭文相同；禁台面上留有两件卣和一件尊的锈蚀轮廓；器物出自不同作坊，或为一个家族宗庙积累的祭器；来源「据传 1901 年出土于陕西宝鸡斗鸡台」「端方（至 1911 年去世）—端方家族（至 1924 年，经福开森售予大都会）」；信用行 Munsey Fund, 1931；现展于 207 展厅。https://www.metmuseum.org/art/collection/search/42164\",\"大都会艺术博物馆：《Asian Art at The Metropolitan Museum of Art》，The Metropolitan Museum of Art Bulletin 73, no. 1（2015）。馆史记载 1901 年发现、端方收藏、1924 年经福开森购入。https://resources.metmuseum.org/resources/metpublications/pdf/Asian_Art_at_the_Metropolitan_Bulletin_v_73_no_1.pdf\",\"端方生平：1911 年保路运动中奉命入川，11 月 27 日在资州（今四川资中）因新军哗变被杀；1924 年其后人经福开森出售青铜收藏。Wikipedia「Duanfang」条目。https://en.wikipedia.org/wiki/Duanfang\",\"天津博物馆藏西周夔纹铜禁：1920 年代军阀党玉琨在宝鸡斗鸡台一带盗掘出土，辗转宋哲元家，1968 年由天津文物部门征集，碎块经修复后成器。（百科资料，待对照天津博物馆官方著录）https://www.maigoo.com/citiao/455687.html\",\"《仪礼》郑玄注：「禁，承尊之器也。名之为禁者，因为酒戒也。」\",\"YOYO：《西周青铜柉禁：独一无二的国之重器》，界面新闻转载，2019 年 6 月 25 日。用于 1901 年秋村民王奎取土发现、共出三十余件、端方摆拍、《陶斋吉金录》列首、「柉禁」之名与容庚的推测、福开森《匋斋旧藏古酒器考》引文与约二十万两白银之说、禁台重 32.2 公斤与两侧各八孔两端各四孔、三件较大酒器均铸「鼎」字，及西周铜禁存世仅三件。文章未逐条注出处。https://www.jiemian.com/article/3249189.html\",\"Li Chi（李济）：《The Tuan Fang Altar Set Reexamined》，Metropolitan Museum Journal 3（1970）: 51–72。用于出土经过没有记录、斗原在小卣之内、另有六把铜勺为古董商补送的「第二批」、与安阳侯家庄 HPKM1022 商墓酒器的对比、各器铸于不同时期、《尚书·酒诰》与「大祭」，及两套酒器气质的比较。https://www.metmuseum.org/met-publications/the-tuan-fang-altar-set-reexamined-the-metropolitan-museum-journal-v-3-1970\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-bianjin-1\",\"title\":\"锈出来的轮廓\",\"text\":\"看禁台的台面。上面有三个圆圈一样的痕迹，是两件卣和一件尊在墓里压了三千年，锈蚀出来的印子⁽¹⁾。\"},{\"id\":\"rec-bianjin-2\",\"title\":\"禁台上的孔\",\"text\":\"禁台是个长方形的空台座，两侧各开八个长方形的孔，两端各开四个。它有 32.2 公斤重⁽⁶⁾。\"},{\"id\":\"rec-bianjin-3\",\"title\":\"台座上的龙\",\"text\":\"孔的四周，铸着瘦长的龙纹⁽⁶⁾。\"},{\"id\":\"rec-bianjin-4\",\"title\":\"最大的三件\",\"text\":\"中间高的是尊，两边带提梁的是卣，都是盛酒的。这三件的铭文相同⁽¹⁾，都铸着一个「鼎」字⁽⁶⁾，应当是同一位主人的。\"},{\"id\":\"rec-bianjin-5\",\"title\":\"十四件，各有来历\",\"text\":\"十一件有铭文，只有两组相同；做工和风格也不一样。它们多半不是一次订做的，而是一个家族几代人攒下来的⁽¹⁾。\"},{\"id\":\"rec-bianjin-6\",\"title\":\"斗\",\"text\":\"那把长柄的小勺叫斗，是从尊和卣里往外舀酒用的⁽¹⁾。入藏的时候，它就放在小的那件卣里⁽⁷⁾。\"},{\"id\":\"rec-bianjin-7\",\"title\":\"尖耸的扉棱\",\"text\":\"看器物身上一道道竖起的棱脊，叫扉棱。李济说，正是这些尖耸的扉棱和雄强的器形，让这套酒器显得威严，「几乎不像人间的东西」。它们不是给活人喝酒用的，是给大祭用的⁽⁷⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"西周-青铜柉禁 · The Duanfang Altar Set | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"This altar and wine vessels reflect Shang–Zhou ritual. Differences in inscriptions and casting styles leave the original grouping open to study.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/bronze-set-met\"}],[\"$\",\"link\",\"4\",{\"r
