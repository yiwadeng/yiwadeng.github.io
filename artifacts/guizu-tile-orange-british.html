m, L. 25 cm\"},\"collection\":{\"museum\":{\"zh\":\"大英博物馆\",\"en\":\"British Museum\"},\"city\":{\"zh\":\"伦敦\",\"en\":\"London\"},\"country\":{\"zh\":\"英国\",\"en\":\"United Kingdom\"},\"accessionNumber\":\"1946,0715.13\",\"url\":\"https://www.britishmuseum.org/collection/object/A_1946-0715-13\"}},\"description\":{\"zh\":\"一只鬼站在屋脊上，双手叉腰，歪着头往下看。长发乱披，眼睛凶狠，下巴往前突，露出獠牙⁽¹⁾。\\n\\n它的身子是琥珀一样的黄，裙子是绿的，肩上还搭着一条披巾⁽¹⁾。脚下踩着的，是一块凸起的筒瓦。四五百年前，它就站在某座建筑的正脊上⁽¹⁾。\\n\\n它有一个同伴，绿身子、头上长角，今天和它站在同一个展柜里⁽¹,²⁾。\",\"en\":\"\"},\"story\":{\"zh\":\"\",\"en\":\"\"},\"layout\":\"model-center\",\"animation\":\"static\",\"models\":[],\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"$undefined\",\"watermark\":\"琉璃鬼卒\",\"subtitle\":{\"zh\":\"叉着腰，站在屋脊上往下看。\",\"en\":\"\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"很可能是中国山西；同类见于洪洞广胜寺飞虹塔\",\"en\":\"Probably Shanxi province, China; similar tiles on the Feihong pagoda, Hongtong\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"琉璃鬼卒瓦（橙）\",\"oneLiner\":\"叉着腰，站在屋脊上往下看。\",\"period\":\"明代，约 1490—1620 年\",\"size\":\"高 37 厘米，长 25 厘米\",\"craft\":\"琉璃：陶胎，黄、绿铅釉，模制\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"1946,0715.13\"],[\"入藏年份\",\"1946\"],[\"入藏方式\",\"科尔瑟斯特遗赠\"]],\"intro\":[\"一只鬼站在屋脊上，双手叉腰，歪着头往下看。长发乱披，眼睛凶狠，下巴往前突，露出獠牙⁽¹⁾。\",\"它的身子是琥珀一样的黄，裙子是绿的，肩上还搭着一条披巾⁽¹⁾。脚下踩着的，是一块凸起的筒瓦。四五百年前，它就站在某座建筑的正脊上⁽¹⁾。\",\"它有一个同伴，绿身子、头上长角，今天和它站在同一个展柜里⁽¹,²⁾。\"],\"about\":{\"title\":\"屋脊上的鬼卒\",\"paras\":[{\"h\":\"站在屋脊上的鬼\",\"sub\":\"$undefined\"},\"它原来站在一座建筑的正脊上，脚下就是一块凸起的筒瓦⁽¹,²⁾。半人半兽，下巴像猿一样往前突，露着獠牙，浑身肌肉，只穿一条宽短裤⁽¹,²⁾。\",\"它和另一块一模一样大小的鬼卒瓦，大概出自同一座建筑⁽¹,²⁾。一只黄身绿裙，一只绿身黄裙，一只长发叉腰，一只长角握拳。\",{\"h\":\"飞虹塔\",\"sub\":\"$undefined\"},\"这种半人半兽的琉璃瓦，在山西洪洞广胜寺飞虹塔的上层也有⁽¹⁾。飞虹塔是一座八角十三层的琉璃塔，明正德十年（1515）开工，嘉靖六年（1527）建成，高四十多米，外壁和塔檐、斗拱都贴满了五彩琉璃⁽¹,³⁾。\",\"飞虹塔在广胜上寺。山脚下的广胜下寺，就是本馆两铺元代壁画《药师佛净土图》和《炽盛光佛佛会图》原来所在的地方。\",{\"h\":\"山西琉璃\",\"sub\":\"$undefined\"},\"琉璃是低温烧成的铅釉陶，铜发绿，铁发黄。明代山西的琉璃作坊遍布太原、阳城、河津、介休，匠人世代相传⁽⁴⁾。它们烧屋顶的瓦，也烧庙里的神像。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它是哪座建筑上的、什么时候被拆下来、怎么离开中国的，都没有记录。\",\"大英没有说它来自飞虹塔，只说飞虹塔上有同样的瓦⁽¹,²⁾。展柜旁边放着一张飞虹塔的照片。\",\"1946 年，英国收藏家科尔瑟斯特（F. E. Colthurst）去世，把这一对鬼卒瓦留给了大英⁽¹,²⁾。今天它们并排站在 33 号展厅的同一个展柜里⁽¹,²⁾。\"],\"items\":[{\"at\":\"约 1490—1620 年\",\"text\":\"烧成，很可能在山西⁽¹⁾。\"},{\"at\":\"1515—1527 年\",\"text\":\"洪洞广胜寺飞虹塔建成，上层也有同类的鬼卒瓦⁽¹,³⁾。\"},{\"at\":\"1946 年\",\"text\":\"科尔瑟斯特遗赠大英⁽¹⁾。\"}]},\"refs\":[\"大英博物馆：《ridge-tile》，1946,0715.13。用于描述（长发、叉腰、披巾）、年代、产地、尺寸、Harrison-Hall 2001 的说明（与 .14 出自同一座建筑、装在正脊上、飞虹塔上层有同类瓦、塔建于 1515 年）、来源与展位。https://www.britishmuseum.org/collection/object/A_1946-0715-13\",\"大英博物馆：《ridge-tile》，1946,0715.14。用于描述（双角缺一、握拳、短裤长带）、年代、尺寸、Harrison-Hall 2001 的说明、来源、展位与 1997 年修复。https://www.britishmuseum.org/collection/object/A_1946-0715-14\",\"中文维基百科：《飞虹塔》，引连达《得乎檐角梁柱间：寻访晋南乡村古建》（时代华文书局，2019），37—40 页。用于建造年代、达连募资、八角十三层与高度、琉璃装饰、1556 和 1695 年两次地震。https://zh.wikipedia.org/wiki/飞虹塔\",\"中国非物质文化遗产网：《琉璃烧制技艺》。用于山西太原、阳城、河津、介休的琉璃作坊与世家。https://www.ihchina.cn/project_details/14444.html\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Ridge tile with a striding demon\",\"oneLiner\":\"\",\"period\":\"Ming dynasty, ca. 1490–1620\",\"size\":\"H. 37 cm, L. 25 cm\",\"craft\":\"Earthenware with amber and green lead glazes, moulded\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"1946,0715.13\"],[\"Acquired\",\"1946\"],[\"入藏方式\",\"科尔瑟斯特遗赠\"]],\"intro\":[],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大英博物馆：《ridge-tile》，1946,0715.13。用于描述（长发、叉腰、披巾）、年代、
