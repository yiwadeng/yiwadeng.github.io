\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"particlePalette\":[{\"color\":[143,115,76],\"weight\":0.5},{\"color\":[188,151,100],\"weight\":0.25},{\"color\":[97,78,51],\"weight\":0.25}],\"riverTitle\":\"$28:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"臥虎石雕帳杆座\",\"subtitle\":{\"zh\":\"一只伏虎，托住日常器用的一角。\",\"en\":\"A crouching tiger supports an everyday structure.\"},\"riverLead\":\"$28:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国北方（出土地不详）\",\"en\":\"Northern China (findspot unknown)\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"卧虎石雕帐杆座\",\"oneLiner\":\"一只伏虎，托住日常器用的一角。\",\"period\":\"北魏（386—534），5 世纪\",\"size\":\"高 12.7 厘米，宽 23.8 厘米\",\"craft\":\"砾岩（石雕）\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"2025.829.4\"],[\"入藏年份\",\"2025\"]],\"intro\":[\"一只老虎伏在地上，背上开着一个孔，是用来插帐杆的。它不大，宽不到 24 厘米，高不到 13 厘米，是 5 世纪北魏的东西⁽¹⁾。\",\"石头是砾岩：大大小小的卵石被天然胶结在一起，磨平之后，石面上满是斑点⁽¹⁾。大都会说，这只小虎既是早期中国雕塑的样本，也看得出中原和草原游牧文化之间来往有多频繁⁽¹⁾。它在大都会的展柜里借展了近四十年，2025 年才正式成为馆藏⁽¹⁾。\"],\"about\":{\"title\":\"帐座\",\"paras\":[{\"h\":\"撑起一顶帐子\",\"sub\":\"$undefined\"},\"帐杆座是压在地上、插帐杆的石座，帐子的角下面各放一个。做成动物的样子，是把压帐子的石头，也做成了守帐子的兽。\",{\"h\":\"草原来的老虎\",\"sub\":\"$undefined\"},\"建立北魏的拓跋鲜卑，是从草原上南下的游牧民。用动物做器物的装饰，是草原上的老传统。大都会的展签点的就是这一层：一件小小的日用石座，可以看到中原和草原之间的来往⁽¹⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它是从哪里出土的，没有记录。大都会的来源栏从 1987 年写起：亚洲的一位私人藏家；1987 年 12 月在纽约佳士得拍卖，是第 312 号拍品，图录上叫「罕见的砾岩虎形座」；由古董商蓝理捷（J. J. Lally）替收藏家 Charlotte C. Weber 买下⁽¹⁾。\",\"买下的当年，Weber 就把它借给了大都会。1988 年大都会的中国古代艺术展厅开放，它就在展柜里；2022 年虎年，它又去了「虎年特展」。2025 年，Weber 把它捐给大都会，它才有了正式的馆藏号⁽¹⁾。\"],\"items\":[{\"at\":\"5 世纪\",\"text\":\"北魏时雕成⁽¹⁾。\"},{\"at\":\"1987 年 12 月\",\"text\":\"纽约佳士得拍卖，由蓝理捷为 Charlotte C. Weber 购得；同年起借展大都会⁽¹⁾。\"},{\"at\":\"1988 年\",\"text\":\"在大都会「中国古代艺术」展厅展出⁽¹⁾。\"},{\"at\":\"2022—2023 年\",\"text\":\"参加大都会虎年特展⁽¹⁾。\"},{\"at\":\"2025 年\",\"text\":\"Charlotte C. Weber 捐赠大都会，编号 2025.829.4⁽¹⁾。\"}]},\"refs\":[\"大都会艺术博物馆：《Pole base in the form of a tiger》（北魏 臥虎石雕帳杆座），2025.829.4。用于年代、尺寸、材质（puddingstone，砾岩）、展签（早期中国雕塑与草原游牧文化的交流）、来源栏（亚洲私人收藏；纽约佳士得 1987 年 12 月 10 日拍卖第 312 号；经蓝理捷为 Charlotte C. Weber 购得；1987—2025 年借展大都会；捐赠）及展览史。https://www.metmuseum.org/art/collection/search/54028\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Pole Base in the Form of a Tiger\",\"oneLiner\":\"A crouching tiger supports an everyday structure.\",\"period\":\"Northern Wei dynasty (386–534), 5th century\",\"size\":\"H. 12.7 cm, W. 23.8 cm\",\"craft\":\"Puddingstone\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"2025.829.4\"],[\"Acquired\",\"2025\"]],\"intro\":[\"The project archive identifies this stone carving as a Northern Wei tiger-shaped tent-pole base, combining animal form with a practical support.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"A compact body and gathered limbs create a sense of contained strength in a small stone object.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"For years it was shown at the Met on loan from Charlotte C. Weber (L.1996.79.15). In 2025 she gave it to the museum, and it now carries the accession number 2025.829.4.\"],\"items\":[]},\"refs\":[\"大都会艺术博物馆：《Pole base in the form of a tiger》（北魏 臥虎石雕帳杆座），2025.829.4。用于年代、尺寸、材质（puddingstone，砾岩）、展签（早期中国雕塑与草原游牧文化的交流）、来源栏（亚洲私人收藏；纽约佳士得 1987 年 12 月 10 日拍卖第 312 号；经蓝理捷为 Charlotte C. Weber 购得；1987—2025 年借展大都会；捐赠）及展览史。https://www.metmuseum.org/art/collection/search/54028\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-pole-1\",\"title\":\"伏着的虎\",\"text\":\"四条腿收在身下，身子贴着地。它不扑也不跳，只是稳稳地趴着，压住一顶帐子的一角。\"},{\"id\":\"rec-pole-2\",\"title\":\"插杆的孔\",\"text\":\"背上的孔是插帐杆的⁽¹⁾。它是一件用具，不是摆件。\"},{\"id\":\"rec-pole-3\",\"title\":\"石头里的石头\",\"text\":\"凑近看石面上的斑点。这种石头叫砾岩，是许多小卵石被天然胶结成的一整块⁽¹⁾。\"},{\"id\":\"rec-pole-4\",\"title\":\"草原的味道\",\"text\":\"把动物做在日用的器物上，是草原游牧民的老习惯。大都会说，从这只小虎身上，能看到中原和草原之间的来往⁽¹⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n2d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n39:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n31:[[\"$\",\"title\",\"0\",{\"children\":\"卧虎石雕帐杆座 · Pole Base in the Form of a Tiger | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The project archive identifies this stone carving as a Northern Wei tiger-shaped tent-pole base, combining animal form with a practical support.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/polebase-met\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/polebase-met\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/polebase-met\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"卧虎石雕帐杆座 · Pole Base in the Form of a Tiger | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"The project archive identifies this stone carving as a Northern Wei tiger-shaped tent-pole base, combining animal form with a practical support.\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:url\",
