"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\",\"$39\",\"$3a\",\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"xiaowen-emperor\",\"status\":\"modeled\",\"isFeatured\":true,\"dealGroup\":\"relief\",\"title\":{\"zh\":\"孝文帝礼佛图\",\"en\":\"Emperor Xiaowen and His Entourage Worshipping the Buddha\"},\"typeLabel\":{\"zh\":\"石刻浮雕\",\"en\":\"Limestone relief\"},\"voiceLine\":\"宾阳中洞里，帝与后曾相对而立。如今一在大都会，一在纳尔逊。\",\"metadata\":{\"period\":{\"zh\":\"北魏（386–534），约522–523年\",\"en\":\"Northern Wei dynasty, ca. 522–523\"},\"materialTechnique\":{\"zh\":\"石灰岩浮雕（残留彩绘）\",\"en\":\"Limestone with traces of pigment\"},\"dimensions\":{\"zh\":\"高 208.3 厘米，宽 393.7 厘米\",\"en\":\"H. 208.3 cm, W. 393.7 cm\"},\"collection\":{\"museum\":{\"zh\":\"大都会艺术博物馆\",\"en\":\"The Metropolitan Museum of Art\"},\"city\":{\"zh\":\"纽约\",\"en\":\"New York\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"35.146\",\"url\":\"https://www.metmuseum.org/art/collection/search/42707\"}},\"description\":{\"zh\":\"帝后礼佛图是两幅浮雕的合称，二者原本位于宾阳中洞洞门两侧，帝后隔门相对，相向而行。20世纪30年代，两块浮雕分别被古董商凿碎，卖到了美国两个博物馆。皇帝礼佛图的碎片并未全部运出国外，所以目前在博物馆看到的浮雕，是经过部分碎片重组和修复的作品。\\n\\n孝文帝头戴冕旒，身穿衮服，贵族随从们手持华盖、雉尾扇等仪仗随行。行列式构图，人物密集，错落有致。孝文帝拓跋宏，一生推行鲜卑汉化改革，浮雕中的汉制衣冠，铭刻了\\\"华夏\\\"的定义——不是单一的民族与血脉，而是延续千年的文化认同与民族融合。\\n\\n孝文帝礼佛图藏于大都会博物馆，文昭皇后礼佛图藏于堪萨斯城的纳尔逊阿特金斯博物馆，中间相隔约 1800 公里。\",\"en\":\"At the center the emperor walks beneath a canopy in the tasseled crown of state, a monk leading the way. This is Emperor Xiaowen’s offering procession, once carved just inside the door of the Central Binyang Cave at Longmen, facing his empress across the doorway.\\nIn the 1930s it was chiseled off the wall piece by piece and shipped to New York. The empress, in Kansas City, was filled out with plaster into a whole picture. The emperor was not, and many of his figures remain broken.⁽⁷⁾\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"emperor-met-hd.glb\"}],\"seriesSlugs\":[\"binyang-cave-reliefs\"],\"layout\":\"model-center\",\"animation\":\"static\",\"screens\":[],\"assets\":{\"modelHd\":\"emperor-met-hd.glb\",\"modelLantern\":\"emperor-met-lantern.glb\"},\"orchestration\":{\"importance\":\"featured\",\"category\":\"mural\",\"tags\":[\"帝后礼佛\",\"宾阳中洞\",\"浮雕\",\"北魏\",\"Met\"]},\"lanternConfig\":{\"caseType\":\"cube\",\"mount\":\"pedestal\",\"caseFootprint\":0.85,\"paddingSide\":0.08,\"paddingTop\":0.1,\"modelScale\":1,\"modelOffset\":[0,0.12,0],\"artifactLight\":{\"color\":\"#cbbb97\",\"intensity\":1.5,\"position\":[0.19,0.95,1.1],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":2.115363707695889,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.05,0.445,0.17],\"distance\":5,\"decay\":2,\"angle\":2.140830782496456,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#c88628\",\"intensity\":0.2},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":30},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":45,\"fullRotation\":false,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":false,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1.22,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":0.85,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":{\"zh\":\"北魏-孝文帝礼佛图\",\"en\":\"Emperor Xiaowen and His Entourage Worshipping the Buddha\"},\"importance\":\"featured\",\"watermark\":\"帝后禮佛\",\"subtitle\":{\"zh\":\"北魏皇家石窟的艺术水平代表作\",\"en\":\"The procession continues; its companion is far away.\"},\"riverLead\":{\"zh\":\"曾朝夕相对的皇后浮雕，如今是否安好？\",\"en\":\"The procession continues; its companion is far away.\"},\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国河南洛阳，龙门石窟宾阳中洞\",\"en\":\"Central Binyang Cave, Longmen, Luoyang, Henan, China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"孝文帝礼佛图\",\"oneLiner\":\"北魏皇家石窟的艺术水平代表作\",\"period\":\"北魏（386–534），约522–523年\",\"size\":\"高 208.3 厘米，宽 393.7 厘米\",\"craft\":\"石灰岩浮雕（残留彩绘）\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"35.146\"]],\"intro\":[\"帝后礼佛图是两幅浮雕的合称，二者原本位于宾阳中洞洞门两侧，帝后隔门相对，相向而行。20世纪30年代，两块浮雕分别被古董商凿碎，卖到了美国两个博物馆。皇帝礼佛图的碎片并未全部运出国外，所以目前在博物馆看到的浮雕，是经过部分碎片重组和修复的作品。\",\"孝文帝头戴冕旒，身穿衮服，贵族随从们手持华盖、雉尾扇等仪仗随行。行列式构图，人物密集，错落有致。孝文帝拓跋宏，一生推行鲜卑汉化改革，浮雕中的汉制衣冠，铭刻了\\\"华夏\\\"的定义——不是单一的民族与血脉，而是延续千年的文化认同与民族融合。\",\"孝文帝礼佛图藏于大都会博物馆，文昭皇后礼佛图藏于堪萨斯城的纳尔逊阿特金斯博物馆，中间相隔约 1800 公里。\"],\"about\":{\"title\":\"出口的那面墙\",\"paras\":[\"「景明初，世宗诏大长秋卿白整准代京灵岩寺石窟，于洛南伊阙山，为高祖、文昭皇太后营石窟二所。」⁽¹⁾公元 500 年前后，北魏宣武帝下诏，照着平城云冈的样子，在洛阳南边的龙门为父亲孝文帝、母亲文昭皇太后开窟。到 523 年，前后「用功八十万二千三百六十六」⁽¹⁾。宾阳中洞，就是这项工程里真正完成的那一座。\",\"洞里，大佛坐在正壁，面朝洞口。洞口这面墙——人们礼完佛、转身离开时才会看见——从下到上刻了四层：最下是神王，往上是帝后礼佛，再往上是佛陀前世的本生故事，最高处是文殊菩萨与维摩诘居士的对谈⁽³⁾。门北是皇帝，门南是皇后，一左一右，像在送出洞的人回到人间。\",\"这面墙也是一张秩序图：神王在下，佛的往世在上，人在中间。最高处的维摩诘是一位在家居士，却在辩论里让众菩萨无言以对——口才与思辨，正是北魏贵族最看重的「清谈」风度⁽²⁾。帝后刻在人间那一层，身份是供养人。\",\"刻工知道光从哪里来。洞里唯一的光源是洞口，光线斜斜掠过浮雕，人物的脸和衣褶，就是顺着这道侧光雕出来的⁽⁴⁾。\",\"1916 年，两幅帝后还在洞壁上，它们的拓片已经并排挂进了克利夫兰美术馆的开馆展，加起来七米多长⁽¹⁰⁾。二十年后，石头本身也到了美国，却分成了两半。今天，洞口这面墙只剩凿痕，四层浮雕一共失去了七十六个人物⁽⁶⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"1934 年 10 月，大都会远东部的普爱伦（Alan Priest）与北京琉璃厂彬记古玩铺的老板岳彬签下合同，指名要这一幅，价钱一万四千银元，五年为期⁽⁷,⁸,¹⁴⁾。\",\"浮雕是怎么下墙的，说法不一。据国内流传的说法，洛阳的古董商打通了地方关节，龙门附近的石匠被枪逼着上山，照着照片把浮雕一块块凿下⁽⁸⁾；普艾伦 1944 年的书里则说，是河对岸的村民夜里蹚水过来凿的⁽¹⁴⁾。碎块分批运到北京，在彬记拼合，1935 年运往纽约⁽⁸⁾。大都会的入藏记录只有一行：「Fletcher Fund, 1935」⁽⁵⁾。\",\"门另一边的皇后，同一时期被纳尔逊的西克曼从北京的古董铺里一片片买走。西克曼后来发现，他从岳彬那里买到的一段衣纹是假的，真的那块还在洞壁上；岳彬卖给普爱伦的石头，后来也有人起疑⁽³⁾。\",\"1953 年，岳彬案发⁽¹⁴⁾。人们在他家里搜出了与普爱伦的合同，还有两千多块石刻碎片⁽⁷⁾。他被判处死刑，死在狱中⁽⁸⁾。龙门石窟研究院至今保存着一批来历各异的碎块，有些据说来自宾阳中洞，等着被认出来⁽⁹⁾。\",\"今天，它在大都会 206 号展厅⁽⁵⁾。2019 年，西安交大的雕塑家贾濯非在那里见到它：「很多人物只剩下头部，空缺的部分没做修复，整个浮雕的气韵都是断开的。」⁽⁷⁾\"],\"items\":[{\"at\":\"约 522—523 年\",\"text\":\"刻于龙门宾阳中洞洞口内侧，门北⁽⁵⁾。\"},{\"at\":\"1916 年\",\"text\":\"帝后两幅的拓片并排挂进克利夫兰美术馆开馆展⁽¹⁰⁾。\"},{\"at\":\"1932 年 4 月\",\"text\":\"西克曼到龙门，两幅浮雕仍完好，他买下拓片⁽³⁾。\"},{\"at\":\"1932 年底\",\"text\":\"龙门碎块开始出现在北京古董市场⁽³⁾。\"},{\"at\":\"1934 年 10 月\",\"text\":\"普爱伦与岳彬签约，指名收购这一幅⁽⁷,⁸,¹⁴⁾。\"},{\"at\":\"1935 年\",\"text\":\"在北京拼合后运抵纽约，大都会以 Fletcher Fund 购藏⁽⁵,⁸⁾。\"},{\"at\":\"1953 年\",\"text\":\"岳彬案发，家中搜出合同；后被判处死刑，死于狱中⁽⁷,⁸,¹⁴⁾。\"},{\"at\":\"2019 年\",\"text\":\"贾濯非在大都会看到它的残缺，后参与帝后礼佛图的数字复原⁽⁷⁾。\"}]},\"refs\":[\"魏收：《魏书·释老志》。用于宣武帝为孝文帝、文昭皇太后在伊阙山营窟，及「用功八十万二千三百六十六」。\",\"Amy McNair, The Donors of Longmen: Faith, Politics, and Patronage in Medieval Chinese Buddhist Sculpture (Honolulu: University of Hawai‘i Press, 2007), ch. 2。用于帝后身份的认定，及维摩诘辩论与北魏贵族清谈风气。\",\"Fletcher Coleman, “Fragments and Traces: Reconstituting Offering Procession of the Empress as Donor with Her Court,” Orientations 49, no. 3 (2018): 94–101。用于东壁四层布局；西克曼 1932—1934 年三次到龙门所见、袁同礼、布哈德与福格出资、张姓古董铺第一次拼合（洗墨与颜料、喷灯、琥珀粉）、岳彬假衣纹、暗语「裁缝」、1939 年最后一批运出、堪萨斯城拆开重修、华纳 1940 年来信、西克曼晚年的评价；及岳彬卖给普爱伦的石头亦受质疑。\",\"纳尔逊-阿特金斯艺术博物馆：《Offering Procession of the Empress as Donor with Her Court》，40-38。用于年代、尺寸、材质、1940 年经西克曼与布哈德购入、与雕塑家罗森鲍尔用石膏补全，及展签所说洞口斜光塑造人物、戴冠者可能为皇后与另一位后妃。https://art.nelson-atkins.org/objects/8976/offering-procession-of-the-empress-as-donor-with-her-court\",\"大都会艺术博物馆：《Emperor Xiaowen and his entourage worshipping the Buddha》，35.146。用于年代、尺寸、材质、「Fletcher Fund, 1935」及 206 号展厅。https://www.metmuseum.org/art/collection/search/42707\",\"刘旻、陈杰：《〈文昭皇后礼佛图〉“复活记”》，新京报，2023 年 2 月 24 日。用于洞口四层浮雕共失去 76 个人物、纳尔逊前馆长「不到一半是原始的」、依拓片照片拼合有错位，及 2023 年 1 月等大石膏墙模型进洞试位。https://m.bjnews.com.cn/detail/1677232143169646.html\",\"《历尽劫难 此生得见：国宝级浮雕〈帝后礼佛图〉“重生”记》，中国新闻网，2021 年 4 月 28 日。用于 1934 年大都会与北京古董商签约、岳彬家中搜出合同及碎片、贾濯非 2019 年在大都会所见与「气韵都是断开的」、纳尔逊一幅缺约三分之一，及数字复原合作方。https://www.chinanews.com/cul/2021/04-28/9466364.shtml\",\"《北魏孝文帝礼佛图：远去的龙门盗影》，界面新闻（转载），2020 年。用于彬记岳彬、一万四千银元五年为期、石匠被枪逼凿取、照照片切割、北京拼合后 1935 年运美、岳彬判处死刑死于狱中。https://www.jiemian.com/article/2869669.html\",\"Fletcher Coleman, “Restoring the Past and Present: The Case of the Figure of Wei Mo Chi,” Ars Orientalis 50 (2020)。用于龙门石窟数字回归项目，及龙门所藏碎块中有的据说来自宾阳中洞。https://quod.lib.umich.edu/a/ars/13441566.0050.003\",\"Fletcher Coleman, “Early American Exhibitions of Rubbings of Sculpture from the Longmen Grottoes,” in Exhibiting East Asian Art in a Global Context (2025), ch. 9。用于 1916 年克利夫兰美术馆开馆展并排悬挂帝后拓片，及艾克 1936 年论拓片（Gustav Ecke, “On a Wei Relief Represented in a Rubbing,” Monumenta Serica 2.1, 1936）。\",\"魏收：《魏书·皇后列传》（卷十三）；《魏书·肃宗纪》（卷九）。用于文明太后临朝听政，文昭皇后死后加昭仪号、谥文昭贵人，肃宗时更上尊号太皇太后，及神龟二年（519）改葬。\",\"Center for the Art of East Asia, University of Chicago, “Empress Procession,” Longmen Binyang Central Cave digital project. 用于皇后身后较小的人物或为太皇太后冯氏的推测。https://caea.lib.uchicago.edu/dcadp/en/longmenbcc/empress\",\"张旭华、陈开颖：《宾阳中洞帝后礼佛图供养人身份考释》。用于女性供养人为文昭皇太后高照容、幽皇后冯氏与太子妃形象的高英的说法。https://xueshu.baidu.com/usercenter/paper/show?paperid=b3f6e9b29f126c7f687f5538acba8f72\",\"刘连香：《美国大都会艺术博物馆藏龙门北魏〈皇帝礼佛图〉考辨》，《故宫博物院院刊》2013 年第 1 期，页 120—131。用于 1934 年 10 月 21 日合同与十九头、普艾伦 1944 年自述、1953 年彬记案发、皇帝冕冠的破坏、羽葆衣袍的修补与菩提树下多出的衣褶、修复无文字记载。https://www.dpm.org.cn/Uploads/File/2018/06/05/u5b164d4fe594a.pdf\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Emperor Xiaowen and His Entourage Worshipping the Buddha\",\"oneLiner\":\"The procession continues; its companion is far away.\",\"period\":\"Northern Wei dynasty, ca. 522–523\",\"size\":\"H. 208.3 cm, W. 393.7 cm\",\"craft\":\"Limestone with traces of pigment\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"35.146\"]],\"intro\":[\"At the center the emperor walks beneath a canopy in the tasseled crown of state, a monk leading the way. This is Emperor Xiaowen’s offering procession, once carved just inside the door of the Central Binyang Cave at Longmen, facing his empress across the doorway.\",\"In the 1930s it was chiseled off the wall piece by piece and shipped to New York. The empress, in Kansas City, was filled out with plaster into a whole picture. The emperor was not, and many of his figures remain broken.⁽⁷⁾\"],\"about\":{\"title\":\"The Wall You See on Leaving\",\"paras\":[\"Around 500, Emperor Xuanwu ordered cave temples cut into the cliffs south of Luoyang in memory of his parents, Emperor Xiaowen and Empress Wenzhao. The official history counts the labor at 802,366 workdays, spent until 523.⁽¹⁾ The Central Binyang Cave is the one that was finished.\",\"Inside, the great Buddha faces the door. The wall around the door—the one you only see when you turn to leave—was carved in four bands: guardian spirit kings at the bottom, the imperial processions above them, tales of the Buddha’s past lives, and at the top the debate between Manjushri and the layman Vimalakirti.⁽³⁾ The emperor stood north of the door, the empress south, as if seeing worshippers back out into the world.\",\"The carvers knew where the light came from. The only light in the cave enters through the door and rakes across the reliefs; faces and drapery were cut to catch it.⁽⁴⁾\",\"In 1916, while both processions were still on the wall, their rubbings already hung side by side—over twenty-five feet of paper—at the opening of the Cleveland Museum of Art.⁽¹⁰⁾ Two decades later the stone itself crossed the Pacific, in two halves. Today the four bands around the door have lost seventy-six figures.⁽⁶⁾\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"\",\"paras\":[\"In 1934 Alan Priest, curator of Far Eastern Art at the Met, signed a contract with Yue Bin, owner of an antique shop on Liulichang in Beijing, naming this relief. The price, as reported in China, was 14,000 silver dollars over five years.⁽⁷,⁸⁾\",\"According to accounts told in China, local stonecutters were forced at gunpoint to cut the relief down, working from photographs; the fragments were pieced together in Beijing and shipped in 1935.⁽⁸⁾ The Met’s record reads simply: Fletcher Fund, 1935.⁽⁵⁾\",\"Laurence Sickman, buying the empress at the same time, found that drapery he had bought from Yue Bin was fake—the real piece was still on the wall. Questions have been raised about the stones Yue sold Priest as well.⁽³⁾\",\"After 1949 Yue Bin was prosecuted; the contract was found in his house. He was sentenced to death and died in prison.⁽⁷,⁸⁾\"],\"items\":[{\"at\":\"ca. 522–523\",\"text\":\"Carved inside the door of the Central Binyang Cave, north side.⁽⁵⁾\"},{\"at\":\"1916\",\"text\":\"Rubbings of both processions hang side by side at the Cleveland Museum of Art.⁽¹⁰⁾\"},{\"at\":\"1934\",\"text\":\"Priest signs a contract with the dealer Yue Bin for this relief.⁽⁷,⁸⁾\"},{\"at\":\"1935\",\"text\":\"Reassembled in Beijing, shipped to New York, acquired through the Fletcher Fund.⁽⁵,⁸⁾\"},{\"at\":\"after 1949\",\"text\":\"Yue Bin is prosecuted and dies in prison.⁽⁷,⁸⁾\"}]},\"refs\":[\"魏收：《魏书·释老志》。用于宣武帝为孝文帝、文昭皇太后在伊阙山营窟，及「用功八十万二千三百六十六」。\",\"Amy McNair, The Donors of Longmen: Faith, Politics, and Patronage in Medieval Chinese Buddhist Sculpture (Honolulu: University of Hawai‘i Press, 2007), ch. 2。用于帝后身份的认定，及维摩诘辩论与北魏贵族清谈风气。\",\"Fletcher Coleman, “Fragments and Traces: Reconstituting Offering Procession of the Empress as Donor with Her Court,” Orientations 49, no. 3 (2018): 94–101。用于东壁四层布局；西克曼 1932—1934 年三次到龙门所见、袁同礼、布哈德与福格出资、张姓古董铺第一次拼合（洗墨与颜料、喷灯、琥珀粉）、岳彬假衣纹、暗语「裁缝」、1939 年最后一批运出、堪萨斯城拆开重修、华纳 1940 年来信、西克曼晚年的评价；及岳彬卖给普爱伦的石头亦受质疑。\",\"纳尔逊-阿特金斯艺术博物馆：《Offering Procession of the Empress as Donor with Her Court》，40-38。用于年代、尺寸、材质、1940 年经西克曼与布哈德购入、与雕塑家罗森鲍尔用石膏补全，及展签所说洞口斜光塑造人物、戴冠者可能为皇后与另一位后妃。https://art.nelson-atkins.org/objects/8976/offering-procession-of-the-empress-as-donor-with-her-court\",\"大都会艺术博物馆：《Emperor Xiaowen and his entourage worshipping the Buddha》，35.146。用于年代、尺寸、材质、「Fletcher Fund, 1935」及 206 号展厅。https://www.metmuseum.org/art/collection/search/42707\",\"刘旻、陈杰：《〈文昭皇后礼佛图〉“复活记”》，新京报，2023 年 2 月 24 日。用于洞口四层浮雕共失去 76 个人物、纳尔逊前馆长「不到一半是原始的」、依拓片照片拼合有错位，及 2023 年 1 月等大石膏墙模型进洞试位。https://m.bjnews.com.cn/detail/1677232143169646.html\",\"《历尽劫难 此生得见：国宝级浮雕〈帝后礼佛图〉“重生”记》，中国新闻网，2021 年 4 月 28 日。用于 1934 年大都会与北京古董商签约、岳彬家中搜出合同及碎片、贾濯非 2019 年在大都会所见与「气韵都是断开的」、纳尔逊一幅缺约三分之一，及数字复原合作方。https://www.chinanews.com/cul/2021/04-28/9466364.shtml\",\"《北魏孝文帝礼佛图：远去的龙门盗影》，界面新闻（转载），2020 年。用于彬记岳彬、一万四千银元五年为期、石匠被枪逼凿取、照照片切割、北京拼合后 1935 年运美、岳彬判处死刑死于狱中。https://www.jiemian.com/article/2869669.html\",\"Fletcher Coleman, “Restoring the Past and Present: The Case of the Figure of Wei Mo Chi,” Ars Orientalis 50 (2020)。用于龙门石窟数字回归项目，及龙门所藏碎块中有的据说来自宾阳中洞。https://quod.lib.umich.edu/a/ars/13441566.0050.003\",\"Fletcher Coleman, “Early American Exhibitions of Rubbings of Sculpture from the Longmen Grottoes,” in Exhibiting East Asian Art in a Global Context (2025), ch. 9。用于 1916 年克利夫兰美术馆开馆展并排悬挂帝后拓片，及艾克 1936 年论拓片（Gustav Ecke, “On a Wei Relief Represented in a Rubbing,” Monumenta Serica 2.1, 1936）。\",\"魏收：《魏书·皇后列传》（卷十三）；《魏书·肃宗纪》（卷九）。用于文明太后临朝听政，文昭皇后死后加昭仪号、谥文昭贵人，肃宗时更上尊号太皇太后，及神龟二年（519）改葬。\",\"Center for the Art of East Asia, University of Chicago, “Empress Procession,” Longmen Binyang Central Cave digital project. 用于皇后身后较小的人物或为太皇太后冯氏的推测。https://caea.lib.uchicago.edu/dcadp/en/longmenbcc/empress\",\"张旭华、陈开颖：《宾阳中洞帝后礼佛图供养人身份考释》。用于女性供养人为文昭皇太后高照容、幽皇后冯氏与太子妃形象的高英的说法。https://xueshu.baidu.com/usercenter/paper/show?paperid=b3f6e9b29f126c7f687f5538acba8f72\",\"刘连香：《美国大都会艺术博物馆藏龙门北魏〈皇帝礼佛图〉考辨》，《故宫博物院院刊》2013 年第 1 期，页 120—131。用于 1934 年 10 月 21 日合同与十九头、普艾伦 1944 年自述、1953 年彬记案发、皇帝冕冠的破坏、羽葆衣袍的修补与菩提树下多出的衣褶、修复无文字记载。https://www.dpm.org.cn/Uploads/File/2018/06/05/u5b164d4fe594a.pdf\"]}},\"unplacedLookPoints\":[{\"id\":\"pt-dihou-e1\",\"title\":\"冕旒\",\"text\":\"皇帝头戴冕冠，冠前后垂着一串串玉珠，叫「旒」，这是帝王礼服里最隆重的一种。盗凿时，石匠也许并不知道谁是皇帝：冠顶没了，旒只剩残块，今天看起来倒像一顶普通的进贤冠⁽¹⁴⁾。\"},{\"id\":\"pt-dihou-e2\",\"title\":\"仪仗开路\",\"text\":\"走在队伍最前面的，是仗剑的侍从和高举的羽葆，皇帝跟在后面⁽¹⁴⁾。这是帝王出行的排场。可在这面墙上，再尊贵的人，也是供养人。\"},{\"id\":\"pt-dihou-e3\",\"title\":\"残缺\",\"text\":\"盗凿时破坏太重，许多人物的头和身子分了家，至今这样留着⁽¹⁴⁾。大都会没有像纳尔逊那样用石膏补满背景，但修补并不少：两个羽葆和几处衣袍是补的，菩提树下还多出一段没有人穿的衣褶⁽¹⁴⁾。这些修补没有留下文字记录⁽¹⁴⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"孝文帝礼佛图 · Emperor Xiaowen and His Entourage Worshipping the Buddha | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"At the center the emperor walks beneath a canopy in the tasseled crown of state, a monk leading the way. This is Emperor Xiaowen’s offering procession, once carved just inside the \"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/xiaowen-emperor\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/xiaowen-emperor\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/xiaowen-emperor\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"孝文帝礼佛图 · Emperor Xiaowen and His Entourage Worshipping the Buddha | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"At the center the emperor walks beneath a canopy in the tasseled crown of state, a monk leading the way. This is Emperor Xiaowen’s offering procession, once carved just inside the \"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:url\"
