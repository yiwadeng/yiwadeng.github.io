country\":{\"zh\":\"英国\",\"en\":\"United Kingdom\"},\"accessionNumber\":\"1930,1015,0.2\",\"url\":\"https://www.britishmuseum.org/collection/object/A_1930-1015-0-2\"}},\"description\":{\"zh\":\"曹植从洛阳回封地，路过洛水，看见了一位女神。他爱上了她，她也回应了他，可人神殊途，最后只能各自离去⁽²⁾。这是《洛神赋》，曹植写于公元 222 年⁽²⁾。\\n\\n这卷画把整篇赋画成了一个连续的故事，长八米多⁽¹⁾。可它没有开头：曹植与洛神初见的三个场景已经丢了，画卷一打开，洛神已经在彩旗桂旗之间嬉戏⁽³⁾。\\n\\n卷上没有一方印章，也没有一段题跋，谁画的、谁藏过，都无从知道⁽²⁾。\",\"en\":\"\"},\"story\":{\"zh\":\"\",\"en\":\"\"},\"layout\":\"model-center\",\"animation\":\"static\",\"models\":[],\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"$undefined\",\"watermark\":\"洛神賦圖\",\"subtitle\":{\"zh\":\"一段没有开头的相遇。\",\"en\":\"\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国（传顾恺之本）\",\"en\":\"China, after Gu Kaizhi\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"洛神赋图\",\"oneLiner\":\"一段没有开头的相遇。\",\"period\":\"约 12—16 世纪（年代未定）\",\"size\":\"画心高 53.7 厘米，长 832.8 厘米；全卷长 1190.3 厘米\",\"craft\":\"绢本设色，手卷\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"1930,1015,0.2\"],[\"入藏年份\",\"1930\"],[\"入藏方式\",\"购自山中商会，艺术基金会资助\"]],\"intro\":[\"曹植从洛阳回封地，路过洛水，看见了一位女神。他爱上了她，她也回应了他，可人神殊途，最后只能各自离去⁽²⁾。这是《洛神赋》，曹植写于公元 222 年⁽²⁾。\",\"这卷画把整篇赋画成了一个连续的故事，长八米多⁽¹⁾。可它没有开头：曹植与洛神初见的三个场景已经丢了，画卷一打开，洛神已经在彩旗桂旗之间嬉戏⁽³⁾。\",\"卷上没有一方印章，也没有一段题跋，谁画的、谁藏过，都无从知道⁽²⁾。\"],\"about\":{\"title\":\"九卷洛神\",\"paras\":[{\"h\":\"九个版本\",\"sub\":\"$undefined\"},\"《洛神赋图》传说最早出自东晋顾恺之之手，原作早已不在。今天世上还有九卷：辽宁省博物馆一卷，北京故宫三卷，台北故宫两卷，美国弗利尔美术馆两卷，大英一卷⁽³⁾。\",\"大英这卷和故宫的「北京乙本」最像，两卷一样高，都是 53.7 厘米⁽¹,³⁾。学者认为北京乙本是它的重要祖本。可大英本短了约 336 厘米，少了全卷三分之一以上⁽³⁾。\",\"它也有别的版本没有的东西：后面的十段图和赋文都在，其中有些情节在别的版本里已经佚失了⁽³⁾。\",{\"h\":\"山大了，人小了\",\"sub\":\"$undefined\"},\"和其他版本比，大英这卷的山水明显多了，人物相对变小，每个情节都留出了更开阔的空间⁽³⁾。远山的画法不那么古拙，有学者据此把它定在金代，也有人认为它是晚明或清初的摹本⁽²⁾。\",\"2026 年展出时，大英用了一个宽泛的年代：12 至 16 世纪⁽³⁾。\",{\"h\":\"陵波微步，罗袜生尘\",\"sub\":\"$undefined\"},\"画中的赋文写在一个个小框里，一共十段⁽¹⁾。第四段写洛神的步态：「体迅飞凫，飘忽若神，陵波微步，罗袜生尘。」第七段写她离去：「六龙俨其齐首，载云车之容裔。」最后一段是曹植：「命仆夫而就驾，吾将归乎东路。」⁽¹⁾\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它在 1930 年以前的经历是一片空白⁽²⁾。那一年，大英从日本古董商山中商会手里买下了它，英国的艺术基金会出了钱⁽¹⁾。\",\"此后它很少露面。2023 年到 2024 年，它借到美国克利夫兰艺术博物馆展出⁽¹,³⁾。回到伦敦后，2026 年 8 月，它第一次和《女史箴图》挂进了同一个展厅，只展开了前三段⁽³⁾。\",\"策展人陆于平说：「一件是较早的摹本，一件是相对较晚的作品，也可以从中看到绘画实践上的转变。」⁽³⁾\"],\"items\":[{\"at\":\"222 年\",\"text\":\"曹植作《洛神赋》⁽²⁾。\"},{\"at\":\"约 12—16 世纪\",\"text\":\"本卷画成，年代未定⁽²,³⁾。\"},{\"at\":\"1930 年\",\"text\":\"大英从山中商会购入，艺术基金会资助⁽¹⁾。\"},{\"at\":\"2023—2024 年\",\"text\":\"借展克利夫兰艺术博物馆⁽¹,³⁾。\"},{\"at\":\"2026 年 8 月\",\"text\":\"与《女史箴图》首次在大英 91a 展厅同展，展前三段⁽³⁾。\"}]},\"refs\":[\"大英博物馆：《handscroll; painting》，1930,1015,0.2。用于名称、年代（宋？明？）、尺寸、十段赋文的录文、参考书目、克利夫兰借展和购入经过。https://www.britishmuseum.org/collection/object/A_1930-1015-0-2\",\"大英博物馆：《The Nymph of the Luo River, a handscroll painting》，谷歌艺术与文化。用于《洛神赋》的故事、远景画法与金代说、晚明清初摹本说、没有题跋印章和卷首缺损，及「存世八个版本之一」。https://artsandculture.google.com/asset/the-nymph-of-the-luo-river-a-handscroll-painting/VwHWory0b0GLpA\",\"黄松：《〈女史箴图〉与〈洛神赋图〉首次在大英博物馆并置同展》，澎湃新闻，2026 年 8 月 11 日。用于两画首次同展、只展前三段、策展人陆于平的话、九本版本、北京乙本为祖本、大英本短约 336 厘米并缺邂逅三景、山水比例增加，及「12 至 16 世纪」的断代。https://www.thepaper.cn/newsDetail_forward_33731623\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Nymph of the Luo River\",\"oneLiner\":\"\",\"period\":\"ca. 12th–16th century (date uncertain)\",\"size\":\"Image 53.7 × 832.8 cm; scroll L. 1190.3 cm\",\"craft\":\"Handscroll, ink and colour on silk\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"1930,1015,0.2\"],[\"Acquired\",\"1930\"],[\"入藏方式\",\"购自山中商会，艺术基金会资助\"]],\"i
