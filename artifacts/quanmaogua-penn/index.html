":{\"slug\":\"quanmaogua-penn\",\"status\":\"modeled\",\"dealGroup\":\"relief\",\"seriesSlugs\":[\"zhaoling-six-steeds\"],\"title\":{\"zh\":\"唐-昭陵六骏-拳毛騧\",\"en\":\"Emperor Taizong Horse Relief, Quanmaogua\"},\"typeLabel\":{\"zh\":\"石雕浮雕\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"唐代·贞观年间（约636–649）\",\"en\":\"Tang dynasty, Zhenguan era, ca. 636–649\"},\"materialTechnique\":{\"zh\":\"石灰岩浮雕\",\"en\":\"Limestone\"},\"dimensions\":{\"zh\":\"166.4 × 207 × 44.4 厘米\",\"en\":\"166.4 cm × 207 cm × 44.4 cm\"},\"collection\":{\"museum\":{\"zh\":\"宾夕法尼亚大学博物馆\",\"en\":\"Penn Museum\"},\"city\":{\"zh\":\"费城\",\"en\":\"Philadelphia\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"C396\",\"url\":\"https://www.penn.museum/collections/object/239945\"}},\"description\":{\"zh\":\"李世民19至22岁时，作为主将屡建奇功平定了天下，其间有六匹战马陪他出生入死。修建昭陵时，太宗令将它们勒石刻碑，列于陵寝之侧永远陪伴自己。唐太宗亲自撰写赞词，书法家欧阳询书丹，画家阎立本绘稿，其兄阎立德刻石，是为「昭陵六骏」。（注脚）\\n\\n拳毛騧（quán máo guā）是平定刘黑闼（tà）叛乱时的坐骑，通体黄色卷毛，黑嘴头（黄马黑嘴称为騧）。该马在战斗中极为勇猛惨烈，身中九箭阵亡，前胸中6箭、背部中3箭。唐代诗人杜甫在他的诗中也曾提到“拳毛騧”，“昔日太宗拳毛騧，近时郭家狮子花。”\\n\\n上世纪10年代，拳毛騧和另一方浮雕飒露紫被剥离盗运，多轮辗转间惨遭破碎。最终，这两匹马经古董商卢芹斋之手盗卖至美国，入藏费城的宾夕法尼亚大学博物馆。（注脚）\",\"en\":\"Quanmaogua, one of the six Zhaoling steeds, strides onward despite nine arrows. Name and image commemorate its service to Li Shimin.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"quanmaogua-penn-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"quanmaogua-penn-hd.glb\",\"modelLantern\":\"quanmaogua-penn-lantern.glb\"},\"orchestration\":{\"importance\":\"standard\",\"category\":\"mural\",\"tags\":[\"昭陵六骏\",\"浮雕\",\"唐代\",\"Penn\"]},\"lanternConfig\":{\"caseType\":\"cube\",\"mount\":\"pedestal\",\"caseFootprint\":0.8,\"paddingSide\":0.095,\"paddingTop\":0.12,\"modelScale\":1,\"modelOffset\":[0,0.145,0],\"artifactLight\":{\"color\":\"#cbbb97\",\"intensity\":1.5,\"position\":[0.19,0.95,1.1],\"rotation\":[0,0,0],\"distance\":5,\"decay\":2,\"angle\":2.115363707695889,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.05,0.445,0.17],\"distance\":5,\"decay\":2,\"angle\":2.140830782496456,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":85,\"fullRotation\":false,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.05}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":0.85,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"天驷横行\",\"subtitle\":{\"zh\":\"唐太宗昭陵六骏西面第二骏\",\"en\":\"Nine arrows, yet the horse presses onward.\"},\"riverLead\":{\"zh\":\"身中九箭，矢志向前\",\"en\":\"Nine arrows, yet the horse presses onward.\"},\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国陕西礼泉，唐太宗昭陵\",\"en\":\"Zhaoling, Liquan, Shaanxi, China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"唐-昭陵六骏-拳毛騧\",\"oneLiner\":\"唐太宗昭陵六骏西面第二骏\",\"period\":\"唐代·贞观年间（约636–649）\",\"size\":\"166.4 × 207 × 44.4 厘米\",\"craft\":\"石灰岩浮雕\",\"location\":\"美国 · 费城 · 宾夕法尼亚大学博物馆\",\"acc\":[[\"馆藏编号\",\"C396\"]],\"intro\":[\"李世民19至22岁时，作为主将屡建奇功平定了天下，其间有六匹战马陪他出生入死。修建昭陵时，太宗令将它们勒石刻碑，列于陵寝之侧永远陪伴自己。唐太宗亲自撰写赞词，书法家欧阳询书丹，画家阎立本绘稿，其兄阎立德刻石，是为「昭陵六骏」。（注脚）\",\"拳毛騧（quán máo guā）是平定刘黑闼（tà）叛乱时的坐骑，通体黄色卷毛，黑嘴头（黄马黑嘴称为騧）。该马在战斗中极为勇猛惨烈，身中九箭阵亡，前胸中6箭、背部中3箭。唐代诗人杜甫在他的诗中也曾提到“拳毛騧”，“昔日太宗拳毛騧，近时郭家狮子花。”\",\"上世纪10年代，拳毛騧和另一方浮雕飒露紫被剥离盗运，多轮辗转间惨遭破碎。最终，这两匹马经古董商卢芹斋之手盗卖至美国，入藏费城的宾夕法尼亚大学博物馆。（注脚）\"],\"about\":{\"title\":\"昭陵六骏——忠勇的神骏\",\"paras\":[\"贞观十年（636年），长孙皇后去世，唐太宗将其按遗言葬于九嵕山昭陵，同时决定把昭陵作为将来的合葬皇陵进行大规模修建，开创并规定了唐代帝王“因山为陵”的陵寝制度。昭陵原建筑群，仿唐长安城布局，气势恢宏，有陪葬墓泱泱两百余座，是太宗昔日的名臣良将，司马门前十四国蕃君长石像环拱、六骏石刻矗立，该是何等景象，真是令人遐思叹息。\\n当时太宗37岁，这些战马都是他在弱冠之年的坐骑，他为它们每一匹写下了赞词。他怀念的，不仅仅是昔日的战友，也是当年英姿勃发的少年岁月吧。\",{\"img\":\"/images/editorial/zhaoling-saluzi.webp\",\"cap\":\"飒露紫｜昭陵西廊南端 · 今藏美国·费城 宾夕法尼亚大学博物馆\\n紫燕骝，深赤色。武德四年（621），李世民在洛阳与王世充交战时所乘，前胸中一箭⁽²⁶⁾。石刻中马停步站立，丘行恭在马前为它拔箭，是六骏中唯一刻有人物的一方⁽²⁸⁾。\\n太宗赞「紫燕超跃，骨腾神骏。气詟三川，威凌八阵。」⁽²⁷⁾ 已有模型，点击查看\",\"compact\":true},{\"img\":\"/images/editorial/zhaoling-quanmaogua.webp\",\"cap\":\"拳毛騧｜原在昭陵西廊正中 · 今藏美国·费城 宾夕法尼亚大学博物馆\\n黄马黑嘴。武德五年（622），平刘黑闼时所乘，前身中六箭、后身中三箭，共九箭；石刻作缓步行进状⁽²⁶⁾。\\n太宗赞「月精按辔，天驷横行。弧矢载戢，氛埃廓清。」⁽²⁷⁾ 已有模型，点击查看\",\"compact\":true},{\"img\":\"/images/editorial/zhaoling-baitiwu.webp\",\"cap\":\"白蹄乌｜原在昭陵西廊北端 · 今藏中国·西安 碑林博物馆（原石）\\n通体乌黑，四蹄雪白。武德元年（618），与薛仁杲作战时所乘；石刻昂首疾驰，四蹄腾空⁽²⁶⁾。\\n太宗赞「倚天长剑，追风骏足。耸辔平陇，回鞍定蜀。」⁽²⁷⁾\",\"compact\":true},{\"img\":\"/images/editorial/zhaoling-teqinbiao.webp\",\"cap\":\"特勒骠｜原在昭陵东廊南端 · 今藏中国·西安 碑林博物馆（原石）\\n黄白杂色，嘴微黑。武德二年（619）冬，与刘武周、宋金刚作战时所乘；石刻作缓步行进状⁽²⁶⁾。\\n太宗赞「应策腾空，承声半汉。入险摧敌，乘危济难。」⁽²⁷⁾\",\"compact\":true},{\"img\":\"/images/editorial/zhaoling-qingzhui.webp\",\"cap\":\"青骓｜原在昭陵东廊正中 · 今藏中国·西安 碑林博物馆（原石）\\n苍白杂色。武德四年（621）夏，在虎牢关一带与窦建德作战时所乘，身中五箭；石刻作高速冲阵状⁽²⁶⁾。\\n太宗赞「足轻电影，神发天机。策兹飞练，定我戎衣。」⁽²⁷⁾\",\"compact\":true},{\"img\":\"/images/editorial/zhaoling-shifachi.webp\",\"cap\":\"什伐赤｜原在昭陵东廊北端 · 今藏中国·西安 碑林博物馆（原石）\\n纯赤色。与王世充、窦建德作战时所乘，前身中四箭、背上中一箭；石刻作奔驰状⁽²⁶⁾。\\n太宗赞「瀍涧未静，斧钺申威。朱汗骋足，青旌凯归。」⁽²⁷⁾\",\"compact\":true}]},\"loss\":{\"title\":\"二骏离乡：从九嵕山到费城\",\"note\":\"以下为有来源的收藏记录，不等同于完整离境史。\",\"paras\":[\"二骏的流失，一百年来众说纷纭——盗运年份、经手人物，乃至二骏是否真进过袁府，中外记载各执一词。本时间轴综合芝加哥大学东亚艺术中心专题、宾大博物馆记录与周秀琴的档案研究、西安理工大学唐陵专题、央视《国宝档案》及国内报道；记载有分歧的环节分别注明来源，不作定论⁽²⁵,²⁴,³¹,¹⁸,³⁰,²⁰⁾。\"],\"items\":[{\"at\":\"公元 636 年\",\"text\":\"唐太宗诏刻昭陵六骏，立在昭陵北司马门内东西两侧的廊屋里，西侧由南往北依次是飒露紫、拳毛騧、白蹄乌⁽¹³,²⁷⁾。此后一千多年，六骏都留在原址。\"},{\"at\":\"1089 年\",\"text\":\"北宋游师雄到昭陵察看六骏，刻下《昭陵六骏碑》，把马名、图像和太宗赞语一一对应记下⁽³³⁾。后来原石上的字磨灭殆尽，这块碑成了辨认六骏的关键证据。\"},{\"at\":\"明代\",\"text\":\"有研究认为，关中地震可能震裂了部分石刻，原址遮护六骏的房屋也逐渐坍塌⁽²⁵,²⁷⁾。\"},{\"at\":\"1907 年 9 月 10 日\",\"text\":\"法国汉学家沙畹在昭陵拍下六骏：屋顶和墙体已大片坍塌，飒露紫保存得相对完整，其余几骏已有明显断裂⁽²⁵,²⁸⁾。这组照片后来成了比对切割痕迹、确定原位的依据。\"},{\"at\":\"1912 年\",\"text\":\"在京法国商人格鲁尚（受法商保尔·马龙 Paul Mallon 出资），为抢在德国人之前弄到石刻，派人潜入昭陵，图谋盗运飒露紫、拳毛騧⁽¹⁶⁾。\"},{\"at\":\"1913 年\",\"text\":\"据《国宝档案》，格鲁尚派戈兰兹潜入昭陵，把飒露紫和拳毛騧打碎，想偷运出境，因动静太大被乡民追回⁽³⁰⁾。\"},{\"at\":\"1913 年 5 月\",\"text\":\"据宾大档案整理的研究和国内记述，二骏被运下山时遭当地村民拦截，运输者在混乱中把石刻推下山崖，残石由陕西地方当局收存⁽⁷,¹⁶,³¹⁾。芝加哥大学专题则认为，二骏是古董商雇来的石匠为了好搬运切割成块的，对照沙畹的照片能看出切痕⁽²⁵⁾。\"},{\"at\":\"1914 年前后\",\"text\":\"辛亥革命后，陕西兵马都督张云山把二骏搬进督府，石刻被折腾得「断泐不堪」⁽³⁰⁾。张云山去职病逝后，袁世凯亲信、新任陕西督军陆建章接手⁽¹⁷⁾。芝加哥大学专题另记：1914 年二骏在张云山私邸，曾与卢芹斋议售，没谈成⁽²⁵⁾。\"},{\"at\":\"1915—1916 年（运京年份有异）\",\"text\":\"袁世凯筹建「袁家花园」、图谋帝制之际，北京古玩商赵鹤舫借与袁世凯次子袁克文的交情，以「为袁府觅奇石」为名，从陆建章手里要到二骏，贴上袁府封条运往北京——封条如同「皇封」，一路畅通⁽¹⁷,¹⁸,³¹,³⁰⁾。这是二骏离开陕西的关键一步。芝加哥大学专题则把运京记为 1916 年⁽²⁵⁾。\"},{\"at\":\"进京后不久\",\"text\":\"国内记述中，二骏并没有真正进袁府（一说袁克文见石被剖开，怒而拒收；一说袁氏已倒台），几经转手，最终落入跨国大古董商卢芹斋手中，被非法运出中国⁽⁸,¹⁹⁾。\"},{\"at\":\"1916 年（芝加哥大学记述）\",\"text\":\"卢芹斋年初以 5 万美元购得二骏，随后装船运往纽约；经手人仍未确定⁽²⁵⁾。\"},{\"at\":\"1917 年\",\"text\":\"芝加哥大学专题记载：法国商人又想买走剩下的四骏，用马车运下山，装船沿渭河运走，被当地居民举报，陕西省政府迫令船只返回西安⁽²⁵⁾。1985—1986 年礼泉县的调查中，22 位当地老人也回忆六骏被盗运过两次，约在 1915 年和 1917 年，用大车走天桥、凉窑、韩窑一线下山⁽²⁸⁾。\"},{\"at\":\"1918 年 3 月\",\"text\":\"宾夕法尼亚大学考古与人类学博物馆馆长高登（George Byron Gordon），在纽约大都会博物馆的仓库第一次见到寄存在那里的二骏，一眼相中⁽²⁰,³¹⁾。\"},{\"at\":\"1918 年 5 月\",\"text\":\"据《国宝档案》，二骏被分块运到费城宾大博物馆，名义上是「借展」⁽³⁰⁾。\"},{\"at\":\"1918 年\",\"text\":\"于右任回乡，见六骏离散，写下「六骏失群图尚在，追怀名迹感无穷」⁽³⁰⁾。\"},{\"at\":\"赴美后、1920 年前\",\"text\":\"卢芹斋曾向克利夫兰艺术博物馆推销二骏，没有成交；是否因为要价太高，只是推测⁽²⁵⁾。\"},{\"at\":\"1920 年底\",\"text\":\"经两年多筹款，宾大博物馆以 12.5 万美元（卢芹斋原索价 15 万，约合 2024 年的 190 万美元）从卢芹斋手中购下二骏⁽²⁰,²⁵⁾。资金由慈善家埃尔德里奇·约翰逊（Eldridge R. Johnson）捐款促成，石座至今标注「约翰逊捐赠」⁽⁵,¹⁹⁾。\"},{\"at\":\"1920 年\",\"text\":\"《国宝档案》记：同年，留在陕西的四骏也险些被洋商盗运，被乡民拦下，存入陕西图书馆，后移交陕西省博物馆⁽³⁰⁾。四骏被截的年份，各家记载不一（见 1917 年）。\"},{\"at\":\"1924 年秋\",\"text\":\"刚进宾大建筑系的梁思成走进学校博物馆，一眼认出这两方浮雕是昭陵二骏，当晚就写信告诉远在太平洋彼岸的父亲梁启超⁽¹²,²⁰⁾。\"},{\"at\":\"抗日战争时期\",\"text\":\"留在西安的四骏被埋进地下，躲避战火⁽²⁹⁾。\"},{\"at\":\"1950 年\",\"text\":\"四骏转入西安的文博机构保存⁽²⁹⁾。\"},{\"at\":\"1963 年\",\"text\":\"碑林石刻艺术室建成，四骏原石和按照片翻制的飒露紫、拳毛騧复制品一字排开陈列——六骏以「四真二仿」的样子重新聚首⁽²⁹⁾。\"},{\"at\":\"1972 年\",\"text\":\"尼克松访华前，杨振宁曾建议美方送回二骏，没有结果⁽³⁰⁾。\"},{\"at\":\"2000 年\",\"text\":\"碑林博物馆为发行《昭陵六骏》邮票核对馆藏，对照宋碑和老照片，发现青骓和什伐赤的名字一直标反了，随即更正⁽²⁹⁾。\"},{\"at\":\"2002—2003 年\",\"text\":\"陕西省考古研究所和昭陵博物馆发掘北司马门遗址，找到六骏的座石，重新确定了六骏的原位⁽³²⁾。出土的残块里，两件能和青骓、什伐赤的缺口拼上，一件是拳毛騧的马鞍⁽³²,²⁸⁾。\"},{\"at\":\"2010 年\",\"text\":\"中国文物保护人员赴宾大，与美方一起修复二骏，带去陕西富平宫里镇的石材和石粉调配修补材料；只求稳固、改善观感，不强行补全缺损⁽²⁸⁾。\"},{\"at\":\"2013 年 8 月\",\"text\":\"四骏列入国家文物局《第三批禁止出境展览文物目录》⁽⁶⁾。\"},{\"at\":\"2017 年 1 月\",\"text\":\"昭陵博物馆发文《昭陵「二骏」，中国等你回家》，公开呼吁宾大博物馆归还二骏，至今未获归还⁽¹⁹,³⁰⁾。\"},{\"at\":\"至今\",\"text\":\"飒露紫、拳毛騧仍藏在宾大博物馆，其余四骏在西安碑林博物馆。昭陵六骏，隔洋分藏，再未重聚⁽¹⁵⁾。\"}]},\"refs\":[\"⑴ 《旧唐书·丘行恭传》：「贞观中，有诏刻石为人马以象行恭拔箭之状，立于昭陵阙前。」\",\"⑵ 故宫博物院《赵霖〈昭陵六骏图〉卷》说明：「由著名画家阎立本起草手稿，唐太宗亲撰赞语，由著名书法家欧阳询书写。」（阎立本起稿、阎立德刻石、太宗撰赞、欧阳询书丹，为传统归属，故正文用「相传」）https://www.dpm.org.cn/collection/paint/228287.html\",\"⑶ 唐太宗《六马像赞·飒露紫》：「紫燕超跃，骨腾神骏，气詟三川，威凌八阵。」（「三川」指黄河、洛水、伊水，即洛阳一带；见北宋游师雄《昭陵六骏碑》题记所录马赞）\",\"⑷ 芮传明等对「飒露」突厥语词源的考证，见《飒露紫来自何方？昭陵六骏的产地、名号与突厥葬俗》，澎湃新闻·古代艺术，2020 年（「飒露」还原为突厥语 išbara／沙钵略／始波罗，意为「勇健者」；飒露紫为李世民讨王世充、邙山之战时坐骑）https://www.thepaper.cn/newsDetail_forward_8639730\",\"⑸ 二骏流失、卢芹斋以 12.5 万美元盗卖、现藏宾夕法尼亚大学博物馆：国家民委「道中华」《大唐最有名的六匹马》 https://www.neac.gov.cn/seac/c103391/202310/1168452.shtml ；澎湃新闻《昭陵博物馆发文吁还二骏》 https://www.thepaper.cn/newsDetail_forward_1598288 （具体年份各来源不一，本文统一作「上世纪 10 年代／1914 年前后」）\",\"⑹ 四骏列入禁止出境名录：2013 年 8 月 19 日国家文物局《第三批禁止出境展览文物目录》（文物博函〔2013〕1320 号），第 22 项「唐昭陵六骏石刻（什伐赤、白蹄乌、特勒骠、青骓四幅）·唐·西安碑林博物馆」。目录全文见安阳博物馆转载，http://www.aybwg.org/dongtai/167.html\",\"⑺ 欧阳询书赞的题写位置、以及「1913 年 5 月受法商保尔马龙指使、村民拦击致石骏跌落碎裂」一说：西安理工大学·唐陵专题《昭陵六骏·多舛历史》https://tangling.xaut.edu.cn/zhaolingliujun/4 （另据该站：每马头上方一尺见方空白，欧阳询所书赞词今已风化无存）\",\"⑻ 浮雕「为便运输打碎装箱」一说（袁克文委托运京、古董商剖石）：罗振玉《石交录》，转见书格《昭陵六骏图卷》https://www.shuge.org/view/zhao_ling_liu_jun_tu/\",\"⑼ 邙山之战与拔箭情景：《旧唐书·丘行恭传》《册府元龟》；石刻画面描述另参故宫博物院《赵霖〈昭陵六骏图〉卷》https://www.dpm.org.cn/collection/paint/228287.html\",\"⑽ 束尾、三花马鬃为唐代战马装扮且传自突厥：《昭陵六骏专题展》，澎湃新闻 https://www.thepaper.cn/newsDetail_forward_30891071 （「六骏均为三花马鬃、束尾，这是唐代战马的特征，也是从突厥传入的习俗」）；束尾「拍打马臀助跑」的功能说另见搜狐《赏金代〈昭陵六骏图〉卷》 https://www.sohu.com/a/356531604_776727\",\"⑾ 高浮雕技法与艺术评价：《昭陵六骏中的六匹骏马……参与了哪些战役》 http://m.3233.cn/n/9h0y-19693.html ；故宫博物院《赵霖〈昭陵六骏图〉卷》 https://www.dpm.org.cn/collection/paint/228287.html\",\"⑿ 梁思成 1924 年在宾大博物馆认出二骏：《昭陵六骏：大唐最有名的六匹马》，2023 https://m.newsduan.com/static/content/ZS/2023-10-25/1166674493365589461.html\",\"⒀ 贞观十年刻六骏、「刻石为镌真形，置之左右，以申帷盖之义」、阎立本起稿阎立德刻石、太宗亲撰赞诗：《册府元龟》；故宫博物院《赵霖〈昭陵六骏图〉卷》 https://www.dpm.org.cn/collection/paint/228287.html ；中国丝绸博物馆《一物·〈昭陵六骏碑〉拓片》 https://www.chinasilkmuseum.com/gskt/info_319.aspx?itemid=28332\",\"⒁ 六骏名字多源突厥语、马种多突厥／中亚良种：葛承雍《唐昭陵六骏与突厥葬俗研究》，《中华文史论丛》1999 年第 60 辑；中国丝绸博物馆前引文（含「特勒／Tegin」「青／cin」「什伐／叱拨」等考证）。\",\"⒂ 六匹战役、赞诗原文、现藏（二骏在宾大、四骏在碑林）：中国社会科学院考古网《昭陵六骏石刻》 http://kaogu.cssn.cn/zwb/kgyd/kgbk/201504/t20150407_3933068.shtml ；书格《昭陵六骏图卷》 https://www.shuge.org/view/zhao_ling_liu_jun_tu/ ；知乎《昭陵六骏》 https://zhuanlan.zhihu.com/p/657791759\",\"⒃ 1912 年格鲁尚受法商保尔·马龙（Paul Mallon）出资潜入昭陵图谋盗运、1913 年 5 月运下山时被村民拦截、二骏推下山崖摔成碎块、残石被陕西政府没收：《马望昭陵》，文物网 http://wenwuchina.com/a/18/57836.html ；西安理工大学·唐陵《昭陵六骏·多舛历史》，同⑺\",\"⒄ 1914 年前后张云山去职病逝、陆建章接手侵吞，1915 年借袁府封条运京，及 2010 年前后中美合作修复与呼吁归还：腾讯新闻《昭陵六骏，两个流失海外……》 https://news.qq.com/rain/a/20210829A0B10A00\",\"⒅ 赵鹤舫借袁克文之名于 1915 年将二骏运京（据陈重远《文物话春秋》）；本时间轴对流失史争议的取舍依据（卢芹斋 1927 年信、毕士博 1917 年在西安等一手记载）：西安理工大学·唐陵《昭陵六骏·多舛历史》，同⑺\",\"⒆ 袁克文见石被剖开怒而拒收、几经转手落入卢芹斋；约翰逊（Eldridge R. Johnson）捐款促成购藏、石座标注「约翰逊捐赠」；2010 年前后中美合作修复、陕西昭陵博物馆多次公开呼吁归还至今未果：澎湃新闻《昭陵博物馆发文吁还二骏》 https://www.thepaper.cn/newsDetail_forward_1598288\",\"⒇ 1918 年 3 月宾大博物馆馆长高登（George Byron Gordon）在大都会仓库初见二骏、1920 年底以 12.5 万美元购藏（卢芹斋原索价 15 万）、1924 年秋梁思成认出二骏并致信梁启超：国家民委「道中华」《大唐最有名的六匹马》 https://www.neac.gov.cn/seac/c103391/202310/1168452.shtml\",\"㉑ 西安碑林博物馆《昭陵六骏》，2020年7月13日：纪念开国战争坐骑、太宗撰赞及二骏流失与现藏。https://www.beilin-museum.com/index.php?a=index\u0026aid=142\u0026c=View\u0026m=home\",\"㉒ Xiuqin Zhou, Creation and Separation: A Chinese Emperor’s Six Stone Horses, Penn Museum, 2024, ISBN 9781949057218。讨论六骏的纪念意义、政治遗产及二骏经卢芹斋进入美国艺术市场的经历。https://www.penn.museum/research/publications/publication/1549\",\"㉓ Xiuqin Zhou, “Excavations at Zhaoling, Shaanxi, China: More Light on the Museum’s Chinese Horse Reliefs,” Expedition 47(2), 2005。记载六骏分藏、二骏藏品号，以及昭陵出土青骓后腿残块。https://www.penn.museum/sites/expedition/excavations-at-zhaoling-shaanxi-china/\",\"㉔ 宾夕法尼亚大学博物馆 · 藏品档案：飒露紫 C395 https://www.penn.museum/collections/object/167942 ；拳毛騧 C396 https://www.penn.museum/collections/object/239945 （核对馆藏号、尺寸与 1920 年购藏信用行）\",\"㉕ 芝加哥大学东亚艺术中心《昭陵六骏的创作与离散》，「昭陵六骏的破坏、出售与迁移」节。补充沙畹照片、西安暂存、1916年购入及赴美后推销；赴京年份与国内记述不同，文中并列注明。https://caea.lib.uchicago.edu/dcadp/zh/sixhorses/intro/\",\"陕西历史博物馆、昭陵博物馆《昭陵文物精华》，西安：陕西人民美术出版社，1991，第 2–7 页。各骏的毛色、所涉战事、箭伤与石刻姿态。\",\"沈睿文《唐陵的布局：空间与秩序》，北京：北京大学出版社，2009，第 237–240 页。六骏原始排列（西庑自南向北为飒露紫、拳毛騧、白蹄乌，东庑自南向北为特勒骠、青骓、什伐赤，马首皆朝陵山）及太宗六马赞。\",\"霍宏伟《守望汉唐——美国宾夕法尼亚大学博物馆藏中国陵墓石刻》，《文史知识》2012 年第 5 期，第 5–11 页。飒露紫拔箭场面与宾大二骏现状。\",\"马成功《昭陵六骏中「青骓」与「什伐赤」的定名》，《碑林集刊》第 8 辑，2002，第 241–245 页。2000 年碑林博物馆据宋《昭陵六骏碑》与早期照片更正两骏名实。\",\"中央电视台《国宝档案》栏目组编《CCTV〈国宝档案〉：书法、碑刻、石刻》，北京：中国民主法制出版社，2009，第 230–248 页（转引自百度百科「唐昭陵六骏石刻」条）。戈兰兹潜入盗运、张云山移石督府、1918 年借展、四骏存陕西图书馆、于右任诗、杨振宁建议等。\",\"周秀琴《昭陵两骏流失始末》，《碑林集刊》第 8 辑，2002，第 225–240 页。据宾大博物馆档案整理二骏 1913 年下山受阻、1915 年前后运京经过。\",\"张建林、王小蒙《对唐昭陵北司马门遗址考古新发现的几点认识》，《考古与文物》2006 年第 6 期，第 17–22 页。2002—2003 年北司马门遗址发掘、六骏座石与残块。\",\"李举纲《〈昭陵六骏碑〉研究》，《碑林集刊》第 8 辑，2002，第 255–260 页。北宋游师雄 1089 年刻《昭陵六骏碑》。\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Emperor Taizong Horse Relief, Quanmaogua\",\"oneLiner\":\"Nine arrows, yet the horse presses onward.\",\"period\":\"Tang dynasty, Zhenguan era, ca. 636–649\",\"size\":\"166.4 cm × 207 cm × 44.4 cm\",\"craft\":\"Limestone\",\"location\":\"United States, Philadelphia, Penn Museum\",\"acc\":[[\"Accession no.\",\"C396\"]],\"intro\":[\"Quanmaogua, one of the six Zhaoling steeds, strides onward despite nine arrows. Name and image commemorate its service to Li Shimin.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"The name refers to its curly coat. Six arrows in front and three behind make the wounds part of its remembered service.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"Penn records purchase from C. T. Loo in 1920 with Eldridge R. Johnson’s subscription. Earlier dispersal requires separate documentary review.\"],\"items\":[{\"at\":\"1920\",\"text\":\"Purchased from C. T. Loo with Eldridge R. Johnson’s subscription.\"}]},\"refs\":[\"⑴ 《旧唐书·丘行恭传》：「贞观中，有诏刻石为人马以象行恭拔箭之状，立于昭陵阙前。」\",\"⑵ 故宫博物院《赵霖〈昭陵六骏图〉卷》说明：「由著名画家阎立本起草手稿，唐太宗亲撰赞语，由著名书法家欧阳询书写。」（阎立本起稿、阎立德刻石、太宗撰赞、欧阳询书丹，为传统归属，故正文用「相传」）https://www.dpm.org.cn/collection/paint/228287.html\",\"⑶ 唐太宗《六马像赞·飒露紫》：「紫燕超跃，骨腾神骏，气詟三川，威凌八阵。」（「三川」指黄河、洛水、伊水，即洛阳一带；见北宋游师雄《昭陵六骏碑》题记所录马赞）\",\"⑷ 芮传明等对「飒露」突厥语词源的考证，见《飒露紫来自何方？昭陵六骏的产地、名号与突厥葬俗》，澎湃新闻·古代艺术，2020 年（「飒露」还原为突厥语 išbara／沙钵略／始波罗，意为「勇健者」；飒露紫为李世民讨王世充、邙山之战时坐骑）https://www.thepaper.cn/newsDetail_forward_8639730\",\"⑸ 二骏流失、卢芹斋以 12.5 万美元盗卖、现藏宾夕法尼亚大学博物馆：国家民委「道中华」《大唐最有名的六匹马》 https://www.neac.gov.cn/seac/c103391/202310/1168452.shtml ；澎湃新闻《昭陵博物馆发文吁还二骏》 https://www.thepaper.cn/newsDetail_forward_1598288 （具体年份各来源不一，本文统一作「上世纪 10 年代／1914 年前后」）\",\"⑹ 四骏列入禁止出境名录：2013 年 8 月 19 日国家文物局《第三批禁止出境展览文物目录》（文物博函〔2013〕1320 号），第 22 项「唐昭陵六骏石刻（什伐赤、白蹄乌、特勒骠、青骓四幅）·唐·西安碑林博物馆」。目录全文见安阳博物馆转载，http://www.aybwg.org/dongtai/167.html\",\"⑺ 欧阳询书赞的题写位置、以及「1913 年 5 月受法商保尔马龙指使、村民拦击致石骏跌落碎裂」一说：西安理工大学·唐陵专题《昭陵六骏·多舛历史》https://tangling.xaut.edu.cn/zhaolingliujun/4 （另据该站：每马头上方一尺见方空白，欧阳询所书赞词今已风化无存）\",\"⑻ 浮雕「为便运输打碎装箱」一说（袁克文委托运京、古董商剖石）：罗振玉《石交录》，转见书格《昭陵六骏图卷》https://www.shuge.org/view/zhao_ling_liu_jun_tu/\",\"⑼ 邙山之战与拔箭情景：《旧唐书·丘行恭传》《册府元龟》；石刻画面描述另参故宫博物院《赵霖〈昭陵六骏图〉卷》https://www.dpm.org.cn/collection/paint/228287.html\",\"⑽ 束尾、三花马鬃为唐代战马装扮且传自突厥：《昭陵六骏专题展》，澎湃新闻 https://www.thepaper.cn/newsDetail_forward_30891071 （「六骏均为三花马鬃、束尾，这是唐代战马的特征，也是从突厥传入的习俗」）；束尾「拍打马臀助跑」的功能说另见搜狐《赏金代〈昭陵六骏图〉卷》 https://www.sohu.com/a/356531604_776727\",\"⑾ 高浮雕技法与艺术评价：《昭陵六骏中的六匹骏马……参与了哪些战役》 http://m.3233.cn/n/9h0y-19693.html ；故宫博物院《赵霖〈昭陵六骏图〉卷》 https://www.dpm.org.cn/collection/paint/228287.html\",\"⑿ 梁思成 1924 年在宾大博物馆认出二骏：《昭陵六骏：大唐最有名的六匹马》，2023 https://m.newsduan.com/static/content/ZS/2023-10-25/1166674493365589461.html\",\"⒀ 贞观十年刻六骏、「刻石为镌真形，置之左右，以申帷盖之义」、阎立本起稿阎立德刻石、太宗亲撰赞诗：《册府元龟》；故宫博物院《赵霖〈昭陵六骏图〉卷》 https://www.dpm.org.cn/collection/paint/228287.html ；中国丝绸博物馆《一物·〈昭陵六骏碑〉拓片》 https://www.chinasilkmuseum.com/gskt/info_319.aspx?itemid=28332\",\"⒁ 六骏名字多源突厥语、马种多突厥／中亚良种：葛承雍《唐昭陵六骏与突厥葬俗研究》，《中华文史论丛》1999 年第 60 辑；中国丝绸博物馆前引文（含「特勒／Tegin」「青／cin」「什伐／叱拨」等考证）。\",\"⒂ 六匹战役、赞诗原文、现藏（二骏在宾大、四骏在碑林）：中国社会科学院考古网《昭陵六骏石刻》 http://kaogu.cssn.cn/zwb/kgyd/kgbk/201504/t20150407_3933068.shtml ；书格《昭陵六骏图卷》 https://www.shuge.org/view/zhao_ling_liu_jun_tu/ ；知乎《昭陵六骏》 https://zhuanlan.zhihu.com/p/657791759\",\"⒃ 1912 年格鲁尚受法商保尔·马龙（Paul Mallon）出资潜入昭陵图谋盗运、1913 年 5 月运下山时被村民拦截、二骏推下山崖摔成碎块、残石被陕西政府没收：《马望昭陵》，文物网 http://wenwuchina.com/a/18/57836.html ；西安理工大学·唐陵《昭陵六骏·多舛历史》，同⑺\",\"⒄ 1914 年前后张云山去职病逝、陆建章接手侵吞，1915 年借袁府封条运京，及 2010 年前后中美合作修复与呼吁归还：腾讯新闻《昭陵六骏，两个流失海外……》 https://news.qq.com/rain/a/20210829A0B10A00\",\"⒅ 赵鹤舫借袁克文之名于 1915 年将二骏运京（据陈重远《文物话春秋》）；本时间轴对流失史争议的取舍依据（卢芹斋 1927 年信、毕士博 1917 年在西安等一手记载）：西安理工大学·唐陵《昭陵六骏·多舛历史》，同⑺\",\"⒆ 袁克文见石被剖开怒而拒收、几经转手落入卢芹斋；约翰逊（Eldridge R. Johnson）捐款促成购藏、石座标注「约翰逊捐赠」；2010 年前后中美合作修复、陕西昭陵博物馆多次公开呼吁归还至今未果：澎湃新闻《昭陵博物馆发文吁还二骏》 https://www.thepaper.cn/newsDetail_forward_1598288\",\"⒇ 1918 年 3 月宾大博物馆馆长高登（George Byron Gordon）在大都会仓库初见二骏、1920 年底以 12.5 万美元购藏（卢芹斋原索价 15 万）、1924 年秋梁思成认出二骏并致信梁启超：国家民委「道中华」《大唐最有名的六匹马》 https://www.neac.gov.cn/seac/c103391/202310/1168452.shtml\",\"㉑ 西安碑林博物馆《昭陵六骏》，2020年7月13日：纪念开国战争坐骑、太宗撰赞及二骏流失与现藏。https://www.beilin-museum.com/index.php?a=index\u0026aid=142\u0026c=View\u0026m=home\",\"㉒ Xiuqin Zhou, Creation and Separation: A Chinese Emperor’s Six Stone Horses, Penn Museum, 2024, ISBN 9781949057218。讨论六骏的纪念意义、政治遗产及二骏经卢芹斋进入美国艺术市场的经历。https://www.penn.museum/research/publications/publication/1549\",\"㉓ Xiuqin Zhou, “Excavations at Zhaoling, Shaanxi, China: More Light on the Museum’s Chinese Horse Reliefs,” Expedition 47(2), 2005。记载六骏分藏、二骏藏品号，以及昭陵出土青骓后腿残块。https://www.penn.museum/sites/expedition/excavations-at-zhaoling-shaanxi-china/\",\"㉔ 宾夕法尼亚大学博物馆 · 藏品档案：飒露紫 C395 https://www.penn.museum/collections/object/167942 ；拳毛騧 C396 https://www.penn.museum/collections/object/239945 （核对馆藏号、尺寸与 1920 年购藏信用行）\",\"㉕ 芝加哥大学东亚艺术中心《昭陵六骏的创作与离散》，「昭陵六骏的破坏、出售与迁移」节。补充沙畹照片、西安暂存、1916年购入及赴美后推销；赴京年份与国内记述不同，文中并列注明。https://caea.lib.uchicago.edu/dcadp/zh/sixhorses/intro/\",\"陕西历史博物馆、昭陵博物馆《昭陵文物精华》，西安：陕西人民美术出版社，1991，第 2–7 页。各骏的毛色、所涉战事、箭伤与石刻姿态。\",\"沈睿文《唐陵的布局：空间与秩序》，北京：北京大学出版社，2009，第 237–240 页。六骏原始排列（西庑自南向北为飒露紫、拳毛騧、白蹄乌，东庑自南向北为特勒骠、青骓、什伐赤，马首皆朝陵山）及太宗六马赞。\",\"霍宏伟《守望汉唐——美国宾夕法尼亚大学博物馆藏中国陵墓石刻》，《文史知识》2012 年第 5 期，第 5–11 页。飒露紫拔箭场面与宾大二骏现状。\",\"马成功《昭陵六骏中「青骓」与「什伐赤」的定名》，《碑林集刊》第 8 辑，2002，第 241–245 页。2000 年碑林博物馆据宋《昭陵六骏碑》与早期照片更正两骏名实。\",\"中央电视台《国宝档案》栏目组编《CCTV〈国宝档案〉：书法、碑刻、石刻》，北京：中国民主法制出版社，2009，第 230–248 页（转引自百度百科「唐昭陵六骏石刻」条）。戈兰兹潜入盗运、张云山移石督府、1918 年借展、四骏存陕西图书馆、于右任诗、杨振宁建议等。\",\"周秀琴《昭陵两骏流失始末》，《碑林集刊》第 8 辑，2002，第 225–240 页。据宾大博物馆档案整理二骏 1913 年下山受阻、1915 年前后运京经过。\",\"张建林、王小蒙《对唐昭陵北司马门遗址考古新发现的几点认识》，《考古与文物》2006 年第 6 期，第 17–22 页。2002—2003 年北司马门遗址发掘、六骏座石与残块。\",\"李举纲《〈昭陵六骏碑〉研究》，《碑林集刊》第 8 辑，2002，第 255–260 页。北宋游师雄 1089 年刻《昭陵六骏碑》。\"]}},\"unplacedLookPoints\":[],\"lookPoints\":[{\"id\":\"pt-mw0xwbuk\",\"title\":\"箭伤\",\"text\":\"据记载，拳毛騧前胸中了六箭，背上中了三箭。千年磨损，箭杆已经很浅了。放大模型，到马鞍后方的背上找找看吧。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[7.096,2.369,3.144],\"cameraPose\":{\"position\":[-7.392,-1.513,24.665],\"target\":[9.215,0.672,10.692]},\"note\":{\"x\":0.725,\"y\":0.262,\"width\":280}},{\"id\":\"pt-18a0pb\",\"title\":\"赞词\",\"text\":\"马头上方这块一尺见方的空白，据载曾题着欧阳询手书的太宗马赞：「月精按辔，天驷横行，弧矢载戢，氛埃廓清。」千年风化，字迹已无存。\\n\\n唐太宗亲自撰赞、书法家欧阳询书丹、画家阎立本起稿、国手阎立德刻石——国家队级别的集体创作。仍留在国内的四骏，已列为「禁止出境展览文物」。\",\"shortText\":\"马头上方这块一尺见方的空白，据载曾题着欧阳询手书的太宗马赞：「月精按辔，天驷横行，弧矢载戢，氛埃廓清。」千年风化，字迹已无存。\",\"en\":{\"title\":\"The Lost Inscription\",\"text\":\"The blank square above the horse’s head, roughly one chi on each side, is recorded as once bearing Emperor Taizong’s tribute in Ouyang Xun’s calligraphy: “Spirit of the moon held in rein, the heavenly steed sweeps across the field. Bows and arrows laid to rest, the dust of war is cleared away.” A thousand years of weathering have erased the words.\\n\\nTaizong composed the tribute, Ouyang Xun wrote the calligraphy, Yan Liben drew the design, and Yan Lide carved the stone: a collaboration of the empire’s leading talents. The four companion horse reliefs still in China have been listed among the cultural relics prohibited from being exhibited abroad.\",\"shortText\":\"The blank square above the horse’s head, roughly one chi on each side, is recorded as once bearing Emperor Taizong’s tribute in Ouyang Xun’s calligraphy: “Spirit of the moon held in rein, the heavenly steed sweeps across the field. Bows and arrows laid to rest, the dust of war is cleared away.” A thousand years of weathering have erased the words.\"},\"img\":\"$undefined\",\"position\":[-15.723,10.383,3.017],\"cameraPose\":{\"position\":[-8.899,16.115,50.418],\"target\":[-0.816,13.956,1.567]},\"note\":{\"x\":0.78,\"y\":0.166,\"width\":482}},{\"id\":\"pt-wrdlv1\",\"title\":\"裂痕\",\"text\":\"浮雕在流失过程中被打碎成好几块，如今虽已重新拼合，贯穿石面的断痕却再也无法抹去。2002 年昭陵原址考古时，还出土了一块拳毛騧马鞍的残片，它至今留在中国。\\n\\n六骏（两骏在宾大博物馆，四骏在碑林博物馆）都被不同程度的打碎拼合，没有一幅完整，令人唏嘘。\",\"shortText\":\"浮雕在流失过程中被打碎成好几块，如今虽已重新拼合，贯穿石面的断痕却再也无法抹去。\",\"en\":{\"title\":\"Fracture Lines\",\"text\":\"During its removal and dispersal, the relief was broken into several pieces. They have since been reassembled, but the fractures running through the stone can never be erased. In 2002, excavations at the original Zhaoling site even uncovered a fragment of Quanmaogua’s saddle, which remains in China.\\n\\nAll six horse reliefs—two at the Penn Museum and four at the Beilin Museum—have been broken and reassembled to varying degrees. Sadly, not one survives intact.\",\"shortText\":\"During its removal and dispersal, the relief was broken into several pieces. They have since been reassembled, but the fractures running through the stone can never be erased.\"},\"img\":\"$undefined\",\"position\":[11.665,7.75,0.991],\"cameraPose\":{\"position\":[8.99,0.268,72.969],\"target\":[10.176,-1.311,2.026]},\"note\":{\"x\":0.923,\"y\":0.098,\"width\":312}},{\"id\":\"pt-6xcff7\",\"title\":\"三花马鬃\",\"text\":\"和猫咪的「三花」不同，这里的三花不是毛色，是造型——把鬃毛修剪、结扎成三簇竖起的花瓣状，象征这匹马身份高贵。\\n\\n昭陵六骏、唐三彩马、章怀太子墓壁画里的马，很多都是三花鬃。\",\"shortText\":\"和猫咪的「三花」不同，这里的三花不是毛色，是造型——把鬃毛修剪、结扎成三簇竖起的花瓣状，象征这匹马身份高贵。\",\"en\":{\"title\":\"The Three-Tufted Mane\",\"text\":\"The “three flowers” here are a hairstyle, not a coat pattern. The mane was trimmed and tied into three upright, petal-like tufts, marking the horse’s high status.\\n\\nYou can see this three-tufted mane on many horses among the Six Steeds of Zhaoling, Tang sancai figures, and the murals in Crown Prince Zhanghuai’s tomb.\",\"shortText\":\"The “three flowers” here are a hairstyle, not a coat pattern. The mane was trimmed and tied into three upright, petal-like tufts, marking the horse’s high status.\"},\"img\":\"$undefined\",\"position\":[-2.979,10.334,1.458],\"cameraPose\":\"$undefined\",\"note\":{\"x\":0.727,\"y\":0.072,\"width\":410}},{\"id\":\"pt-1wk6ed\",\"title\":\"高浮雕\",\"text\":\"和浅浮雕不同，马的形体从石面高高拔起，最厚处近乎悬空，已逼近圆雕。侧转模型翻看，能感受到高浮雕的立体感。\",\"shortText\":\"$undefined\",\"en\":{\"title\":\"High Relief\",\"text\":\"Unlike shallow relief, the horse’s body projects boldly from the stone. At its deepest points it is almost freestanding, approaching sculpture in the round. Turn the model sideways to feel the depth of this high relief.\",\"shortText\":\"$undefined\"},\"img\":\"$undefined\",\"position\":[1.539,5.587,2.072],\"cameraPose\":{\"position\":[49.238,15.434,47.279],\"target\":[-8.635,6.333,7.219]},\"note\":{\"x\":0.372,\"y\":0,\"width\":284}}]}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"唐-昭陵六骏-拳毛騧 · Emperor Taizong Horse Relief, Quanmaogua | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Quanmaogua, one of the six Zhaoling steeds, strides onward despite nine arrows. Name and image commemorate its service to Li Shimin.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/quanmaogua-penn\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/quanmaogua-penn\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/quanmaogua-penn\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"唐-昭陵六骏-拳毛騧 · Emperor Taizong Horse Relief, Quanmaogua | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"Quanmaogua, one of the six Zhaoling steeds, strides onward despite nine arrows. Name and image commemorate its service to Li Shimin.\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:url\",\"content\":\"https://www.wanderingmuseum.org/artifacts/quanmaogua-penn\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://www.wanderingmuseum.org/index/baked/art-quanmaogua-penn-0.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"co
