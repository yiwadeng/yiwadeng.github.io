"$39\",\"$3a\",\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"watermoon-small-met\",\"watermarkStyle\":{\"size\":22},\"status\":\"modeled\",\"dealGroup\":\"statue-sit\",\"title\":{\"zh\":\"明-木雕水月观音\",\"en\":\"Water-Moon Guanyin — New York\"},\"metadata\":{\"period\":{\"zh\":\"明洪武十八年（1385年）\",\"en\":\"Ming dynasty, dated 1385\"},\"dimensions\":{\"zh\":\"76.8 厘米\",\"en\":\"H. 76.8 cm\"},\"materialTechnique\":{\"zh\":\"柳木雕，石膏底彩绘\",\"en\":\"Carved willow wood with gesso and pigment\"},\"collection\":{\"museum\":{\"zh\":\"大都会艺术博物馆\",\"en\":\"The Metropolitan Museum of Art\"},\"city\":{\"zh\":\"纽约\",\"en\":\"New York\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"53.196a, b\",\"url\":\"https://www.metmuseum.org/art/collection/search/42727\"}},\"description\":{\"zh\":\"1385年正月，明洪武十八年。山西洪洞一个叫东安村的村子⁽⁵⁾，村民和僧官辛仲温集资盖了一座「镇路庙」，请来本村的刻木匠人冯孝中和他的儿子，雕了三尊「天衣观音」，保佑全村道路平安，「老幼无灾」⁽¹⁾。她是其中一尊，水月形制。另外两尊，已下落不明⁽¹⁾。\\n不管是尺寸还是工艺，这尊明初的作品，和那些辽宋金时期的精品木雕都有差异⁽⁵⁾。但她来历清晰，封板尚存，上面写着六百多年前全村的祈愿⁽¹⁾。历代至少四次重妆，身上残留的贴金⁽²⁾，都说明在被当作艺术商品卖走之前，她的身份一直是深受村民爱戴的神祇。\\n\",\"en\":\"In the first month of 1385, the eighteenth year of the Ming emperor Hongwu, the people of a village called Dong’an pooled their money to build a small shrine to guard the road. They hired a local woodcarver, Feng Xiaozhong, and his son to carve a set of three “heavenly-robed Guanyin” for it.⁽¹⁾\\n\\nShe is one of the three. Where the other two went, no one knows.⁽¹⁾\\n\\nShe is no treasure from an imperial monastery. She is a village’s prayer. The board on which that prayer was written was once sealed inside a hidden compartment in her back. Six hundred and forty years later, it is still with her, at The Metropolitan Museum of Art in New York.⁽¹,²⁾\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"watermoon-small-met-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"watermoon-small-met-hd.glb\",\"modelLantern\":\"watermoon-small-met-lantern.glb\"},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.035,\"paddingTop\":0,\"modelScale\":0.96,\"modelOffset\":[-0.085,0,0.03],\"artifactLight\":{\"color\":\"#e2c47d\",\"intensity\":0.43,\"position\":[-0.25,0.2999999999999999,0.25],\"rotation\":[-3,33,-10],\"distance\":2.05,\"decay\":2,\"angle\":2.307349925415265,\"penumbra\":0.25},\"caseLight\":{\"color\":\"#c19c52\",\"intensity\":1.0099999999999998,\"position\":[0.065,0.9600000000000001,0.24],\"distance\":3.05,\"decay\":2,\"angle\":1.8964846872172503,\"penumbra\":0.64},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":-1,\"pitch\":6,\"distanceFactor\":1.03,\"centerX\":0.27,\"centerY\":0.01},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":2.55,\"exposure\":1},\"model\":{\"renderMode\":\"standard\"}},\"colorGrade\":{\"saturation\":0.36,\"hue\":-0.1},\"riverImageUrl\":\"/index/river/watermoon-small-met-impostor.png\",\"particleLoader\":true,\"particlePalette\":[{\"color\":[255,220,191],\"weight\":0.54},{\"color\":[252,214,201],\"weight\":0.46}],\"riverTitle\":{\"zh\":\"明-水月观音-纽约\",\"en\":\"Water-Moon Guanyin — New York\"},\"importance\":\"$undefined\",\"watermark\":\"老幼無災\",\"subtitle\":{\"zh\":\"一个村子，为一条路许的愿\",\"en\":\"A village’s prayer for a road\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国山西洪洞（东安村镇路庙，今已不存）\",\"en\":\"Hongtong, Shanxi, China (Dong'an village shrine, no longer extant)\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"明-木雕水月观音\",\"oneLiner\":\"一个村子，为一条路许的愿\",\"period\":\"明洪武十八年（1385年）\",\"size\":\"76.8 厘米\",\"craft\":\"柳木雕，石膏底彩绘\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"53.196a, b\"],[\"入藏年份\",\"1953\"]],\"intro\":[\"1385年正月，明洪武十八年。山西洪洞一个叫东安村的村子⁽⁵⁾，村民和僧官辛仲温集资盖了一座「镇路庙」，请来本村的刻木匠人冯孝中和他的儿子，雕了三尊「天衣观音」，保佑全村道路平安，「老幼无灾」⁽¹⁾。她是其中一尊，水月形制。另外两尊，已下落不明⁽¹⁾。\",\"不管是尺寸还是工艺，这尊明初的作品，和那些辽宋金时期的精品木雕都有差异⁽⁵⁾。但她来历清晰，封板尚存，上面写着六百多年前全村的祈愿⁽¹⁾。历代至少四次重妆，身上残留的贴金⁽²⁾，都说明在被当作艺术商品卖走之前，她的身份一直是深受村民爱戴的神祇。\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。大都会艺术博物馆用“he”，流浪博物馆用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"她是哪一年、怎样离开东安村，又怎样漂洋过海，没有留下任何记录。馆方只写她可能出自山西或河北。⁽¹⁾ 学者瞿炼根据题记和当地碑刻考证，东安村就在今山西洪洞县，离广胜下寺约 3 公里；那座镇路庙，如今已经不在了。⁽⁵⁾\",\"有据可查的故事从1928年开始：她属于纽约的一位私人藏家，借展在大都会，一借就是二十五年。1953年，她被匿名捐给博物馆，以纪念1910至1931年任馆长的爱德华·罗宾逊（Edward Robinson）。⁽¹,⁴⁾\"],\"items\":[{\"at\":\"1385年正月\",\"text\":\"东安村村民与辛仲溫等集资起盖镇路庙，请本村刻木匠人冯孝中父子雕「天衣观音三位一堂」，本尊为其一。题记封入她背后的暗格。⁽¹⁾\"},{\"at\":\"此后数百年\",\"text\":\"在庙中受供奉，至少重新上彩四次，后来又髹漆、反复贴金。⁽²⁾\"},{\"at\":\"1928年以前\",\"text\":\"离开中国。经手人、时间、路线均无记录。⁽¹⁾\"},{\"at\":\"约1928年起\",\"text\":\"归纽约私人收藏，借展于大都会艺术博物馆。⁽¹⁾\"},{\"at\":\"1953年\",\"text\":\"匿名捐赠给大都会，纪念前馆长爱德华·罗宾逊。馆藏号 53.196a, b。⁽¹,⁴⁾\"},{\"at\":\"今天\",\"text\":\"陈列于大都会艺术博物馆208展厅。⁽³⁾\"}]},\"refs\":[\"大都会艺术博物馆：《Bodhisattva Avalokiteshvara in Water Moon Form (Shuiyue Guanyin)》，53.196a, b。本件馆方著录：断代（dated 1385）、尺寸、材质（柳木、石膏底、残留颜料）、背后封板题记的录文、拼音与英译（含馆方补出的「老幼無災」等残字）、装藏暗格说明、可能出自山西或河北，以及来源记录（约1928—1953年纽约私人收藏、1928年起借展于大都会、1953年匿名捐赠纪念 Edward Robinson）。 https://www.metmuseum.org/art/collection/search/42727\",\"Denise Patry Leidy、Donna Strahan：《Wisdom Embodied: Chinese Buddhist and Daoist Sculpture in The Metropolitan Museum of Art》，大都会艺术博物馆，2010年。cat. 36（第146—148页）：一木雕成、背后浅暗格、题记为馆藏少见的确切纪年、碳十四测年1310—1440年、冠中化佛、山石座、额心小孔、嵌珠眼睛（X光）、前臂榫孔、冠饰孔与铁钉、风格分析；第211—213页：白色高岭土底层与原始配色（橙粉肌肤、靛蓝头发与飘带、朱红裙），及至少四次重彩、髹漆贴金；第37—38页：大型木雕观音皆用柳木、柳枝为观音持物的提问；第221页：柳木鉴定。 https://archive.org/details/WisdomEmbodiedChineseBuddhistandDaoistSculptureinTheMetropolitanMuseumofArt\",\"大都会艺术博物馆开放数据接口（Open Access API）：object 42727。用于当前展厅（Gallery 208）及馆方图片编号（DP170180 本体、DP170181 题记封板）。 https://collectionapi.metmuseum.org/public/collection/v1/objects/42727\",\"Wikipedia：《Edward Robinson (curator)》。用于 Edward Robinson 1910—1931年任大都会馆长。 https://en.wikipedia.org/wiki/Edward_Robinson_(curator)\",\"瞿炼：《晋南“汾河木雕”与“朱好古画派”壁画是否相互影响竞争？》，原载《故宫博物院院刊》，澎湃新闻 2017-03-12 转载。作者从装藏墨书与当地碑刻入手，考证纳尔逊菩萨立像「来自今洪洞县广胜寺镇石桥村北的泰云寺，距广胜下寺 8 公里」，泰云寺至今尚存，1936 年梁思成曾调查该寺，记录未能保存；大都会观音坐像「来自洪洞县境内今东安村的一座『镇路庙』（今已不存）」，距广胜下寺和泰云寺各约 3 公里，并评其「竭力模仿早期作品」而技法「明显退步」。https://www.thepaper.cn/newsDetail_forward_1628072\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Water-Moon Guanyin — New York\",\"oneLiner\":\"A village’s prayer for a road\",\"period\":\"Ming dynasty, dated 1385\",\"size\":\"H. 76.8 cm\",\"craft\":\"Carved willow wood with gesso and pigment\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"53.196a, b\"],[\"Acquired\",\"1953\"]],\"intro\":[\"In the first month of 1385, the eighteenth year of the Ming emperor Hongwu, the people of a village called Dong’an pooled their money to build a small shrine to guard the road. They hired a local woodcarver, Feng Xiaozhong, and his son to carve a set of three “heavenly-robed Guanyin” for it.⁽¹⁾\",\"She is one of the three. Where the other two went, no one knows.⁽¹⁾\",\"She is no treasure from an imperial monastery. She is a village’s prayer. The board on which that prayer was written was once sealed inside a hidden compartment in her back. Six hundred and forty years later, it is still with her, at The Metropolitan Museum of Art in New York.⁽¹,²⁾\"],\"about\":{\"title\":\"\",\"paras\":[{\"h\":\"A letter hidden in her back\",\"sub\":\"$undefined\"},\"A shallow cavity was carved into her back to hold consecrated deposits, such as sutra scrolls or jewels. It is empty now. On the inside of the board that sealed it are eight lines in ink, with a large character at the top, 上 (“up”), to show which way it went in.⁽¹,²⁾\",\"The inscription, as transcribed by the museum: 東安村眾村人等與維那辛仲溫等／謹發虔心起蓋鎮路廟一座請到／本村刊木侍詔馮孝中并男馮／俻工細刊／天衣觀音三位一堂／為願本村通……吉祥／合家樂安……災／洪武十八年正月……⁽¹⁾\",\"In plain words: the people of Dong’an village, led by Xin Zhongwen and others, sincerely vowed to build a temple to guard the road. They invited Feng Xiaozhong, a woodcarver of their own village, and his son to carve with care three heavenly-robed Guanyin for a single hall. May the whole village be blessed, every household at peace, young and old free from harm.⁽¹⁾\",{\"h\":\"Guanyin of ordinary people\",\"sub\":\"$undefined\"},\"No emperor stands behind this Guanyin, no famous monastery. Villagers paid for her so that a road would be safe, and a father and son from the same village carved her. Their names are in the inscription.⁽¹⁾\",\"Among the Met’s Chinese wood sculptures, very few can be dated so precisely, or tell us who made them and for whom. Radiocarbon testing of the wood gave a range of 1310 to 1440, in line with the inscription.⁽²⁾\",\"Apart from one forearm, she and her rocky seat were carved from a single block of willow. Willow branches are one of Guanyin’s attributes, and the researchers noticed that every large wooden Guanyin in the Met’s collection is willow. They raised a question: was the choice of wood deliberate?⁽²⁾\",{\"h\":\"Her original colors\",\"sub\":\"$undefined\"},\"The chalky white you see today is not how she first looked. It is the white ground beneath the paint.⁽²⁾\",\"Originally her skin was an orange-pink, her hair and long scarf indigo, her skirt vermilion. A red skirt with a blue scarf was an old color scheme.⁽²⁾\",\"Later she was repainted at least four times, each time in new colors, then lacquered and gilded again and again. Every repainting means someone was still worshipping her. The scattered flecks of red on her surface are traces of those older paints.⁽²⁾\",{\"h\":\"Looking closer\",\"sub\":\"$undefined\"},\"Her right knee is raised, her right hand resting loosely on it, and her left leg is folded on the seat. She sits on a pierced rock that stands for Potalaka, Guanyin’s home in the sea. Seated at ease on a rock by the water: this is the Water-Moon Guanyin.⁽²⁾\",\"A small seated Buddha Amitabha in the center of her tall crown identifies her as Guanyin. A small hole in the middle of her forehead probably once held a jewel. Her eyes are inlaid beads of black stone or glass, and X-rays show that each eye was drilled through.⁽²⁾\",\"One forearm was carved separately and attached with a dowel. Only a round hole remains, and the arm is lost. A pair of oval holes at the back of the crown and a stub of iron nail at its side once held ornaments.⁽²⁾\",\"Her oval face, high cheekbones, and pursed lips carry the Indo-Himalayan style that grew popular from the Yuan dynasty on. The heavy scarf falling from her left shoulder and knotted at her side belongs to an older Chinese tradition of line. Both traditions meet in her.⁽²⁾\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"\",\"paras\":[\"No record tells when or how she left Dong’an, or how she crossed the ocean. The museum says only that she probably comes from Shanxi or Hebei Province.⁽¹⁾\",\"Her documented story begins in 1928, when she belonged to a private collector in New York and was lent to the Met, where she stayed on loan for twenty-five years. In 1953 she was given to the museum anonymously, in memory of Edward Robinson, the Met’s director from 1910 to 1931.⁽¹,⁴⁾\"],\"items\":[{\"at\":\"1385, first lunar month\",\"text\":\"The villagers of Dong’an, with Xin Zhongwen and others, fund a temple to guard the road and commission the local woodcarver Feng Xiaozhong and his son to carve three heavenly-robed Guanyin. This is one of them. The inscription is sealed inside her back.⁽¹⁾\"},{\"at\":\"The following centuries\",\"text\":\"Worshipped in the temple, she is repainted at least four times, then lacquered and repeatedly gilded.⁽²⁾\"},{\"at\":\"Before 1928\",\"text\":\"She leaves China. Who handled her, when, and by what route is unrecorded.⁽¹⁾\"},{\"at\":\"About 1928\",\"text\":\"In a private collection in New York, on loan to The Metropolitan Museum of Art.⁽¹⁾\"},{\"at\":\"1953\",\"text\":\"Anonymous gift to the Met in memory of its former director Edward Robinson. Accession number 53.196a, b.⁽¹,⁴⁾\"},{\"at\":\"Today\",\"text\":\"On view in Gallery 208 at The Metropolitan Museum of Art.⁽³⁾\"}]},\"refs\":[\"大都会艺术博物馆：《Bodhisattva Avalokiteshvara in Water Moon Form (Shuiyue Guanyin)》，53.196a, b。本件馆方著录：断代（dated 1385）、尺寸、材质（柳木、石膏底、残留颜料）、背后封板题记的录文、拼音与英译（含馆方补出的「老幼無災」等残字）、装藏暗格说明、可能出自山西或河北，以及来源记录（约1928—1953年纽约私人收藏、1928年起借展于大都会、1953年匿名捐赠纪念 Edward Robinson）。 https://www.metmuseum.org/art/collection/search/42727\",\"Denise Patry Leidy、Donna Strahan：《Wisdom Embodied: Chinese Buddhist and Daoist Sculpture in The Metropolitan Museum of Art》，大都会艺术博物馆，2010年。cat. 36（第146—148页）：一木雕成、背后浅暗格、题记为馆藏少见的确切纪年、碳十四测年1310—1440年、冠中化佛、山石座、额心小孔、嵌珠眼睛（X光）、前臂榫孔、冠饰孔与铁钉、风格分析；第211—213页：白色高岭土底层与原始配色（橙粉肌肤、靛蓝头发与飘带、朱红裙），及至少四次重彩、髹漆贴金；第37—38页：大型木雕观音皆用柳木、柳枝为观音持物的提问；第221页：柳木鉴定。 https://archive.org/details/WisdomEmbodiedChineseBuddhistandDaoistSculptureinTheMetropolitanMuseumofArt\",\"大都会艺术博物馆开放数据接口（Open Access API）：object 42727。用于当前展厅（Gallery 208）及馆方图片编号（DP170180 本体、DP170181 题记封板）。 https://collectionapi.metmuseum.org/public/collection/v1/objects/42727\",\"Wikipedia：《Edward Robinson (curator)》。用于 Edward Robinson 1910—1931年任大都会馆长。 https://en.wikipedia.org/wiki/Edward_Robinson_(curator)\",\"瞿炼：《晋南“汾河木雕”与“朱好古画派”壁画是否相互影响竞争？》，原载《故宫博物院院刊》，澎湃新闻 2017-03-12 转载。作者从装藏墨书与当地碑刻入手，考证纳尔逊菩萨立像「来自今洪洞县广胜寺镇石桥村北的泰云寺，距广胜下寺 8 公里」，泰云寺至今尚存，1936 年梁思成曾调查该寺，记录未能保存；大都会观音坐像「来自洪洞县境内今东安村的一座『镇路庙』（今已不存）」，距广胜下寺和泰云寺各约 3 公里，并评其「竭力模仿早期作品」而技法「明显退步」。https://www.thepaper.cn/newsDetail_forward_1628072\"]}},\"unplacedLookPoints\":[],\"lookPoints\":[{\"id\":\"pt-smallmet-2\",\"title\":\"地仗\",\"text\":\"木雕上彩之前，先在木胎上刮一层白底（地仗），磨平再彩绘或贴金。她的地仗是白色高岭土，用胶调和⁽²⁾。记载原本她是橙粉色的肌肤、靛蓝的头发和飘带、朱红的裙子⁽²⁾。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[0.069,0.442,-0.021],\"cameraPose\":{\"position\":[-1.187,0.736,2.489],\"target\":[0.178,0.293,-0.137]},\"note\":{\"x\":0.7,\"y\":0.339,\"width\":376}},{\"id\":\"pt-smallmet-3\",\"title\":\"山石\",\"text\":\"山石是水月观音形制特色之一，代表观音在海上的道场普陀洛迦山。造像连同山石，是用一整块柳木雕成的⁽²⁾。柳枝本是观音手中之物，图录推测，柳木是刻意的选择。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[0.278,-0.578,0.517],\"cameraPose\":{\"position\":[1.851,-0.463,2.851],\"target\":[0.387,-0.457,0.062]},\"note\":{\"x\":0.825,\"y\":0.21,\"width\":359}},{\"id\":\"pt-smallmet-1\",\"title\":\"贴金\",\"text\":\"据大都会官方图录分析显示，她至少重妆过四次，“全身髹漆、反复贴金”。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[-0.279,0.034,-0.235],\"cameraPose\":{\"position\":[-1.974,-0.253,-2.041],\"target\":[0.112,0.159,-0.153]},\"note\":{\"x\":0.765,\"y\":0.333,\"width\":444}},{\"id\":\"pt-smallmet-4\",\"title\":\"封板\",\"text\":\"很多木雕观音的封板都遗失了，后背或者后脑勺留下洞窟。但此尊封板仍存，内侧墨书八行：「东安村众村人等与维那辛仲温等，谨发虔心，起盖镇路庙一座……天衣观音三位一堂。为愿本村……吉祥，合家乐安，老幼无灾。洪武十八年正月……」⁽¹⁾木板顶上还写着一个「上」字，标着方向。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":{\"src\":\"/images/editorial/watermoon-small-met-inscription.webp\",\"cap\":\"封板内侧的墨书题记 · 大都会艺术博物馆藏\",\"place\":\"$undefined\",\"size\":\"$undefined\"},\"position\":[0.333,0.268,-0.327],\"cameraPose\":{\"position\":[2.721,0.978,-2.562],\"target\":[0.055,0.027,-0.22]},\"note\":{\"x\":0.641,\"y\":0.177,\"width\":353}}]}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"明-木雕水月观音 · Water-Moon Guanyin — New York | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"conte
