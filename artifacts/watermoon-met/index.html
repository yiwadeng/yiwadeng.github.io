",\"url\":\"https://www.metmuseum.org/art/collection/search/42731\"}},\"description\":{\"zh\":\"这尊水月观音雕于辽代，由几块柳木拼接而成。⁽⁴⁾ 姿态舒展，神韵俱佳，手和足的造型尤其美。她原本有彩绘，但 20 世纪初，很多古董商为了迎合西方源于大理石雕塑审美的「白色偏好」，让大量木雕遭遇「酸洗」，露出木胎本色。1928 年她进入大都会时，身上的颜料已被清掉大半。⁽³⁾\\n\\n她背后暗格的封板内侧，据考原本可能嵌着一面镜子，镜面朝里，照向她的身体。⁽²,⁴⁾这面镜子具体的作用不详，如果你知道请留言告诉大家吧。\",\"en\":\"Carved in the eleventh century under the Liao dynasty, she is nearly 1.2 metres tall. Three large blocks of willow make up her body: one for the head and torso, one for each leg. Her hands and most of her arms, and the rocky armrest at her right, were added much later.⁽²⁾\\n\\nTwo sealed chambers hide inside her, one in the head and one in the back. The inner face of the back cover holds a round hollow, about 12 cm across, where a mirror once sat — turned inward, facing the front of her body. The mirror is gone.⁽²⁾\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"/local-models/watermoon-met-tem.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"/local-models/watermoon-met-tem.glb\"},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":true,\"amplitude\":0.02,\"period\":4.99},\"rotate\":{\"enabled\":false,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":0,\"pitch\":6,\"distanceFactor\":1.18,\"centerX\":0.27,\"centerY\":-0.07},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":1.6,\"exposure\":0.85},\"model\":{\"renderMode\":\"standard\"}},\"particleLoader\":true,\"particlePalette\":[{\"color\":[240,214,178],\"weight\":0.5},{\"color\":[214,180,138],\"weight\":0.5}],\"riverTitle\":{\"zh\":\"辽-木雕水月观音-纽约\",\"en\":\"Water-Moon Guanyin — New York\"},\"importance\":\"$undefined\",\"watermark\":\"鏡花水月\",\"subtitle\":{\"zh\":\"一月普现一切水，一切水月一月摄\",\"en\":\"A mirror sealed in her back, facing inward.\"},\"riverLead\":{\"zh\":\"一月普现一切水，一切水月一月摄\",\"en\":\"A mirror sealed in her back, facing inward.\"},\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国山西南部（推测）\",\"en\":\"Probably Shanxi, China\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"辽-柳木雕水月观音\",\"oneLiner\":\"一月普现一切水，一切水月一月摄\",\"period\":\"辽（11世纪）\",\"size\":\"118.1 × 95.3 × 71.1 厘米\",\"craft\":\"柳木雕，多木拼合，残留彩绘\",\"location\":\"美国 · 纽约 · 大都会艺术博物馆\",\"acc\":[[\"馆藏编号\",\"28.56\"],[\"入藏年份\",\"1928\"]],\"intro\":[\"这尊水月观音雕于辽代，由几块柳木拼接而成。⁽⁴⁾ 姿态舒展，神韵俱佳，手和足的造型尤其美。她原本有彩绘，但 20 世纪初，很多古董商为了迎合西方源于大理石雕塑审美的「白色偏好」，让大量木雕遭遇「酸洗」，露出木胎本色。1928 年她进入大都会时，身上的颜料已被清掉大半。⁽³⁾\",\"她背后暗格的封板内侧，据考原本可能嵌着一面镜子，镜面朝里，照向她的身体。⁽²,⁴⁾这面镜子具体的作用不详，如果你知道请留言告诉大家吧。\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。大都会艺术博物馆用“he”，流浪博物馆用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"她出自哪座寺庙，没有记录。1928 年大都会的馆刊说，她属于从山西南部流出的那一类木雕。⁽³⁾\",\"1922 年，日本的山中商会在北京买下她，转手卖给日本收藏家松方幸次郎。六年后，她从松方的收藏中散出，被大都会买下。⁽³⁾ 当年的策展人 Alan Priest 在馆刊里写道：近几年从中国流出的众多木雕里，这一尊最为华美。⁽³⁾\",{\"img\":\"/images/editorial/watermoon-met-bulletin-1928.webp\",\"cap\":\"1928 年 6 月大都会馆刊第 157 页刊出的照片，图注还写着「晚唐」。⁽³⁾\",\"compact\":\"$undefined\"},\"早年日本出版的图录里，她还坐在一块山石底座上；到 1928 年入馆时，这块底座已经不在了，如今不知去向。⁽²,³⁾\"],\"items\":[{\"at\":\"辽代，约11世纪\",\"text\":\"在中国北方雕成。中心木块的碳十四测年为公元 1020—1210 年。⁽²⁾\"},{\"at\":\"1922年\",\"text\":\"山中商会在北京购得，随后转卖给日本收藏家松方幸次郎。⁽³⁾\"},{\"at\":\"1928年\",\"text\":\"从松方收藏中散出，大都会以 Fletcher 基金购藏，馆藏号 28.56。⁽¹,³⁾\"},{\"at\":\"1928年6月\",\"text\":\"大都会馆刊撰文介绍她，当时把她断为晚唐。⁽³⁾\"},{\"at\":\"2010年\",\"text\":\"大都会图录发表技术研究：三块主木拼合、双手为后配、背后封板曾嵌一面镜子。⁽²⁾\"},{\"at\":\"今天\",\"text\":\"陈列于大都会艺术博物馆 208 展厅。⁽¹⁾\"}]},\"refs\":[\"大都会艺术博物馆：《Bodhisattva Avalokiteshvara in Water Moon Form (Shuiyue Guanyin)》，28.56。用来支撑辽代 11 世纪断代、尺寸、柳木多木拼合、Fletcher Fund 1928 购藏、现展于 208 展厅。https://www.metmuseum.org/art/collection/search/42731\",\"Denise Patry Leidy、Donna Strahan：《Wisdom Embodied: Chinese Buddhist and Daoist Sculpture in The Metropolitan Museum of Art》，大都会艺术博物馆，2010 年。cat. 24（第 116—119 页）：三大块柳木拼合、双手与大半截手臂为后配、右侧山石靠垫为近代添加、曾有山石底座、头部与背部两处装藏暗格、背部封板内侧圆形凹槽原嵌一面镜子（镜面朝向身体正面）、中心木块碳十四测年公元 1020—1210 年、冠饰化佛与方片腰带、来源山中商会。https://archive.org/details/WisdomEmbodiedChineseBuddhistandDaoistSculptureinTheMetropolitanMuseumofArt\",\"Alan Priest：《Chinese Wood Sculpture》，*Bulletin of the Metropolitan Museum of Art* 23, no. 6（1928 年 6 月），第 156—158 页。用来支撑「属山西南部一类」、1922 年山中商会在北京购得、转售松方幸次郎、自其收藏散出，以及「近几年从中国流出的众多木雕里，这一尊最为华美」的评价。https://archive.org/details/sim_metropolitan-museum-of-art-new-york-bulletin_1928-06_23_6\",\"Donna K. Strahan：《Chinese Religious Sculpture》，大都会艺术博物馆文章，2022 年 8 月。用来支撑：X 光显示头和躯干为一大块木料、双腿另为一大块、头顶另接小块；两臂自肘上至指尖与双脚脚趾均为后补；躯干暗格入馆前已被打开、内空；封板内侧的圆形凹槽可能嵌过一面铜镜，镜面朝向体腔；镜子在中国文化中常被视为护身辟邪之物。https://www.metmuseum.org/zh/essays/chinese-religious-sculpture\",\"标题下引句「一月普现一切水，一切水月一月摄」出自唐代永嘉玄觉禅师《永嘉证道歌》：「一性圆通一切性，一法遍含一切法。一月普现一切水，一切水月一月摄。」\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Water-Moon Guanyin — New York\",\"oneLiner\":\"A mirror sealed in her back, facing inward.\",\"period\":\"Liao dynasty, 11th century\",\"size\":\"H. 118.1 cm\",\"craft\":\"Willow wood, multiple-block construction, traces of pigment\",\"location\":\"United States, New York, The Metropolitan Museum of Art\",\"acc\":[[\"Accession no.\",\"28.56\"],[\"Acquired\",\"1928\"]],\"intro\":[\"Carved in the eleventh century under the Liao dynasty, she is nearly 1.2 metres tall. Three large blocks of willow make up her body: one for the head and torso, one for each leg. Her hands and most of her arms, and the rocky armrest at her right, were added much later.⁽²⁾\",\"Two sealed chambers hide inside her, one in the head and one in the back. The inner face of the back cover holds a round hollow, about 12 cm across, where a mirror once sat — turned inward, facing the front of her body. The mirror is gone.⁽²⁾\"],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大都会艺术博物馆：《Bodhisattva Avalokiteshvara in Water Moon Form (Shuiyue Guanyin)》，28.56。用来支撑辽代 11 世纪断代、尺寸、柳木多木拼合、Fletcher Fund 1928 购藏、现展于 208 展厅。https://www.metmuseum.org/art/collection/search
