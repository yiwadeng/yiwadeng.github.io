\",\"$14\",\"$15\",\"$16\",\"$39\",\"$3a\",\"$3b\"],\"default\"]\n2a:[\"$\",\"$34\",null,{\"fallback\":null,\"children\":[\"$\",\"$L3c\",null,{\"artifact\":{\"slug\":\"watermoon-pma\",\"status\":\"modeled\",\"dealGroup\":\"statue-sit\",\"seriesSlugs\":[\"watermoon\"],\"preloadHd\":true,\"title\":{\"zh\":\"元-木雕水月观音\",\"en\":\"Water-Moon Guanyin — Philadelphia, Museum of Art\"},\"subtitle\":{\"zh\":\"千江有水千江月，万里无云万里天\",\"en\":\"One knee raised, she watches the tide come in.\"},\"typeLabel\":{\"zh\":\"木雕佛教造像\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"元（13至14世纪）\",\"en\":\"Yuan dynasty, 13th–14th century\"},\"dimensions\":{\"zh\":\"124.5 × 81.3 × 50.8 厘米\",\"en\":\"H. 124.5 cm\"},\"materialTechnique\":{\"zh\":\"木雕彩绘贴金\",\"en\":\"Carved wood with traces of paint and gilding\"},\"collection\":{\"museum\":{\"zh\":\"费城艺术博物馆\",\"en\":\"Philadelphia Museum of Art\"},\"city\":{\"zh\":\"费城\",\"en\":\"Philadelphia\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"1925-53-11\",\"url\":\"https://www.philamuseum.org/objects/41538\"}},\"description\":{\"zh\":\"这尊木雕水月观音成于元代，距离水月观音的技艺鼎盛时期——辽宋金，已经过去了一段时间。和海外博物馆大多数水月观音来自山西晋南不同，馆方旧档案说她来自河南的一座观音堂。⁽⁴⁾她原本通身彩绘贴金，如今只剩零星残迹，大半露出了木胎本色。一百年前，不少造像在古董商手里被剥去彩绘，以迎合西方买家对「雕塑无色」的印象，她很可能也是其中之一。⁽¹³⁾\",\"en\":\"Carved in China during the Yuan dynasty, this wooden Guanyin entered the Philadelphia Museum of Art in 1925 and is still on view there. The museum’s records give her origin in a single word: Guanyintang, “Guanyin Hall” — perhaps a place name, perhaps simply a temple hall.⁽¹⁾\\n\\nShe sits at ease, one knee raised, an arm draped loosely over it.⁽²⁾ Around the back is a rectangular opening. Sacred materials would have been sealed inside to bring the wood to life as a deity.⁽¹⁾ What it once held, and where those things went, no record says.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"watermoon-pma-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"breathe\",\"assets\":{\"modelHd\":\"watermoon-pma-hd.glb\",\"modelLantern\":\"watermoon-pma-lantern.glb\"},\"lanternConfig\":{\"caseType\":\"midTall\",\"mount\":\"pedestal\",\"caseFootprint\":0.7,\"paddingSide\":0.05,\"paddingTop\":0.28,\"modelScale\":1.06,\"modelOffset\":[0,0,0],\"artifactLight\":{\"color\":\"#fff0d5\",\"intensity\":12,\"position\":[-0.2,1.9,1.1],\"rotation\":[0,0,0],\"distance\":4.5,\"decay\":2,\"angle\":1.3037856055185257,\"penumbra\":1},\"caseLight\":{\"color\":\"#ffcc88\",\"intensity\":0.12,\"position\":[0.1,0.8350000000000001,0],\"distance\":2.4499999999999997,\"decay\":2,\"angle\":1.0471975511965976,\"penumbra\":1},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#e29d36\",\"strength\":0.5,\"edgeWidth\":0.008,\"lengthFade\":0.5,\"bottomStrength\":1.5},\"bestFaceYaw\":1,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":180,\"fullRotation\":true,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.5}}},\"section1\":{\"stagePose\":{\"yaw\":-38,\"pitch\":1,\"distanceFactor\":0.86,\"centerX\":0.39,\"centerY\":-0.02},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":0.85,\"exposure\":1}},\"riverImageUrl\":\"/index/river/watermoon-pma-impostor.png\",\"particleLoader\":true,\"particlePalette\":[{\"color\":[255,203,150],\"weight\":0.25},{\"color\":[198,154,114],\"weight\":0.5},{\"color\":[134,104,77],\"weight\":0.25}],\"riverTitle\":{\"zh\":\"元-木雕水月观音-费城\",\"en\":\"Water-Moon Guanyin — Philadelphia, Museum of Art\"},\"importance\":\"$undefined\",\"watermark\":\"水中月\",\"riverLead\":{\"zh\":\"千江映月，万缘皆空\",\"en\":\"One knee raised, she watches the tide come in.\"},\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国河南\",\"en\":\"Guanyintang, China (per museum record)\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"元-木雕水月观音\",\"oneLiner\":\"千江有水千江月，万里无云万里天\",\"period\":\"元（13至14世纪）\",\"size\":\"124.5 × 81.3 × 50.8 厘米\",\"craft\":\"木雕彩绘贴金\",\"location\":\"美国 · 费城 · 费城艺术博物馆\",\"acc\":[[\"馆藏编号\",\"1925-53-11\"],[\"入藏年份\",\"1925\"]],\"intro\":[\"这尊木雕水月观音成于元代，距离水月观音的技艺鼎盛时期——辽宋金，已经过去了一段时间。和海外博物馆大多数水月观音来自山西晋南不同，馆方旧档案说她来自河南的一座观音堂。⁽⁴⁾她原本通身彩绘贴金，如今只剩零星残迹，大半露出了木胎本色。一百年前，不少造像在古董商手里被剥去彩绘，以迎合西方买家对「雕塑无色」的印象，她很可能也是其中之一。⁽¹³⁾\"],\"about\":{\"title\":\"何为水月\",\"paras\":[{\"h\":\"起源\",\"sub\":\"$undefined\"},\"观音来自印度，但水月观音却是中国本土长出来的形制。相传唐朝画家周昉“妙创水月之体”，在长安胜光寺画下第一尊水月观音。虽然原作早已散佚。\\n但他所创的水、月、竹、石样式，延续了千年。\",{\"img\":\"/images/editorial/watermoon-zhoufang-zanhua.webp\",\"cap\":\"  唐　周昉《簪花仕女图》　辽宁省博物馆藏\",\"compact\":\"$undefined\"},{\"h\":\"水月观音什么样子？\",\"sub\":\"$undefined\"},\"水月所诞生的唐朝，正处于观音由男转女的过渡阶段，水月观音多为男身女相。身型仍然是男子，袒露上身，肩披天衣，体魄健美。然而脸庞已经有了女相，轮廓柔美，神态娴雅，仿佛画师们笔下的宫廷贵妇。费城艺术博物馆用“he”，流浪博物馆用“她”，都不完全准确，水月观音，是超越了男女二元对立的存在。\",\"佛像通常衣着俭朴，但菩萨和观音往往衣饰华美，是历代名匠大显身手的炫技之所。可伴随文物模型观看，她们梳高髻、戴宝冠，宝冠正中有一尊小小的佛像，是她的老师阿弥陀佛，称“化佛”（多已遗失）。耳边垂下两缕发丝，眉间白毫常镶嵌宝石。胸前佩挂璎珞，手臂戴着钏环。素手赤足，脸颊丰润，小腹放松而优雅地微微隆起，端庄中带着恣意，神性中可见亲和，大异于清朝后的审美。\",\"白居易《画水月菩萨赞》：净渌水上，虚白光中。一睹其相，万缘皆空\",\"水月观音的坐姿叫自在坐，又叫王者坐，其名来自印度王室，是一种高贵而放松的姿态。玄奘法师认为，Avalokiteśvara 译作「观音」并不够准确，遂将其重译为「观自在」，更贴近其本义⁽⁹⁾。但自在坐的菩萨并非都是水月观音，水月观音通常手势不结印，亦不持物，只是随意的搭在支起的膝上。一只脚踏在莲花上，便有了水波之意。不坐于莲台，而是坐在岩石上，代表了观音的道场普陀洛迦山（后来中国人把它落实成浙江的普陀山）。如果是画作或石刻，还常有竹林和满月，凑齐 水、月、竹、岩、莲，非常的东方意境。四川安岳毗卢洞北宋的紫竹观音石刻，便是水月形制的代表。\\n（插播一个有趣的冷知识：普陀洛迦山梵文Potalaka，和布达拉宫是同一个词。浙江舟山的小岛，和西藏的布达拉宫，竟然指同一个地方）\",{\"h\":\"“水月”其意\",\"sub\":\"$undefined\"},\"关于\\\"水月\\\"的来历，说法很多，这里先讲一个开发者自己最喜欢的出处。\",\"《大智度论》卷六用十个比喻说明世间一切皆空，如幻、如焰、如水中月、如虚空、如响、如犍闼婆城、如梦、如影、如镜中像、如化。\",\"\u003e 「如水中月」者，月实在虚空中，影现于水；实法相月在如、法性、实际虚空中，而凡天人心水中有我、我所相现。以是故名「如水中月」。复次，如小儿见水中月，欢喜欲取，大人见之则笑。无智人亦如是，身见故见有吾我；无实智故，见种种法；见已欢喜，欲取诸相：男相、女相等；诸得道圣人笑之。…复次，譬如静水中见月影，搅水则不见。\",\"月亮在天上，水里的月是人心中的影子。小孩子见了水里的月亮，便想伸手抓住，大人看见了就笑。世人也把心中所映射的影子当真实的去抓，男相、女相、欲望、身份等，更有智慧的存在见了也会发笑吧。\",\"影子静静的澄于水面，搅动就消失不见了。\",\"但“皆空”并非消极，幻影并不代表一无所有。宋代禅宗有句：「千江有水千江月，万里无云万里天。」不是没有，而是处处可有。 只要有静水，便可拥有一片月。水月观音其物，远在海外天边，故人不可得见。但是水月观音其神——网站上的3D模型，虽然也是幻影，却可以让从未见过的人能看到、了解附着其身的文化和历史。也许流浪博物馆里的水月模型们，本身就是水中之月，这个角度看，也是非常有趣。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"她来到费城，靠的是三个互不相识的人⁽⁵⁾。George Crofts 是常驻天津的英国商人，做古玩生意，负责在中国搜罗⁽⁸,⁹⁾；多伦多皇家安大略博物馆馆长 Currelly 原本是他的大买家，这次同意把货源分给费城⁽⁵,⁹⁾；费城出版商 Charles H. Ludington 掏钱，把东西捐给博物馆⁽⁵⁾。1923 年的馆刊这样形容这桩合作：「三个人的慷慨，彼此互不相识。」⁽⁵⁾\",\"Crofts 在 1924 到 1925 年之间的那个冬天去世。馆刊记下，这一年东方部的新藏品，都是在他生前和他一起挑定的⁽⁷⁾。至于她是怎样离开「观音堂」、又怎样落到 Crofts 手里，目前公开的资料里找不到。馆方旧档曾写她来自河南⁽⁴⁾，如今只留下「观音堂」三个字⁽¹⁾。\"],\"items\":[{\"at\":\"元代（1271–1368）\",\"text\":\"在中国雕成。馆方旧档记她来自河南「观音堂」，今天的档案只写「观音堂」⁽¹,⁴⁾。\"},{\"at\":\"1896 年\",\"text\":\"伦敦人 George Crofts 来到中国，此后多年在天津收藏、买卖古物⁽⁸⁾。\"},{\"at\":\"1923 年秋\",\"text\":\"费城博物馆的 Horace Jayne 与 Langdon Warner 在北京和 Crofts 几番商量，一起挑定了第二批藏品；随后两人动身去了敦煌⁽⁶⁾。\"},{\"at\":\"1923 年 11 月\",\"text\":\"宾夕法尼亚博物馆（费城艺术博物馆前身）宣布收到第一批 Crofts 收藏：多伦多让出货源，Ludington 出钱⁽⁵⁾。\"},{\"at\":\"1925 年\",\"text\":\"Crofts 已在前一个冬天去世⁽⁷⁾。这尊观音以「George Crofts 收藏」之名，由 Ludington 捐赠入藏，馆藏号 1925-53-11⁽¹⁾。\"},{\"at\":\"今天\",\"text\":\"在费城艺术博物馆 339 展厅展出，与智化寺藻井同处一室⁽¹,¹¹⁾。\"}]},\"refs\":[\"费城艺术博物馆：《Guanyin Seated in Royal Ease》，1925-53-11。用来支撑馆名、元代断代、尺寸、黄木材质与残彩贴金、捐赠署名（Gift of Charles H. Ludington from the George Crofts Collection, 1925）、产地字段「Guanyintang」、现展于 339 展厅，以及展签中背部长方形孔用来装纳圣物、使神像「activate」的说法。https://www.philamuseum.org/objects/41538\",\"费城艺术博物馆：《Seated Guanyin》教育资料 PDF。用来支撑「南海观音」与海边岩崖、自在坐姿、额头圆孔原嵌宝石（象征照亮世间的光）、冠中小阿弥陀佛为识别标志、残存颜料与金箔。https://legacyweb.philamuseum.org/doc_downloads/education/object_resources/41538.pdf\",\"费城艺术博物馆：《Art of China: A Resource for Classroom Teachers》，第 14–15 页。用来支撑自在坐姿、左腿衣褶上的残彩、粗项圈（chunky necklace）。本资料另给出 1287–1368 的断代，正文未采用。https://cdn.sanity.io/files/r7hgx2l2/production/d6d9d1f39fe8ba3f4dd8c3e82541683c8a96c37b.pdf\",\"Internet Archive / Wayback Machine：费城艺术博物馆旧版藏品页存档（2009-07-05、2021-06-21）。用来支撑旧档产地「Kuan Yin Tang, Honan」「Guanyintang, Henan Province」。http://web.archive.org/web/20090705193232/http://www.philamuseum.org/collections/permanent/41538.html ；http://web.archive.org/web/20210621064722/https://philamuseum.org/collection/object/41538\",\"Pennsylvania Museum：《The Crofts Collection》，Pennsylvania Museum Bulletin 第 19 卷第 80 期（1923 年 11 月），第 22–25 页。用来支撑 Crofts、Currelly、Ludington 三方合作，多伦多分享货源、Ludington 出资，及「三个人的慷慨，彼此互不相识」一语（中文为本馆转译）。https://archive.org/details/pennsylvaniamuse80penn\",\"Pennsylvania Museum：《Letters From Mr. Warner and Mr. Jayne》，Pennsylvania Museum Bulletin 第 19 卷第 81 期（1923 年 12 月）。用来支撑 1923 年秋 Jayne 与 Warner 在北京和 Crofts 一起挑选第二批藏品、随后前往敦煌。https://archive.org/details/pennsylvaniamuse81penn\",\"Pennsylvania Museum：《Accessions in the Oriental Department》，Pennsylvania Museum Bulletin 第 21 卷第 99 期（1926 年 1 月），第 68–69 页。用来支撑 Crofts 于 1924–25 年冬去世，以及这一年度东方部新藏品是在他生前与他一同挑定的。https://archive.org/details/pennsylvaniamuse99penn\",\"苏黎世大学 e-aoi「China und der Westen」：《Crofts, George》人物条目（依据 The China Who's Who 1922）。用来支撑 Crofts 生卒年 1871–1925、伦敦人、1896 年来华、在天津收藏与买卖。https://e-aoi.uzh.ch/apps/china-west/entities/23589\",\"皇家安大略博物馆：《China–Canada Untold Stories: The Chinese Art Collection at the ROM》。用来支撑 Crofts 的英国古董商身份，及他与 ROM 馆长 Currelly 的长期供货合作。https://www.rom.on.ca/learn/resources/china-canada-untold-stories-chinese-art-collection-rom\",\"费城艺术博物馆：《Bodhisattva》，1925-53-10。用来支撑同批捐赠的柳木菩萨立像（900–1000 年）同在 339 展厅。https://www.philamuseum.org/objects/41534\",\"费城艺术博物馆：《Coffered Ceiling from Zhihuasi》，1930-38-1a--n。用来支撑智化寺藻井与本像同在 339 展厅。https://www.philamuseum.org/objects/44151\",\"〔唐〕张彦远：《历代名画记》卷十，周昉条（847 年）。用来支撑周昉「妙创水月之体」，说明水月观音样式唐代已有记载。https://zh.wikisource.org/wiki/歷代名畫記/卷第十\",\"John Twilley、Kathleen M. Garland：《The Redecoration History of a Chinese Polychromed Guanyin Attributed to the 11th–12th Century C.E. as Deduced from Stratigraphic Microanalysis》，MRS Online Proceedings Library 1319, article 407（2011）。用来支撑：二十世纪初部分彩绘劣化的造像在艺术市场上被剥除彩绘、露出木胎（stripped to bare wood）。https://doi.org/10.1557/opl.2011.748\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Water-Moon Guanyin — Philadelphia, Museum of Art\",\"oneLiner\":\"One knee raised, she watches the tide come in.\",\"period\":\"Yuan dynasty, 13th–14th century\",\"size\":\"H. 124.5 cm\",\"craft\":\"Carved wood with traces of paint and gilding\",\"location\":\"United States, Philadelphia, Philadelphia Museum of Art\",\"acc\":[[\"Accession no.\",\"1925-53-11\"],[\"Acquired\",\"1925\"]],\"intro\":[\"Carved in China during the Yuan dynasty, this wooden Guanyin entered the Philadelphia Museum of Art in 1925 and is still on view there. The museum’s records give her origin in a single word: Guanyintang, “Guanyin Hall” — perhaps a place name, perhaps simply a temple hall.⁽¹⁾\",\"She sits at ease, one knee raised, an arm draped loosely over it.⁽²⁾ Around the back is a rectangular opening. Sacred materials would have been sealed inside to bring the wood to life as a deity.⁽¹⁾ What it once held, and where those things went, no record says.\"],\"about\":{\"title\":\"\",\"paras\":[{\"h\":\"How to Recognize Her\",\"sub\":\"$undefined\"},\"At the front of her crown sits a tiny Buddha: Amitabha. He is the surest sign that this is Guanyin.⁽²⁾\",\"Now look at the center of her forehead. The small round hole once held a jewel, a symbol of the light Guanyin sheds on the world. The jewel is long gone; only the setting remains.⁽²⁾\",{\"h\":\"Royal Ease\",\"sub\":\"$undefined\"},\"Right knee up, right arm resting on it, left leg hanging down: this relaxed pose is known as “royal ease.”⁽²,³⁾ She is seated on rock. Museum materials describe her on a cliff above the sea, which is why she is also called Guanyin of the South Sea.⁽²⁾\",\"The museum titles her Guanyin Seated in Royal Ease.⁽¹⁾ We call her a Water-Moon Guanyin, after the broader type she belongs to. The type is old: in 847 the Tang writer Zhang Yanyuan credited the painter Zhou Fang with inventing the “water-moon” form.⁽¹²⁾\",{\"h\":\"Once Painted and Gilded\",\"sub\":\"$undefined\"},\"She is carved from yellowwood.⁽¹⁾ Look closely at the folds over her left leg and you can still find traces of pigment and gold leaf.⁽²,³⁾ She was once painted and gilded, with a chunky necklace across her chest.⁽³⁾ Today she has faded almost to the color of bare wood.\",{\"h\":\"The Opening in Her Back\",\"sub\":\"$undefined\"},\"A freshly carved figure was still just wood. Holy materials would be sealed into a cavity like this one to consecrate it — in the museum’s words, to “activate” the deity.⁽¹⁾\",\"What was placed inside this one, and what became of it, the museum does not record.\",{\"h\":\"In the Same Room\",\"sub\":\"$undefined\"},\"Today she sits in Gallery 339 on the museum’s third floor.⁽¹⁾ In the same room is a coffered ceiling from the temple of Zhihuasi.⁽¹¹⁾\",\"Given in the same 1925 gift was a standing Bodhisattva carved from willow (1925-53-10), some three to four centuries older than she is. It stands in this gallery too.⁽¹⁰⁾ The Wandering Museum has modeled it as well — go and find it.\"]},\"loss\":{\"title\":\"Collection and Provenance\",\"note\":\"\",\"paras\":[\"She reached Philadelphia through three men who had never met.⁽⁵⁾ George Crofts, an English merchant based in Tianjin who dealt in antiques, did the buying in China.⁽⁸,⁹⁾ Currelly, director of the Royal Ontario Museum in Toronto and Crofts’s major client, agreed to share his source with Philadelphia.⁽⁵,⁹⁾ Charles H. Ludington, a Philadelphia publisher, paid for the objects and gave them to the museum.⁽⁵⁾ As the museum’s Bulletin put it in 1923, this was the generosity of three men who did not know one another.⁽⁵⁾\",\"Crofts died in the winter of 1924–25. According to the Bulletin, the department’s new acquisitions that year had all been chosen with him before his death.⁽⁷⁾ How she left “Guanyintang,” and how she came into Crofts’s hands, cannot be traced in published sources. Older museum records placed her in Henan Province;⁽⁴⁾ today only the word “Guanyintang” remains.⁽¹⁾\"],\"items\":[{\"at\":\"Yuan dynasty (1271–1368)\",\"text\":\"Carved in China. Older museum records give her origin as “Guanyintang, Henan”; the current record reads simply “Guanyintang.”⁽¹,⁴⁾\"},{\"at\":\"1896\",\"text\":\"London-born George Crofts arrives in China and goes on to collect and trade in Tianjin for many years.⁽⁸⁾\"},{\"at\":\"Autumn 1923\",\"text\":\"In Beijing, Horace Jayne and Langdon Warner meet Crofts several times and choose a second group of objects with him. The two then set out for Dunhuang.⁽⁶⁾\"},{\"at\":\"November 1923\",\"text\":\"The Pennsylvania Museum (today’s Philadelphia Museum of Art) announces the first part of the Crofts Collection: Toronto shares its source, and Ludington pays.⁽⁵⁾\"},{\"at\":\"1925\",\"text\":\"Crofts has died the previous winter.⁽⁷⁾ The Guanyin enters the museum as a gift of Charles H. Ludington from the George Crofts Collection, accession number 1925-53-11.⁽¹⁾\"},{\"at\":\"Today\",\"text\":\"On view in Gallery 339 of the Philadelphia Museum of Art, sharing the room with the Zhihuasi ceiling.⁽¹,¹¹⁾\"}]},\"refs\":[\"费城艺术博物馆：《Guanyin Seated in Royal Ease》，1925-53-11。用来支撑馆名、元代断代、尺寸、黄木材质与残彩贴金、捐赠署名（Gift of Charles H. Ludington from the George Crofts Collection, 1925）、产地字段「Guanyintang」、现展于 339 展厅，以及展签中背部长方形孔用来装纳圣物、使神像「activate」的说法。https://www.philamuseum.org/objects/41538\",\"费城艺术博物馆：《Seated Guanyin》教育资料 PDF。用来支撑「南海观音」与海边岩崖、自在坐姿、额头圆孔原嵌宝石（象征照亮世间的光）、冠中小阿弥陀佛为识别标志、残存颜料与金箔。https://legacyweb.philamuseum.org/doc_downloads/education/object_resources/41538.pdf\",\"费城艺术博物馆：《Art of China: A Resource for Classroom Teachers》，第 14–15 页。用来支撑自在坐姿、左腿衣褶上的残彩、粗项圈（chunky necklace）。本资料另给出 1287–1368 的断代，正文未采用。https://cdn.sanity.io/files/r7hgx2l2/production/d6d9d1f39fe8ba3f4dd8c3e82541683c8a96c37b.pdf\",\"Internet Archive / Wayback Machine：费城艺术博物馆旧版藏品页存档（2009-07-05、2021-06-21）。用来支撑旧档产地「Kuan Yin Tang, Honan」「Guanyintang, Henan Province」。http://web.archive.org/web/20090705193232/http://www.philamuseum.org/collections/permanent/41538.html ；http://web.archive.org/web/20210621064722/https://philamuseum.org/collection/object/41538\",\"Pennsylvania Museum：《The Crofts Collection》，Pennsylvania Museum Bulletin 第 19 卷第 80 期（1923 年 11 月），第 22–25 页。用来支撑 Crofts、Currelly、Ludington 三方合作，多伦多分享货源、Ludington 出资，及「三个人的慷慨，彼此互不相识」一语（中文为本馆转译）。https://archive.org/details/pennsylvaniamuse80penn\",\"Pennsylvania Museum：《Letters From Mr. Warner and Mr. Jayne》，Pennsylvania Museum Bulletin 第 19 卷第 81 期（1923 年 12 月）。用来支撑 1923 年秋 Jayne 与 Warner 在北京和 Crofts 一起挑选第二批藏品、随后前往敦煌。https://archive.org/details/pennsylvaniamuse81penn\",\"Pennsylvania Museum：《Accessions in the Oriental Department》，Pennsylvania Museum Bulletin 第 21 卷第 99 期（1926 年 1 月），第 68–69 页。用来支撑 Crofts 于 1924–25 年冬去世，以及这一年度东方部新藏品是在他生前与他一同挑定的。https://archive.org/details/pennsylvaniamuse99penn\",\"苏黎世大学 e-aoi「China und der Westen」：《Crofts, George》人物条目（依据 The China Who's Who 1922）。用来支撑 Crofts 生卒年 1871–1925、伦敦人、1896 年来华、在天津收藏与买卖。https://e-aoi.uzh.ch/apps/china-west/entities/23589\",\"皇家安大略博物馆：《China–Canada Untold Stories: The Chinese Art Collection at the ROM》。用来支撑 Crofts 的英国古董商身份，及他与 ROM 馆长 Currelly 的长期供货合作。https://www.rom.on.ca/learn/resources/china-canada-untold-stories-chinese-art-collection-rom\",\"费城艺术博物馆：《Bodhisattva》，1925-53-10。用来支撑同批捐赠的柳木菩萨立像（900–1000 年）同在 339 展厅。https://www.philamuseum.org/objects/41534\",\"费城艺术博物馆：《Coffered Ceiling from Zhihuasi》，1930-38-1a--n。用来支撑智化寺藻井与本像同在 339 展厅。https://www.philamuseum.org/objects/44151\",\"〔唐〕张彦远：《历代名画记》卷十，周昉条（847 年）。用来支撑周昉「妙创水月之体」，说明水月观音样式唐代已有记载。https://zh.wikisource.org/wiki/歷代名畫記/卷第十\",\"John Twilley、Kathleen M. Garland：《The Redecoration History of a Chinese Polychromed Guanyin Attributed to the 11th–12th Century C.E. as Deduced from Stratigraphic Microanalysis》，MRS Online Proceedings Library 1319, article 407（2011）。用来支撑：二十世纪初部分彩绘劣化的造像在艺术市场上被剥除彩绘、露出木胎（stripped to bare wood）。https://doi.org/10.1557/opl.2011.748\"]}},\"unplacedLookPoints\":[],\"lookPoints\":[{\"id\":\"pt-mvx05o3i\",\"title\":\"璎珞\",\"text\":\"比起宋金的几尊水月观音，这尊元代观音的衣纹简洁许多，胸前的璎珞却格外用心：整条弯月形，正中一朵莲花，两侧云头翻卷，下沿联珠镶边。衣袍基础，璎珞就不基础。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[1.218,1.622,-0.245],\"cameraPose\":{\"position\":[-7.842,-2.486,13.507],\"target\":[0.56,0.472,0.468]},\"note\":{\"x\":0.718,\"y\":0.315,\"width\":293}},{\"id\":\"pt-pma-butterfly\",\"title\":\"蝴蝶榫\",\"text\":\"又叫「银锭榫」，木头干缩开裂，工匠在裂缝两边挖出燕尾形的槽，把它嵌进去，裂缝就被咬住，不再张开。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[0.487,-0.462,-0.944],\"cameraPose\":{\"position\":[-7.194,-1.335,9.713],\"target\":[0.497,-1.411,-0.132]},\"note\":{\"x\":0.739,\"y\":0.38,\"width\":325}},{\"id\":\"pt-mvx05sdu\",\"title\":\"暗格\",\"text\":\"转到她背后，会发现发髻、后脑、后背等好几处开口。后背的封板已经丢了，里面空空的⁽¹⁾。木雕造像常把内部掏空：一来防止整木干裂，二来可以放进经卷、舍利之类的装藏。\",\"shortText\":\"$undefined\",\"en\":\"$undefined\",\"img\":\"$undefined\",\"position\":[1.504,0.313,-2.589],\"cameraPose\":{\"position\":[13.088,6.949,-17.812],\"target\":[0.147,1.264,-1.001]},\"note\":{\"x\":0.709,\"y\":0.272,\"width\":355}}]}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"元-木雕水月观音 · Water-Moon Guanyin — Philadelphia, Museum of Art | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Carved in China during the Yuan dynasty, this wooden Guanyin entered the Philadelphia Museum of Art in 1925 and is still on view there. The museum’s records give her origin in a si\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index,
