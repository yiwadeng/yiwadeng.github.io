\":\"家國永安\",\"subtitle\":{\"zh\":\"熙宁四年三月十九日，有人在枕头上写下：家国永安。\",\"en\":\"\"},\"riverLead\":\"$28:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国河南（国内文章定为鲁山段店窑）\",\"en\":\"Henan province, China\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"家国永安枕\",\"oneLiner\":\"熙宁四年三月十九日，有人在枕头上写下：家国永安。\",\"period\":\"北宋熙宁四年（1071）\",\"size\":\"约高 13 厘米，宽 19 厘米，深 12 厘米\",\"craft\":\"白地划花、剔花，珍珠地；磁州窑类型炻器\",\"location\":\"英国 · 伦敦 · 大英博物馆\",\"acc\":[[\"馆藏编号\",\"1914,0413.1\"],[\"入藏年份\",\"1914\"],[\"入藏方式\",\"以 30 英镑购自巴黎 Worch \u0026 Co\"]],\"intro\":[\"九百五十多年前的一个春日，一位工匠在这只瓷枕上刻下了日子：熙宁四年三月十九日画⁽¹⁾。那是 1071 年，宋神宗在位，王安石的变法刚刚推行到第三年。\",\"枕面正中，他用双钩刻了四个大字：家国永安⁽¹⁾。字缝里戳满了细密的小圆圈，像撒了一地珍珠，叫珍珠地⁽²⁾。\",\"右边还有一行小字：元本冶底赵家枕永记⁽¹⁾。这是一家姓赵的作坊，在自己的枕头上留了名。\"],\"about\":{\"title\":\"一只枕头\",\"paras\":[{\"h\":\"宋人枕着瓷睡觉\",\"sub\":\"$undefined\"},\"这只枕头上宽下窄，像一个倒放的梯形，枕面微微凹下去，正好托住后脑⁽²⁾。宋代人夏天枕瓷枕，图的是清凉。\",\"枕面分三格，中间是「家国永安」，左右是年月和作坊的名号⁽¹,²⁾。前面的枕墙也分三格，中间剔刻着一朵扁扁的菊花⁽²⁾。\",{\"h\":\"最早的珍珠地\",\"sub\":\"$undefined\"},\"珍珠地是北方民窑的一种装饰：先在坯上刷一层白色的化妆土，划出主纹，再用细管在空白处一个个戳出小圈。国内学者认为，这只枕是目前发现最早的、带纪年的珍珠地瓷器⁽²⁾。\",{\"h\":\"冶底在哪里\",\"sub\":\"$undefined\"},\"大英把「元本冶底赵家」读作「祖籍冶底的赵家」⁽¹⁾。冶底在哪里，还没有定论。大英只写产地是河南⁽¹⁾，国内的文章定为河南鲁山的段店窑⁽²⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它是怎么从中国到了巴黎的，没有记录。1914 年，大英从巴黎蓝街 9 号的古董商 Worch \u0026 Co 手里，花 30 英镑买下了它⁽¹⁾。十年后，大英的陶瓷专家霍布森把它写进了馆藏远东陶瓷指南⁽¹⁾。\",\"2012 年夏天，它回过一次中国。在北京的中国国家博物馆「瓷之韵」展里待了半年，又回到了伦敦⁽¹⁾。今天它在大英 33 号展厅⁽¹⁾。\"],\"items\":[{\"at\":\"1071 年 3 月 19 日\",\"text\":\"刻下纪年⁽¹⁾。\"},{\"at\":\"1914 年\",\"text\":\"大英以 30 英镑购自巴黎 Worch \u0026 Co⁽¹⁾。\"},{\"at\":\"1924 年\",\"text\":\"霍布森在大英远东陶瓷指南中发表⁽¹⁾。\"},{\"at\":\"2009—2012 年\",\"text\":\"随「中国：东方之旅」展在英国七座城市巡展⁽¹⁾。\"},{\"at\":\"2012 年 6 月—2013 年 1 月\",\"text\":\"回到北京，中国国家博物馆「瓷之韵」展⁽¹⁾。\"}]},\"refs\":[\"大英博物馆：《pillow》，1914,0413.1。用于三处题字的录文与英译、年代、产地、尺寸、霍布森 1924 年首次发表、展览（含 2012 年中国国家博物馆「瓷之韵」）和购入经过。https://www.britishmuseum.org/collection/object/A_1914-0413-1\",\"《大英博物馆藏陶瓷枕》，搜狐号「典藏」，2020 年 2 月 18 日，转自知网。用于鲁山段店窑的定名、元宝形、枕面三区与珍珠地、枕墙扁菊花，及「迄今最早的纪年珍珠地划花瓷器」。https://www.sohu.com/a/374029153_651622\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Pillow inscribed “Jia guo yong an”\",\"oneLiner\":\"\",\"period\":\"Northern Song dynasty, dated 1071\",\"size\":\"H. ca. 13 cm, W. ca. 19 cm, D. ca. 12 cm\",\"craft\":\"Cizhou-type stoneware with slip, incised and carved decoration on a ring-punched ground\",\"location\":\"United Kingdom, London, British Museum\",\"acc\":[[\"Accession no.\",\"1914,0413.1\"],[\"Acquired\",\"1914\"],[\"入藏方式\",\"以 30 英镑购自巴黎 Worch \u0026 Co\"]],\"intro\":[],\"about\":\"$undefined\",\"loss\":\"$undefined\",\"refs\":[\"大英博物馆：《pillow》，1914,0413.1。用于三处题字的录文与英译、年代、产地、尺寸、霍布森 1924 年首次发表、展览（含 2012 年中国国家博物馆「瓷之韵」）和购入经过。https://www.britishmuseum.org/collection/object/A_1914-0413-1\",\"《大英博物馆藏陶瓷枕》，搜狐号「典藏」，2020 年 2 月 18 日，转自知网。用于鲁山段店窑的定名、元宝形、枕面三区与珍珠地、枕墙扁菊花，及「迄今最早的纪年珍珠地划花瓷器」。https://www.sohu.com/a/374029153_651622\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-jg-four\",\"title\":\"家国永安\",\"text\":\"枕面正中双钩刻着「家国永安」，楷书⁽¹⁾。「国」写的是异体「囯」。\"},{\"id\":\"rec-jg-date\",\"title\":\"熙宁四年三月十九日画\",\"text\":\"左边刻着日子：熙宁四年三月十九日，即 1071 年⁽¹⁾。\"},{\"id\":\"rec-jg-zhao\",\"title\":\"冶底赵家\",\"text\":\"右边刻着「元本冶底赵家枕永记」，是赵家作坊留的名号⁽¹⁾。\"},{\"id\":\"rec-jg-pearl\",\"title\":\"珍珠地\",\"text\":\"字缝里戳满了细密的小圆圈，叫珍珠地⁽²⁾。\"},{\"id\":\"rec-jg-flower\",\"title\":\"扁菊花\",\"text\":\"枕墙正面中间，剔刻着一朵扁扁的菊花⁽²⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n2e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device
