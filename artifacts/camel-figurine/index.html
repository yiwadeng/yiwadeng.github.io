\"},\"accessionNumber\":\"2002.7\",\"url\":\"https://art.nelson-atkins.org/objects/32545/central-asian-caravan-woman-rousing-her-camel-while-nursing\"}},\"description\":{\"zh\":\"她骑在一头跪卧的双峰骆驼上，怀里抱着孩子喂奶，右手高高扬起，原本攥着一根穿过骆驼鼻子的缰绳⁽¹⁾。骆驼昂着头，瞪圆了眼，张嘴大叫，脖子绷得紧紧的，很不情愿地要站起来⁽¹⁾。\\n\\n这是一件 8 世纪的唐代陶俑，烧成之后再上彩，专为随葬而做⁽¹⁾。纳尔逊从她的衣着和脸判断，她是突厥人，不是汉人；在商队里，她的职责是照顾一家人⁽¹⁾。驼背前后伸出来的木架子，是毡帐的骨架，卷起来的毡子就塞在架子和骆驼的身子之间⁽¹⁾。她是把家驮在骆驼上赶路的。\",\"en\":\"A woman nurses her child while raising a hand above a kneeling Bactrian camel. The Tang burial sculpture captures a moment of caravan life.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"camel-figurine-draco.glb\"}],\"layout\":\"model-center\",\"animation\":\"rotate\",\"riverTitle\":\"$28:props:children:props:artifact:title\",\"importance\":\"$undefined\",\"watermark\":\"騎駱駝哺乳婦人俑\",\"subtitle\":{\"zh\":\"喂着孩子，也催着骆驼继续上路。\",\"en\":\"Nursing a child, urging a camel onward.\"},\"riverLead\":\"$28:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$28:props:children:props:artifact:title\",\"nameEn\":\"$28:props:children:props:artifact:title\",\"period\":\"$28:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国（出土地不详）\",\"en\":\"China (findspot unknown)\"},\"collection\":\"$28:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$28:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"骑骆驼哺乳妇人俑\",\"oneLiner\":\"喂着孩子，也催着骆驼继续上路。\",\"period\":\"唐代（618—906），8 世纪\",\"size\":\"高 40.6 厘米，宽 45.7 厘米，深 27.9 厘米\",\"craft\":\"陶，烧成后加彩\",\"location\":\"美国 · 堪萨斯城 · 纳尔逊-阿特金斯艺术博物馆\",\"acc\":[[\"馆藏编号\",\"2002.7\"],[\"入藏年份\",\"2002\"]],\"intro\":[\"她骑在一头跪卧的双峰骆驼上，怀里抱着孩子喂奶，右手高高扬起，原本攥着一根穿过骆驼鼻子的缰绳⁽¹⁾。骆驼昂着头，瞪圆了眼，张嘴大叫，脖子绷得紧紧的，很不情愿地要站起来⁽¹⁾。\",\"这是一件 8 世纪的唐代陶俑，烧成之后再上彩，专为随葬而做⁽¹⁾。纳尔逊从她的衣着和脸判断，她是突厥人，不是汉人；在商队里，她的职责是照顾一家人⁽¹⁾。驼背前后伸出来的木架子，是毡帐的骨架，卷起来的毡子就塞在架子和骆驼的身子之间⁽¹⁾。她是把家驮在骆驼上赶路的。\"],\"about\":{\"title\":\"商队\",\"paras\":[{\"h\":\"路上的一家人\",\"sub\":\"$undefined\"},\"唐墓里的骆驼俑很多，驮的多半是货：丝、皮囊、水壶。这一件驮的是一个家。毡帐拆开了，骨架捆在鞍下，毡子卷好塞在一边；母亲骑在两峰之间，一边喂孩子，一边催骆驼起身⁽¹⁾。\",\"纳尔逊的展签说，正是这些家常的细节，被抓在一个正在动的瞬间里，让这件随葬品格外鲜活⁽¹⁾。\",{\"h\":\"她是谁\",\"sub\":\"$undefined\"},\"馆方的判断是突厥人⁽¹⁾。唐代的长安和洛阳住着很多从西边、北边来的人，工匠天天见得到他们，才塑得出这样的神情。\",{\"h\":\"做给死者的\",\"sub\":\"$undefined\"},\"这类陶俑不是摆设，只为下葬而做，陪墓主人去另一个世界⁽¹⁾。墓主人是谁，为什么带上这样一位赶路的母亲，已经无从知道。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"它出土于哪里、哪座墓，没有记录。能查到的最早一次露面，是 2001 年伦敦古董商 Eskenazi 的《唐代陶塑》图录，第 8 号⁽¹⁾。\",\"2002 年，纳尔逊从 John Eskenazi 公司买下了它⁽¹⁾。2001 年以前它在哪里，馆方没有公布。\"],\"items\":[{\"at\":\"8 世纪\",\"text\":\"制成，随葬入墓⁽¹⁾。\"},{\"at\":\"2001 年\",\"text\":\"收入伦敦 Eskenazi《唐代陶塑》图录⁽¹⁾。\"},{\"at\":\"2002 年\",\"text\":\"纳尔逊购入，编号 2002.7⁽¹⁾。\"}]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《Central Asian Caravan Woman Rousing her Camel While Nursing》（騎駱駝哺乳婦人俑），2002.7。用于年代、尺寸、材质、展签（突厥人而非汉人、商队里照顾家人、骆驼的神态、右手原有缰绳、毡帐骨架与卷起的毡子、专为随葬而作）、来源（2002 年购自 John Eskenazi, Ltd.）及著录（Eskenazi《Tang Ceramic Sculpture》，伦敦，2001 年，第 8 号）。https://art.nelson-atkins.org/objects/32545/central-asian-caravan-woman-rousing-her-camel-while-nursing\"]},\"readings\":{\"zh\":\"$28:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Central Asian Caravan Woman Rousing Her Camel While Nursing\",\"oneLiner\":\"Nursing a child, urging a camel onward.\",\"period\":\"Tang dynasty (618–906), 8th century\",\"size\":\"40.64 × 45.72 × 27.94 cm\",\"craft\":\"Earthenware with unfired coloring\",\"location\":\"United States, Kansas City, The Nelson-Atkins Museum of Art\",\"acc\":[[\"Accession no.\",\"2002.7\"],[\"Acquired\",\"2002\"]],\"intro\":[\"A woman nurses her child while raising a hand above a kneeling Bactrian camel. The Tang burial sculpture captures a moment of caravan life.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"The load includes tent equipment. Dress and facial modeling evoke a Central Asian traveler; domestic detail animates a burial object.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"The Nelson-Atkins purchased it from John Eskenazi Ltd. in 2002.\"],\"items\":[{\"at\":\"2002\",\"text\":\"Purchased by the Nelson-Atkins from John Eskenazi Ltd.\"}]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《Central Asian Caravan Woman Rousing her Camel While Nursing》（騎駱駝哺乳婦人俑），2002.7。用于年代、尺寸、材质、展签（突厥人而非汉人、商队里照顾家人、骆驼的神态、右手原有缰绳、毡帐骨架与卷起的毡子、专为随葬而作）、来源（2002 年购自 John Eskenazi, Ltd.）及著录（Eskenazi《Tang Ceramic Sculpture》，伦敦，2001 年，第 8 号）。https://art.nelson-atkins.org/objects/32545/central-asian-caravan-woman-rousing-her-camel-while-nursing\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-camel-1\",\"title\":\"怀里的孩子\",\"text\":\"孩子在左侧吃奶。母亲没有停下来，一边喂，一边赶路⁽¹⁾。\"},{\"id\":\"rec-camel-2\",\"title\":\"扬起的右手\",\"text\":\"右手举得很高，手里原本有一根绳子，一直连到骆驼的鼻子上⁽¹⁾。绳子没了，手势还在。\"},{\"id\":\"rec-camel-3\",\"title\":\"大叫的骆驼\",\"text\":\"头往后仰，眼睛瞪圆，嘴张着叫，脖子绷紧。它不想起来⁽¹⁾。\"},{\"id\":\"rec-camel-4\",\"title\":\"毡帐的骨架\",\"text\":\"鞍毯下面，前后各伸出一截带活节的木架，是毡帐的骨架。卷起来的毡子，塞在架子和骆驼的身子之间⁽¹⁾。\"},{\"id\":\"rec-camel-5\",\"title\":\"烧好再上的颜色\",\"text\":\"颜色是烧成之后才画上去的⁽¹⁾，不像三彩那样有一层釉护着，所以掉得多。\"},{\"id\":\"rec-camel-6\",\"title\":\"她的脸和衣着\",\"text\":\"纳尔逊就是从她的脸和穿戴上，认出她是突厥人，不是汉人⁽¹⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n2d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n39:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\"],\"IconMark\"]\n31:[[\"$\",\"title\",\"0\",{\"children\":\"骑骆驼哺乳妇人俑 · Central Asian Caravan Woman Rousing Her Camel While Nursing | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A woman nurses her child while raising a hand above a kneeling Bactrian camel. The Tang burial sculpture captures a moment of caravan life.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\
