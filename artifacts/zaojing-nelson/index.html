isclosure\":{\"zh\":\"藻井正面模型依据开发者实地摄影测量重建，构件拆分由ChatGPT（GPT-6 Astra）参考{source}（图 7–9）进行模拟推演。目前爆炸效果仅供参考藻井的构成，不包含榫卯结构。\",\"en\":\"The front of the coffered ceiling was reconstructed through photogrammetry using photographs taken on site by the developer. ChatGPT (GPT-6 Astra) simulated the division into components with reference to Figures 7–9 of {source}. The current exploded view serves only as an illustration of the coffered ceiling’s components and does not include mortise-and-tenon joints.\",\"source\":{\"zh\":\"https://caea.lib.uchicago.edu/dcadp/zh/zhihuasi/digital/\",\"en\":\"https://caea.lib.uchicago.edu/dcadp/en/zhihuasi/digital/\"},\"sourceTitle\":{\"zh\":\"芝加哥大学东亚艺术中心发表的《万佛阁的数字复原》\",\"en\":\"Digital Reconstruction of Wanfoge, published by the University of Chicago’s Center for the Art of East Asia\"}},\"status\":\"modeled\",\"dealGroup\":\"object\",\"title\":{\"zh\":\"智化寺万佛阁藻井\",\"en\":\"Coffered Ceiling with Carved Dragons\"},\"typeLabel\":{\"zh\":\"建筑彩绘\",\"en\":\"\"},\"metadata\":{\"period\":{\"zh\":\"明代，1444 年\",\"en\":\"Ming dynasty (1368–1644), 1444\"},\"materialTechnique\":{\"zh\":\"木雕，后加贴金彩绘\",\"en\":\"Wood with later gilding and polychrome\"},\"dimensions\":{\"zh\":\"444.8 × 461.3 厘米\",\"en\":\"444.82 × 461.33 cm\"},\"collection\":{\"museum\":{\"zh\":\"纳尔逊-阿特金斯艺术博物馆\",\"en\":\"The Nelson-Atkins Museum of Art\"},\"city\":{\"zh\":\"堪萨斯城\",\"en\":\"Kansas City\"},\"country\":{\"zh\":\"美国\",\"en\":\"United States\"},\"accessionNumber\":\"31-118/1 A\",\"url\":\"https://art.nelson-atkins.org/objects/12120\"}},\"description\":{\"zh\":\"抬头看。层层木格向中心收拢，四角抹成八角，八角里再套方格，最里面一圈游龙，绕着正中一条俯身向下的团龙⁽⁴⁾。这是北京智化寺万佛阁的藻井，做于 1444 年⁽¹⁾。藻井，是殿堂天花板正中向上凹进去的那一块，罩在佛像的头顶上。\\n\\n智化寺是明英宗的太监王振建的⁽¹⁾。到 1920 年代末，寺里已经穷得撑不下去。1930 年，僧人把藻井拆下来卖了⁽¹⁾。寺里流出的两座藻井，一座去了费城⁽⁵⁾，一座 1931 年到了堪萨斯城，装在纳尔逊「中国庙宇」展厅的头顶，下面坐着木雕水月观音，背后是广胜寺的壁画⁽¹,⁶⁾。\",\"en\":\"This coffered ceiling, dated 1444, comes from the Wanfoge at Beijing’s Zhihua Temple. Carved wood draws the eye toward its center.\"},\"story\":{\"zh\":\"待补充\",\"en\":\"\"},\"models\":[{\"url\":\"zaojing-nelson-hd.glb\"}],\"layout\":\"model-center\",\"animation\":\"static\",\"assets\":{\"modelHd\":\"zaojing-nelson-hd.glb\",\"modelLantern\":\"zaojing-nelson-lantern.glb\"},\"orchestration\":{\"importance\":\"standard\",\"category\":\"object\",\"tags\":[\"藻井\",\"建筑构件\",\"Nelson\"]},\"lanternConfig\":{\"caseType\":\"cube\",\"mount\":\"pedestal\",\"caseFootprint\":0.8,\"paddingSide\":0.11,\"paddingTop\":0.27,\"modelScale\":1,\"modelOffset\":[-0.02,0.07,0],\"artifactLight\":{\"color\":\"#ffd476\",\"intensity\":1.01,\"position\":[-0.03,0.6,0.2],\"rotation\":[10,15,6],\"distance\":3.65,\"decay\":2,\"angle\":1.6703047484373348,\"penumbra\":1},\"caseLight\":{\"color\":\"#83601a\",\"intensity\":0.35,\"position\":[0.05,0.52,0.17],\"distance\":5,\"decay\":2,\"angle\":1.05,\"penumbra\":0.85},\"caseWarmth\":{\"hue\":\"#ffe3b5\",\"intensity\":0.8},\"glow\":{\"color\":\"#c88628\",\"strength\":1.2,\"edgeWidth\":0.014,\"lengthFade\":0.12,\"bottomStrength\":1.5},\"bestFaceYaw\":0,\"yawRange\":45},\"physique\":{\"viewing\":{\"bestFaceYaw\":0,\"yawRange\":90,\"pitchRange\":85,\"fullRotation\":false,\"locked\":false,\"minDistanceScale\":1},\"motion\":{\"breathe\":{\"enabled\":false,\"amplitude\":0.05,\"period\":4.19},\"rotate\":{\"enabled\":true,\"speed\":0.06}}},\"section1\":{\"model\":{\"renderMode\":\"standard\"},\"stagePose\":{\"yaw\":0,\"pitch\":0,\"distanceFactor\":1.12,\"centerX\":0.38,\"centerY\":0},\"toolAnchor\":{\"x\":0.11,\"y\":0.37},\"lighting\":{\"envIntensity\":0.85,\"exposure\":1}},\"mediaType\":\"real3d\",\"riverImageUrl\":\"/index/river/impostor-placeholder.svg\",\"particleLoader\":true,\"riverTitle\":\"$2a:props:children:props:artifact:title\",\"importance\":\"standard\",\"watermark\":\"智化寺萬佛閣藻井\",\"subtitle\":{\"zh\":\"仰望的九龙，离开了它们原来的天空。\",\"en\":\"Carved dragons beneath a displaced sky.\"},\"riverLead\":\"$2a:props:children:props:artifact:subtitle\",\"identity\":{\"nameZh\":\"$2a:props:children:props:artifact:title\",\"nameEn\":\"$2a:props:children:props:artifact:title\",\"period\":\"$2a:props:children:props:artifact:metadata:period\",\"originPlace\":{\"zh\":\"中国北京，智化寺如来殿上层万佛阁\",\"en\":\"Pavilion of Ten Thousand Buddhas (Wanfoge), Zhihua Temple, Beijing, China\"},\"collection\":\"$2a:props:children:props:artifact:metadata:collection\",\"curatorPhrase\":\"$2a:props:children:props:artifact:subtitle\",\"dispersalPath\":{\"zh\":\"\",\"en\":\"\"}},\"reading\":{\"language\":\"zh\",\"narration\":\"$undefined\",\"title\":\"智化寺万佛阁藻井\",\"oneLiner\":\"仰望的九龙，离开了它们原来的天空。\",\"period\":\"明代，1444 年\",\"size\":\"444.8 × 461.3 厘米\",\"craft\":\"木雕，后加贴金彩绘\",\"location\":\"美国 · 堪萨斯城 · 纳尔逊-阿特金斯艺术博物馆\",\"acc\":[[\"馆藏编号\",\"31-118/1 A\"],[\"入藏年份\",\"1931\"]],\"intro\":[\"抬头看。层层木格向中心收拢，四角抹成八角，八角里再套方格，最里面一圈游龙，绕着正中一条俯身向下的团龙⁽⁴⁾。这是北京智化寺万佛阁的藻井，做于 1444 年⁽¹⁾。藻井，是殿堂天花板正中向上凹进去的那一块，罩在佛像的头顶上。\",\"智化寺是明英宗的太监王振建的⁽¹⁾。到 1920 年代末，寺里已经穷得撑不下去。1930 年，僧人把藻井拆下来卖了⁽¹⁾。寺里流出的两座藻井，一座去了费城⁽⁵⁾，一座 1931 年到了堪萨斯城，装在纳尔逊「中国庙宇」展厅的头顶，下面坐着木雕水月观音，背后是广胜寺的壁画⁽¹,⁶⁾。\"],\"about\":{\"title\":\"藻井\",\"paras\":[{\"h\":\"斗八\",\"sub\":\"$undefined\"},\"智化寺的藻井是「斗八」式：四米见方的井口，四角用支条抹成八角形，再叠两层方格，套出一个内八角。方格的边上是卷云和莲瓣，空当里嵌着八宝；内八角和井心之间的斜板上雕一圈游龙，正中是一条俯视的团龙⁽⁴⁾。\",{\"h\":\"拼乱了的八宝\",\"sub\":\"$undefined\"},\"西安交通大学和芝加哥大学的团队给纳尔逊这座藻井做了三维扫描和数字复原。他们发现，围着中心的八块菱形板和八块三角板是可以互换的零件，博物馆现在装的顺序，和明代「八吉祥」的标准次序对不上⁽²⁾。也就是说，拆散、运走、再拼起来的时候，顺序拼乱了。\",\"还少了东西。藻井下沿原本有一圈架在云纹梁上的小殿阁，叫「天宫楼阁」，现在展厅里只剩主藻井和周围的天花板⁽²⁾。\",{\"h\":\"一座藻井，三种木头\",\"sub\":\"$undefined\"},\"它是什么木头做的，三处说法不一样。纳尔逊的著录写的是柏木⁽¹⁾；国内的文章说是楠木⁽³⁾；费城那座同出一寺的姐妹藻井，馆方写的是椴木和松木⁽⁵⁾。\",\"楠木的说法还连着一个流传很广的故事：藻井先被棺材铺买走，纳尔逊的史克曼赶在它被锯开之前，花八百银元抢了下来。这个故事出自史克曼本人 1987 年的一封信。纳尔逊现在的档案说它没有得到证实，可能是把「楠木常用来做棺材」这件事混了进去⁽¹⁾。\",{\"h\":\"留在北京的那一座\",\"sub\":\"$undefined\"},\"智化寺原有三座藻井：智化殿、万佛阁、藏殿⁽³⁾。前两座流失海外，藏殿那座还在原处⁽⁴⁾。万佛阁顶上支撑藻井的木框也还在寺里，西北角留着四块同款的彩绘天花板⁽²⁾。\"]},\"loss\":{\"title\":\"收藏与流转\",\"note\":\"\",\"paras\":[\"1920 年代末，智化寺经济困难。1930 年，僧人把万佛阁的藻井拆下来卖了⁽¹⁾。国内的文章说得更具体：住持吸鸦片，七八个和尚穷得连袈裟都买不起，经一位姓纪的掮客，作价一千大洋卖出⁽³⁾。\",\"纳尔逊这边的记录是这样的：博物馆的顾问华尔纳，先从德国古董商沃尔希（Edgar Worch）寄来的一张照片上知道了这座藻井，便让在北京的学生史克曼去买。1931 年 5 月，史克曼通过一位年轻的中国买办，从英国女商人普纳特（Edith Punnett）在北京开的古董行里买下了它。普纳特是不是直接从寺里买的，馆方说还在查⁽¹⁾。\",\"营造学社的刘敦桢 1932 年发表《北平智化寺如来殿调查记》，是这座殿最早的测绘记录，里面收有这座藻井的图版⁽¹,²⁾。\",\"近年做数字复原的研究者认为，实物回到智化寺「不可操作」：所有权在海外，寺里的木构也老了⁽²⁾。它能回去的，暂时只有数字的那一份。\"],\"items\":[{\"at\":\"1443—1444 年\",\"text\":\"太监王振建智化寺，万佛阁藻井做成⁽¹,²⁾。\"},{\"at\":\"1679 年\",\"text\":\"地震后寺院大修⁽²⁾。\"},{\"at\":\"1930 年\",\"text\":\"僧人拆下万佛阁藻井出售⁽¹⁾。同年，智化殿藻井入藏费城艺术博物馆⁽⁵⁾。\"},{\"at\":\"1931 年 5 月\",\"text\":\"史克曼经普纳特的古董行为纳尔逊买下，编号 31-118/1 A⁽¹⁾。\"},{\"at\":\"1932 年\",\"text\":\"刘敦桢发表《北平智化寺如来殿调查记》⁽¹⁾。\"},{\"at\":\"1933 年 12 月\",\"text\":\"纳尔逊开馆，藻井装在「中国庙宇」展厅顶上⁽⁶⁾。\"},{\"at\":\"1987 年\",\"text\":\"史克曼在一封信里讲了「棺材铺」的故事⁽¹⁾。\"},{\"at\":\"2025 年\",\"text\":\"西安交大与芝加哥大学团队发表万佛阁的数字复原⁽²⁾。\"}]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《Coffered Vault with Carved Dragons, China, Beijing, Zhihua Temple》，31-118/1 A。用于年代、尺寸、材质（柏木、后加贴金彩绘）、王振建寺、1930 年僧人拆卖、沃尔希的照片、1931 年 5 月经史克曼购自普纳特古董行、「棺材铺」一说出自史克曼 1987 年信且未经证实，及刘敦桢 1932 年调查记。https://art.nelson-atkins.org/objects/12120\",\"Qiang Chen 等：《Virtual reconstruction of Wanfoge in Beijing Zhihua Temple》，Journal of Cultural Heritage 73（2025）: 382–392。用于始建年份、八宝与八吉祥构件的安装次序有误、「天宫楼阁」缺失、寺内尚存的木框与四块天花板、1679 年震后大修，及实物回归「不可操作」。doi:10.1016/j.culher.2025.04.016\",\"立佳：《智化寺智化殿藻井：彩云易散月长亏》，界面新闻转载，2019 年 4 月 26 日。用于楠木之说、寺内原有三座藻井，及住持吸鸦片、经纪姓掮客作价一千大洋的说法。文章未注出处。https://www.jiemian.com/article/3079423.html\",\"《买藻井冰箱贴只需跨条街，见识藻井全部的美得跨太平洋》，北京日报客户端，2026 年 5 月 28 日。用于斗八式的做法、卷云莲瓣与八宝、游龙与团龙，及藏殿藻井仍在原处。https://news.bjd.com.cn/2026/05/28/11770546.shtml\",\"费城艺术博物馆：《Coffered Ceiling from Zhihuasi (Temple of Transforming Wisdom)》，1930-38-1a–n。用于同寺另一座藻井的材质（椴木、松木）、尺寸及 1930 年入藏。https://www.philamuseum.org/objects/44151\",\"陆斯嘉：《流散海外百年后，山西广胜寺三幅元代壁画「数字合璧」》，澎湃新闻，2025 年 3 月 31 日。用于纳尔逊「中国庙堂厅」的组成：广胜寺壁画、木雕水月观音、智化寺藻井与清代槅扇。https://www.thepaper.cn/newsDetail_forward_30533521\"]},\"readings\":{\"zh\":\"$2a:props:children:props:artifact:reading\",\"en\":{\"language\":\"en\",\"narration\":\"$undefined\",\"title\":\"Coffered Ceiling with Carved Dragons\",\"oneLiner\":\"Carved dragons beneath a displaced sky.\",\"period\":\"Ming dynasty (1368–1644), 1444\",\"size\":\"444.82 × 461.33 cm\",\"craft\":\"Wood with later gilding and polychrome\",\"location\":\"United States, Kansas City, The Nelson-Atkins Museum of Art\",\"acc\":[[\"Accession no.\",\"31-118/1 A\"],[\"Acquired\",\"1931\"]],\"intro\":[\"This coffered ceiling, dated 1444, comes from the Wanfoge at Beijing’s Zhihua Temple. Carved wood draws the eye toward its center.\"],\"about\":{\"title\":\"Looking closer\",\"paras\":[\"Museum records distinguish the Ming coffered ceiling from later ceiling panels and miniature structures. They should not be treated as one undifferentiated object.\"]},\"loss\":{\"title\":\"Collection and provenance\",\"note\":\"Documented collection events do not establish the full removal history.\",\"paras\":[\"The museum records a 1931 purchase from E. A. Punnett \u0026 Co. through Warner and Sickman. The coffin-shop anecdote remains unverified.\"],\"items\":[{\"at\":\"1931\",\"text\":\"Purchased from E. A. Punnett \u0026 Co. through Warner and Sickman.\"}]},\"refs\":[\"纳尔逊-阿特金斯艺术博物馆：《Coffered Vault with Carved Dragons, China, Beijing, Zhihua Temple》，31-118/1 A。用于年代、尺寸、材质（柏木、后加贴金彩绘）、王振建寺、1930 年僧人拆卖、沃尔希的照片、1931 年 5 月经史克曼购自普纳特古董行、「棺材铺」一说出自史克曼 1987 年信且未经证实，及刘敦桢 1932 年调查记。https://art.nelson-atkins.org/objects/12120\",\"Qiang Chen 等：《Virtual reconstruction of Wanfoge in Beijing Zhihua Temple》，Journal of Cultural Heritage 73（2025）: 382–392。用于始建年份、八宝与八吉祥构件的安装次序有误、「天宫楼阁」缺失、寺内尚存的木框与四块天花板、1679 年震后大修，及实物回归「不可操作」。doi:10.1016/j.culher.2025.04.016\",\"立佳：《智化寺智化殿藻井：彩云易散月长亏》，界面新闻转载，2019 年 4 月 26 日。用于楠木之说、寺内原有三座藻井，及住持吸鸦片、经纪姓掮客作价一千大洋的说法。文章未注出处。https://www.jiemian.com/article/3079423.html\",\"《买藻井冰箱贴只需跨条街，见识藻井全部的美得跨太平洋》，北京日报客户端，2026 年 5 月 28 日。用于斗八式的做法、卷云莲瓣与八宝、游龙与团龙，及藏殿藻井仍在原处。https://news.bjd.com.cn/2026/05/28/11770546.shtml\",\"费城艺术博物馆：《Coffered Ceiling from Zhihuasi (Temple of Transforming Wisdom)》，1930-38-1a–n。用于同寺另一座藻井的材质（椴木、松木）、尺寸及 1930 年入藏。https://www.philamuseum.org/objects/44151\",\"陆斯嘉：《流散海外百年后，山西广胜寺三幅元代壁画「数字合璧」》，澎湃新闻，2025 年 3 月 31 日。用于纳尔逊「中国庙堂厅」的组成：广胜寺壁画、木雕水月观音、智化寺藻井与清代槅扇。https://www.thepaper.cn/newsDetail_forward_30533521\"]}},\"unplacedLookPoints\":[{\"id\":\"rec-zaojing-1\",\"title\":\"团龙\",\"text\":\"正中一条龙，头朝下，俯视着殿里。周围的斜板上，还有一圈游龙绕着它⁽⁴⁾。\"},{\"id\":\"rec-zaojing-2\",\"title\":\"斗八\",\"text\":\"数一数：方形的井口，四角抹掉成了八角，八角里又套着两层方格，一层一层往里收。这种做法叫「斗八」⁽⁴⁾。\"},{\"id\":\"rec-zaojing-3\",\"title\":\"八宝的顺序\",\"text\":\"方格的空当里嵌着八宝。研究者发现，这些板子现在的顺序和明代的规矩对不上，是拆运重装的时候拼乱的⁽²⁾。\"},{\"id\":\"rec-zaojing-4\",\"title\":\"后加的金\",\"text\":\"馆方的材质一栏写着「木，后加贴金彩绘」⁽¹⁾。你看到的金，不全是 1444 年的。\"},{\"id\":\"rec-zaojing-5\",\"title\":\"少了的天宫楼阁\",\"text\":\"藻井的下沿，原本还有一圈小小的殿阁，架在云纹梁上，像天上的宫殿。它们丢了⁽²⁾。\"},{\"id\":\"rec-zaojing-6\",\"title\":\"卷云和莲瓣\",\"text\":\"凑近看方格的边：一圈卷云，一圈莲瓣⁽⁴⁾。\"}],\"lookPoints\":\"$undefined\"}}]}]\n31:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n3d:I[27201,[\"$2\",\"$3\",\"$4\",\"$5\",\"$6\",\"$7\",\"$8\",\"$9\",\"$a\",\"$b\",\"$c\",\"$d\",\"$e\",\"$f\",\"$10\",\"$11\",\"$12\",\"$13\",\"$14\",\"$15\",\"$16\"],\"IconMark\"]\n35:[[\"$\",\"title\",\"0\",{\"children\":\"智化寺万佛阁藻井 · Coffered Ceiling with Carved Dragons | Wandering Museum\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"This coffered ceiling, dated 1444, comes from the Wanfoge at Beijing’s Zhihua Temple. Carved wood draws the eye toward its center.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.wanderingmuseum.org/artifacts/zaojing-nelson\"}],[\"$\",\"link\",\"4\",{\"rel\":\"alternate\",\"hrefLang\":\"zh-CN\",\"href\":\"https://wanderingmuseum.com/artifacts/zaojing-nelson\"}],[\"$\",\"link\",\"5\",{\"rel\":\"alternate\",\"hrefLang\":\"en\",\"href\":\"https://www.wanderingmuseum.org/artifacts/zaojing-nelson\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:title\",\"content\":\"智化寺万佛阁藻井 · Coffered Ceiling with Carved Dragons | Wandering Museum\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:description\",\"content\":\"This coffered ceiling, dated 1444, comes from the Wanfoge at Beijing’s Zhihua Temple. Carved wood draws the eye toward its center.\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:url\",\"content\":\"https://www.wanderingmuseum.org/artifacts/zaojing-nelson\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://www.wanderingmuseum.org/index/baked/art-zaojing-nelson-0.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Coffered Ceiling with Carved Dragons\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"智化寺万佛阁藻井 · Coffered Ceiling with Carved Dragons | Wandering Museum\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"This coffered ceiling, dated 1444, comes from the Wanfoge at Beijing’s Zhihua Temple. Carved wood draws the eye toward its center.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"https://www.wanderingmuseum.org/index/baked/art-zaojing-nelson-0.jpg\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L3d\",\"17\",{}]]\n38:null\n"])</script></body></html>
